<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>租赁管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">租赁管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="stat-card-value">76</div><div class="stat-card-label">生效合同</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value">8</div><div class="stat-card-label">30天内到期</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="stat-card-value">¥285K</div><div class="stat-card-label">月租总额</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="stat-card-value">92%</div><div class="stat-card-label">出租率</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" id="searchInput" class="search-input" placeholder="搜索合同号、业主、租户"><select id="filterStatus" class="filter-select"><option value="">全部状态</option><option value="1">生效中</option><option value="0">已到期</option><option value="2">提前终止</option></select><button id="btnSearch" class="btn btn-ghost">搜索</button></div></div><button id="btnAdd" class="btn btn-primary">+ 新建合同</button></div>
      <div class="data-card"><table><thead><tr><th>合同编号</th><th>业主</th><th>租户</th><th>房屋</th><th>租期</th><th>月租金</th><th>剩余天数</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table><div class="table-footer"><span class="table-footer-info">加载中...</span><div class="pagination"><button class="page-btn disabled">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div></div></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script><script src="../js/api.js"></script><script src="../js/page-common.js"></script><script>
initPage({
  name: '租赁管理',
  api: {
    findPage: API.rentalFindPage,
    findById: API.rentalFindById,
    add: API.rentalAdd,
    edit: API.rentalEdit,
    delete: API.rentalDelete,
    renew: API.rentalRenew,
    terminate: API.rentalTerminate
  },
  renderRow: function(item, index) {
    var statusMap = {0: ['tag-off', '提前终止'], 1: ['tag-ok', '生效中'], 2: ['tag-overdue', '已到期']};
    var s = statusMap[item.status] || statusMap[1];
    var daysLeft = item.daysLeft != null ? item.daysLeft + '天' : '-';
    var actionBtns = item.status == 1 ? '<button class="btn-icon">续签</button><button class="btn-icon btn-icon-danger">终止</button>' : '<button class="btn-icon">查看</button>';
    return '<td>' + (item.contractNo || item.id || '-') + '</td>' +
      '<td>' + (item.ownerName || '-') + '</td>' +
      '<td>' + (item.tenantName || '-') + '</td>' +
      '<td>' + (item.houseName || '-') + '</td>' +
      '<td>' + (item.leaseStart || '-') + ' ~ ' + (item.leaseEnd || '-') + '</td>' +
      '<td>¥' + (item.monthlyRent || 0) + '</td>' +
      '<td>' + daysLeft + '</td>' +
      '<td><span class="tag ' + s[0] + '">' + s[1] + '</span></td>' +
      '<td class="action-btns">' + actionBtns + '</td>';
  },
  hashActions: { add: function(){ openAddModal(); }, expire: function(){
    API.rentalExpire(30).then(function(res){
      if (res && res.flag) {
        var list = res.data || [];
        showToast('30天内到期合同：' + list.length + ' 份');
        if (list.length > 0) {
          tableData = list;
          filteredData = list.slice();
          renderTable();
          var info = document.querySelector('.table-footer-info');
          if (info) info.innerHTML = '30天内到期合同：' + list.length + ' 份';
        }
      }
    });
  } },
});
initSidebar('rental:list');
</script>
<div class="modal-overlay" id="editModal"><div class="modal"><h3>编辑信息</h3><div class="form-group"><label>名称 *</label><input type="text" class="form-input" placeholder="请输入"></div><div class="form-group"><label>备注</label><textarea class="form-input" rows="3" placeholder="备注信息"></textarea></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('edit')">取消</button><button class="btn btn-primary">保存修改</button></div></div></div>
</body>
</html>
