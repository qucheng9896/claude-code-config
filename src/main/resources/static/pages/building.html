<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楼栋管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">楼栋管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats" id="buildingStats">
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">楼栋总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-card-value" id="s-households">-</div><div class="stat-card-label">总户数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg></div><div class="stat-card-value" id="s-occupied">-</div><div class="stat-card-label">已入住</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg></div><div class="stat-card-value" id="s-rate">-</div><div class="stat-card-label">入住率</div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-group">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索楼栋名称">
            <button class="btn btn-ghost" id="btnSearch">搜索</button>
          </div>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ 新增楼栋</button>
      </div>
      <div class="data-card">
        <table><thead><tr><th>ID</th><th>楼栋名称</th><th>层数</th><th>单元数</th><th>总户数</th><th>入住率(%)</th><th>建筑年份</th><th>操作</th></tr></thead>
        <tbody id="buildingTbody"></tbody></table>
        <div class="table-footer"><span class="table-footer-info" id="tableInfo">加载中...</span><div class="pagination" id="pagination"></div></div>
      </div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="formModal"><div class="modal"><h3 id="modalTitle">新增楼栋</h3><input type="hidden" id="f-id">
  <div class="form-group"><label>楼栋名称 *</label><input type="text" class="form-input" id="f-name" placeholder="如：A座"></div>
  <div class="form-group"><label>层数 *</label><input type="number" class="form-input" id="f-floors" placeholder="如：24"></div>
  <div class="form-group"><label>单元数 *</label><input type="number" class="form-input" id="f-units" placeholder="如：2"></div>
  <div class="form-group"><label>总户数 *</label><input type="number" class="form-input" id="f-households" placeholder="如：96"></div>
  <div class="form-group"><label>入住率(%)</label><input type="number" class="form-input" id="f-rate" placeholder="如：95" min="0" max="100"></div>
  <div class="form-group"><label>建筑年份</label><input type="number" class="form-input" id="f-year" placeholder="如：2020"></div>
  <div class="form-group"><label>备注</label><textarea class="form-input" id="f-remark" rows="2" placeholder="备注信息"></textarea></div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 2, totalPages = 1;
function showToast(msg, type) { var el = document.getElementById('toast'); if (!el) return; el.textContent = msg; el.className = 'toast show toast-' + (type || 'success'); clearTimeout(el._timer); el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000); }
function loadList(page) { currentPage = page || 1; var q = document.getElementById('searchInput').value.trim(); axios.post('/building/findPage', { currentPage: currentPage, pageSize: pageSize, queryString: q }).then(function(res) { renderTable(res.data.rows); totalPages = Math.ceil(res.data.total / pageSize) || 1; renderPagination(document.getElementById('tableInfo'), res.data.total); loadStats(); }).catch(function() { showToast('加载失败', 'error'); }); }
function renderTable(list) { var tb = document.getElementById('buildingTbody'); if (!list || !list.length) { tb.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>'; return; } var h = ''; list.forEach(function(b) { var rc = b.occupancyRate >= 90 ? 'tag-ok' : (b.occupancyRate >= 60 ? 'tag-info' : 'tag-off'); h += '<tr><td>' + b.id + '</td><td><strong>' + escapeHtml(b.buildingName) + '</strong></td><td>' + b.floors + '</td><td>' + b.units + '</td><td>' + b.totalHouseholds + '</td><td><span class="tag ' + rc + '">' + b.occupancyRate + '%</span></td><td>' + (b.buildYear || '-') + '</td><td class="action-btns"><button class="btn-icon btn-edit" data-id="' + b.id + '">编辑</button><button class="btn-icon btn-icon-danger btn-del" data-id="' + b.id + '">删除</button></td></tr>'; }); tb.innerHTML = h; tb.querySelectorAll('.btn-edit').forEach(function(b) { b.addEventListener('click', function() { openEdit(this.dataset.id); }); }); tb.querySelectorAll('.btn-del').forEach(function(b) { b.addEventListener('click', function() { doDelete(this.dataset.id); }); }); }
function renderPagination(infoEl, total) { infoEl.textContent = '显示第' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条'; var pag = document.getElementById('pagination'); var h = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">‹</button>'; for (var p = 1; p <= totalPages; p++) { h += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>'; } h += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">›</button>'; pag.innerHTML = h; pag.querySelectorAll('.page-btn').forEach(function(btn) { btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); }); }); }
function loadStats() { axios.get('/building/stats').then(function(res) { if (!res.flag) return; var d = res.data; var stats = d.buildingStats || []; document.getElementById('s-total').textContent = stats.length; document.getElementById('s-households').textContent = d.totalHouses || 0; document.getElementById('s-occupied').textContent = d.occupiedHouses || 0; var rate = d.totalHouses > 0 ? (d.occupiedHouses * 100 / d.totalHouses).toFixed(1) : '0'; document.getElementById('s-rate').textContent = rate + '%'; }).catch(function() {}); }
function openAdd() { document.getElementById('modalTitle').textContent = '新增楼栋'; document.getElementById('f-id').value = ''; document.getElementById('f-name').value = ''; document.getElementById('f-floors').value = ''; document.getElementById('f-units').value = ''; document.getElementById('f-households').value = ''; document.getElementById('f-rate').value = ''; document.getElementById('f-year').value = ''; document.getElementById('f-remark').value = ''; document.getElementById('formModal').classList.add('show'); }
function openEdit(id) { axios.get('/building/findById/' + id).then(function(res) { var b = res.data; document.getElementById('modalTitle').textContent = '编辑楼栋'; document.getElementById('f-id').value = b.id; document.getElementById('f-name').value = b.buildingName || ''; document.getElementById('f-floors').value = b.floors || ''; document.getElementById('f-units').value = b.units || ''; document.getElementById('f-households').value = b.totalHouseholds || ''; document.getElementById('f-rate').value = b.occupancyRate || ''; document.getElementById('f-year').value = b.buildYear || ''; document.getElementById('f-remark').value = b.remark || ''; document.getElementById('formModal').classList.add('show'); }); }
function doSave() { var id = document.getElementById('f-id').value; var data = { buildingName: document.getElementById('f-name').value.trim(), floors: parseInt(document.getElementById('f-floors').value) || 0, units: parseInt(document.getElementById('f-units').value) || 0, totalHouseholds: parseInt(document.getElementById('f-households').value) || 0, occupancyRate: parseInt(document.getElementById('f-rate').value) || 0, buildYear: parseInt(document.getElementById('f-year').value) || null, remark: document.getElementById('f-remark').value.trim() }; if (!data.buildingName) { showToast('请填写楼栋名称', 'error'); return; } var p = id ? axios.put('/building/edit', Object.assign({ id: parseInt(id) }, data)) : axios.post('/building/add', data); p.then(function() { showToast(id ? '修改成功' : '新增成功'); closeModal('form'); loadList(currentPage); }).catch(function() {}); }
function doDelete(id) { if (!confirm('确认删除该楼栋吗？此操作不可恢复。')) return; axios.delete('/building/delete/' + id).then(function() { showToast('删除成功'); loadList(currentPage); }).catch(function() {}); }
function closeModal(n) { document.getElementById(n + 'Modal').classList.remove('show'); }
function escapeHtml(s) { return s ? s.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '-'; }
document.getElementById('btnAdd').addEventListener('click', openAdd); document.getElementById('btnSave').addEventListener('click', doSave); document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); }); document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); }); document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });
loadList(1);
initSidebar('building:list');
</script>
</body>
</html>
