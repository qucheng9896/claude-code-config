<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楼栋管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">楼栋管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div><div class="stat-card-value">12</div><div class="stat-card-label">楼栋总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-card-value">520</div><div class="stat-card-label">总户数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg></div><div class="stat-card-value">499</div><div class="stat-card-label">已入住</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg></div><div class="stat-card-value">95.2%</div><div class="stat-card-label">入住率</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" id="searchInput" class="search-input" placeholder="搜索楼栋"><select id="filterStatus" class="filter-select"><option value="">全部状态</option><option value="1">正常</option><option value="0">停用</option></select><button id="btnSearch" class="btn btn-ghost">搜索</button></div></div><button id="btnAdd" class="btn btn-primary">+ 新增楼栋</button></div>
      <div class="data-card"><table><thead><tr><th>楼栋编号</th><th>楼栋名称</th><th>层数</th><th>单元数</th><th>总户数</th><th>入住率</th><th>建筑年份</th><th>操作</th></tr></thead><tbody></tbody></table><div class="table-footer"><span class="table-footer-info">加载中...</span><div class="pagination"><button class="page-btn disabled">‹</button><button class="page-btn active">1</button><button class="page-btn">›</button></div></div></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script><script src="../js/api.js"></script><script src="../js/page-common.js"></script><script>
initPage({
  name: '楼栋管理',
  api: {
    findPage: API.buildingFindPage,
    findById: API.buildingFindById,
    add: API.buildingAdd,
    edit: API.buildingEdit,
    delete: API.buildingDelete
  },
  renderRow: function(item, index) {
    var rate = item.occupancyRate || 0;
    var rateClass = rate >= 90 ? 'tag-ok' : rate >= 70 ? 'tag-info' : 'tag-off';
    return '<td>' + item.id + '</td>' +
      '<td><strong>' + item.buildingName + '</strong></td>' +
      '<td>' + item.floors + '</td>' +
      '<td>' + item.units + '</td>' +
      '<td>' + item.totalHouseholds + '</td>' +
      '<td><span class="tag ' + rateClass + '">' + rate + '%</span></td>' +
      '<td>' + (item.buildYear || '-') + '</td>' +
      '<td class="action-btns"><button class="btn-icon">查看房屋</button><button class="btn-icon">编辑</button></td>';
  },
  hashActions: { add: function(){ openAddModal(); } }
});
initSidebar('building:list');
</script>
<div class="modal-overlay" id="addModal"><div class="modal"><h3>新增楼栋</h3><div class="form-group"><label>楼栋名称 *</label><input type="text" class="form-input" placeholder="如：A座"></div><div class="form-group"><label>层数 *</label><input type="number" class="form-input" placeholder="如：24"></div><div class="form-group"><label>单元数 *</label><input type="number" class="form-input" placeholder="如：2"></div><div class="form-group"><label>总户数 *</label><input type="number" class="form-input" placeholder="如：96"></div><div class="form-group"><label>建筑年份</label><input type="number" class="form-input" placeholder="如：2020"></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('add')">取消</button><button class="btn btn-primary" onclick="API.buildingAdd({id:null,buildingName:document.querySelector('#addModal input[placeholder=\'如：A座\']').value,floors:parseInt(document.querySelector('#addModal input[placeholder=\'如：24\']').value),units:parseInt(document.querySelector('#addModal input[placeholder=\'如：2\']').value),totalHouseholds:parseInt(document.querySelector('#addModal input[placeholder=\'如：96\']').value)}).then(function(r){if(r.flag){closeModal('add');_pageApi.loadData(1);}})">保存</button></div></div></div>
<div class="modal-overlay" id="editModal"><div class="modal"><h3>编辑信息</h3><div class="form-group"><label>名称 *</label><input type="text" class="form-input" placeholder="请输入"></div><div class="form-group"><label>备注</label><textarea class="form-input" rows="3" placeholder="备注信息"></textarea></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('edit')">取消</button><button class="btn btn-primary">保存修改</button></div></div></div>
</body>
</html>
