<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物业员工 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">物业员工</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="stat-card-value">28</div><div class="stat-card-label">在职员工</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div><div class="stat-card-value">6</div><div class="stat-card-label">维修师傅</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><div class="stat-card-value">8</div><div class="stat-card-label">安保人员</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value">92.5%</div><div class="stat-card-label">出勤率</div></div>
      </div>

      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
        <div style="flex:1;min-width:200px;background:white;border:1px solid #e2e8f0;border-radius:10px;padding:16px;border-left:4px solid #2563eb;"><div style="font-size:12px;color:#64748b;">管理层</div><div style="font-size:20px;font-weight:700;margin-top:4px;">3 人</div><div style="font-size:11px;color:#94a3b8;">经理/主管/前台</div></div>
        <div style="flex:1;min-width:200px;background:white;border:1px solid #e2e8f0;border-radius:10px;padding:16px;border-left:4px solid #059669;"><div style="font-size:12px;color:#64748b;">维修服务</div><div style="font-size:20px;font-weight:700;margin-top:4px;">6 人</div><div style="font-size:11px;color:#94a3b8;">电工/水工/电梯/综合</div></div>
        <div style="flex:1;min-width:200px;background:white;border:1px solid #e2e8f0;border-radius:10px;padding:16px;border-left:4px solid #d97706;"><div style="font-size:12px;color:#64748b;">安保团队</div><div style="font-size:20px;font-weight:700;margin-top:4px;">8 人</div><div style="font-size:11px;color:#94a3b8;">门岗/巡逻/监控</div></div>
        <div style="flex:1;min-width:200px;background:white;border:1px solid #e2e8f0;border-radius:10px;padding:16px;border-left:4px solid #7c3aed;"><div style="font-size:12px;color:#64748b;">保洁绿化</div><div style="font-size:20px;font-weight:700;margin-top:4px;">11 人</div><div style="font-size:11px;color:#94a3b8;">保洁员/绿化工</div></div>
      </div>

      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" placeholder="搜索员工姓名、手机号"><select class="filter-select"><option value="">全部岗位</option><option>经理</option><option>主管</option><option>维修技师</option><option>安保员</option><option>保洁员</option><option>绿化工</option><option>前台</option></select><select class="filter-select"><option value="">全部状态</option><option>在职</option><option>休假</option><option>离职</option></select><button class="btn btn-ghost">搜索</button></div></div><button class="btn btn-primary">+ 新增员工</button></div>
      <div class="data-card"><table><thead><tr><th>工号</th><th>姓名</th><th>手机号</th><th>岗位</th><th>部门</th><th>入职日期</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table><div class="table-footer"><span class="table-footer-info">加载中...</span><div class="pagination"><button class="page-btn disabled">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div></div></div>
    </div>
  </main>
</div>
<script src="../js/sidebar.js"></script><script src="../js/page-common.js"></script><script>
initPage({
  name: '物业员工',
  api: {
    findPage: API.employeeFindPage,
    findById: API.employeeFindById,
    add: API.employeeAdd,
    edit: API.employeeEdit,
    delete: API.employeeDelete
  },
  renderRow: function(item, index) {
    var statusClass = item.status == 1 ? 'tag-ok' : item.status == 2 ? 'tag-paid' : 'tag-off';
    var statusText = item.status == 1 ? '在职' : item.status == 2 ? '休假' : '离职';
    return '<td>' + item.id + '</td>' +
      '<td><strong>' + item.employeeName + '</strong></td>' +
      '<td>' + (item.phone || '-') + '</td>' +
      '<td>' + (item.position || '-') + '</td>' +
      '<td>' + (item.department || '-') + '</td>' +
      '<td>' + (item.hireDate || '-') + '</td>' +
      '<td><span class="tag ' + statusClass + '">' + statusText + '</span></td>' +
      '<td class="action-btns"><button class="btn-icon">排班</button><button class="btn-icon">编辑</button></td>';
  },
  hashActions: { add: function(){ openAddModal(); } }
});
initSidebar('employee:list');
</script>
<div class="modal-overlay" id="editModal"><div class="modal"><h3>编辑信息</h3><div class="form-group"><label>名称 *</label><input type="text" class="form-input" placeholder="请输入"></div><div class="form-group"><label>备注</label><textarea class="form-input" rows="3" placeholder="备注信息"></textarea></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('edit')">取消</button><button class="btn btn-primary">保存修改</button></div></div></div>
</body>
</html>
