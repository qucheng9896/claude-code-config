<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物业员工 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">物业员工</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-blue"></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">员工总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-green"></div><div class="stat-card-value" id="s-active">-</div><div class="stat-card-label">在职员工</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"></div><div class="stat-card-value" id="s-repair">-</div><div class="stat-card-label">维修师傅</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"></div><div class="stat-card-value" id="s-security">-</div><div class="stat-card-label">安保人员</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" id="searchInput" placeholder="搜索员工姓名、手机号"><select class="filter-select" id="filterPosition"><option value="">全部岗位</option><option>经理</option><option>主管</option><option>维修技工</option><option>安保员</option><option>保洁员</option><option>绿化工</option><option>前台</option></select><select class="filter-select" id="filterStatus"><option value="">全部状态</option><option value="1">在职</option><option value="0">离职</option><option value="2">休假</option></select><button class="btn btn-ghost" id="btnSearch">搜索</button></div></div><button class="btn btn-primary" id="btnAdd">+ 新增员工</button></div>
      <div class="data-card"><table><thead><tr><th>工号</th><th>姓名</th><th>手机号</th><th>岗位</th><th>部门</th><th>入职日期</th><th>出勤天数</th><th>工单数</th><th>评分</th><th>状态</th><th>操作</th></tr></thead><tbody id="employeeTbody"></tbody></table>
        <div class="table-footer"><span class="table-footer-info" id="tableInfo">加载中...</span><div class="pagination" id="pagination"></div></div>
      </div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="formModal"><div class="modal"><h3 id="modalTitle">新增员工</h3><input type="hidden" id="f-id">
  <div class="form-group"><label>工号 *</label><input type="text" class="form-input" id="f-empNo" placeholder="如：E001"></div>
  <div class="form-group"><label>姓名 *</label><input type="text" class="form-input" id="f-name" placeholder="请输入姓名"></div>
  <div class="form-group"><label>手机号 *</label><input type="text" class="form-input" id="f-phone" placeholder="请输入手机号"></div>
  <div class="form-group"><label>岗位</label><input type="text" class="form-input" id="f-position" placeholder="如：维修技工"></div>
  <div class="form-group"><label>部门</label><input type="text" class="form-input" id="f-department" placeholder="如：工程部"></div>
  <div class="form-group"><label>入职日期</label><input type="date" class="form-input" id="f-hireDate"></div>
  <div class="form-group"><label>状态</label><select class="form-input" id="f-status"><option value="1">在职</option><option value="0">离职</option><option value="2">休假</option></select></div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;
function showToast(msg) { var el = document.getElementById("toast"); if (!el) return; el.textContent = msg; el.className = "toast show"; setTimeout(function() { el.className = "toast"; }, 3000); }
function loadList(page) {
  currentPage = page || 1;
  var q = document.getElementById("searchInput").value.trim();
  var position = document.getElementById("filterPosition").value;
  var status = document.getElementById("filterStatus").value;
  var params = { currentPage: currentPage, pageSize: pageSize, queryString: q };
  if (position) params.position = position;
  if (status) params.status = parseInt(status);
  axios.post("/employee/findPage", params).then(function(res) {
    renderTable(res.data.rows);
    totalPages = Math.ceil(res.data.total / pageSize) || 1;
    document.getElementById("tableInfo").textContent = "显示第" + ((currentPage-1)*pageSize+1) + "-" + Math.min(currentPage*pageSize, res.data.total) + " 条，共 " + res.data.total + " 条";
    renderPagination();
    loadStats(res.data.total);
  });
}
function renderTable(list) {
  var tb = document.getElementById("employeeTbody");
  if (!list || !list.length) { tb.innerHTML = "<tr><td colspan=\"11\" style=\"text-align:center;color:#94a3b8;padding:40px\">暂无数据</td></tr>"; return; }
  var h = "";
  list.forEach(function(e) {
    var statusMap = { "1": "<span class='tag tag-ok'>在职</span>", "0": "<span class='tag tag-off'>离职</span>", "2": "<span class='tag tag-paid'>休假</span>" };
    h += "<tr><td>" + (e.empNo || "-") + "</td><td><strong>" + (e.name || "-") + "</strong></td><td>" + (e.phone || "-") + "</td><td>" + (e.position || "-") + "</td><td>" + (e.department || "-") + "</td><td>" + (e.hireDate ? e.hireDate.substring(0,10) : "-") + "</td><td>" + (e.attendanceDays || 0) + "</td><td>" + (e.orderCount || 0) + "</td><td>" + (e.rating ? "⭐" + e.rating : "-") + "</td><td>" + (statusMap[e.status] || "-") + "</td><td class='action-btns'><button class='btn-icon btn-edit' data-id='" + e.id + "'>编辑</button><button class='btn-icon btn-icon-danger btn-del' data-id='" + e.id + "'>删除</button></td></tr>";
  });
  tb.innerHTML = h;
  tb.querySelectorAll(".btn-edit").forEach(function(b) { b.addEventListener("click", function() { openEdit(this.dataset.id); }); });
  tb.querySelectorAll(".btn-del").forEach(function(b) { b.addEventListener("click", function() { doDelete(this.dataset.id); }); });
}
function renderPagination() {
  var p = document.getElementById("pagination");
  var h = "<button class='page-btn" + (currentPage<=1?" disabled":"") + "' data-page='" + (currentPage-1) + "'>‹</button>";
  for (var i=1;i<=totalPages;i++) h += "<button class='page-btn"+(i===currentPage?" active":"")+"' data-page='"+i+"'>"+i+"</button>";
  h += "<button class='page-btn"+(currentPage>=totalPages?" disabled":"")+"' data-page='"+(currentPage+1)+"'>›</button>";
  p.innerHTML = h;
  p.querySelectorAll(".page-btn").forEach(function(b) { b.addEventListener("click", function() { var pg=parseInt(this.dataset.page); if(pg>=1&&pg<=totalPages) loadList(pg); }); });
}
function loadStats(total) {
  document.getElementById("s-total").textContent = total || 0;
  axios.post("/employee/findPage", { currentPage: 1, pageSize: 1, status: 1 }).then(function(res) { document.getElementById("s-active").textContent = res.data.total || 0; });
  axios.post("/employee/findPage", { currentPage: 1, pageSize: 1, position: "维修技工" }).then(function(res) { document.getElementById("s-repair").textContent = res.data.total || 0; });
  axios.post("/employee/findPage", { currentPage: 1, pageSize: 1, position: "安保员" }).then(function(res) { document.getElementById("s-security").textContent = res.data.total || 0; });
}
function openAdd() {
  document.getElementById("modalTitle").textContent = "新增员工";
  document.getElementById("f-id").value = "";
  ["f-empNo","f-name","f-phone","f-position","f-department","f-hireDate"].forEach(function(id){document.getElementById(id).value="";});
  document.getElementById("f-status").value = "1";
  document.getElementById("formModal").classList.add("show");
}
function openEdit(id) {
  axios.get("/employee/findById/" + id).then(function(res) {
    var e = res.data;
    document.getElementById("modalTitle").textContent = "编辑员工";
    document.getElementById("f-id").value = e.id;
    document.getElementById("f-empNo").value = e.empNo || "";
    document.getElementById("f-name").value = e.name || "";
    document.getElementById("f-phone").value = e.phone || "";
    document.getElementById("f-position").value = e.position || "";
    document.getElementById("f-department").value = e.department || "";
    document.getElementById("f-hireDate").value = e.hireDate ? e.hireDate.substring(0,10) : "";
    document.getElementById("f-status").value = e.status != null ? e.status : "1";
    document.getElementById("formModal").classList.add("show");
  });
}
function doSave() {
  var id = document.getElementById("f-id").value;
  var data = {
    empNo: document.getElementById("f-empNo").value.trim(),
    name: document.getElementById("f-name").value.trim(),
    phone: document.getElementById("f-phone").value.trim(),
    position: document.getElementById("f-position").value.trim(),
    department: document.getElementById("f-department").value.trim(),
    hireDate: document.getElementById("f-hireDate").value || null,
    status: parseInt(document.getElementById("f-status").value)
  };
  if (!data.name) { showToast("请填写姓名"); return; }
  var p = id ? axios.put("/employee/edit", Object.assign({ id: parseInt(id) }, data)) : axios.post("/employee/add", data);
  p.then(function() { showToast(id ? "修改成功" : "新增成功"); closeModal("form"); loadList(currentPage); });
}
function doDelete(id) { if (!confirm("确认删除该员工吗？此操作不可恢复。")) return; axios.delete("/employee/delete/" + id).then(function() { showToast("删除成功"); loadList(currentPage); }); }
function closeModal(n) { document.getElementById(n + "Modal").classList.remove("show"); }
document.getElementById("btnAdd").addEventListener("click", openAdd);
document.getElementById("btnSave").addEventListener("click", doSave);
document.getElementById("btnSearch").addEventListener("click", function() { loadList(1); });
document.getElementById("searchInput").addEventListener("keydown", function(e) { if (e.key === "Enter") loadList(1); });
document.getElementById("filterPosition").addEventListener("change", function() { loadList(1); });
document.getElementById("filterStatus").addEventListener("change", function() { loadList(1); });
document.getElementById("formModal").addEventListener("click", function(e) { if (e.target === this) this.classList.remove("show"); });
loadList(1); initSidebar("employee:list");
</script>
</body>
</html>
