<!DOCTYPE html><html lang="zh-CN"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>物业员工 - 物业管理系统</title>  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">  <link rel="stylesheet" href="../css/common.css"></head><body><div class="toast" id="toast"></div><div class="admin-layout">  <div id="sidebar-placeholder"></div>  <main class="main-content">    <div class="topbar"><div class="topbar-title">物业员工</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>    <div class="page-body">      <div class="stats" id="empStats">        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">员工总数</div></div>        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div><div class="stat-card-value" id="s-active">-</div><div class="stat-card-label">在职</div></div>        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><div class="stat-card-value" id="s-leave">-</div><div class="stat-card-label">休假</div></div>        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value" id="s-quit">-</div><div class="stat-card-label">离职</div></div>      </div>      <div class="toolbar">        <div class="toolbar-left">          <div class="search-group">            <input type="text" class="search-input" id="searchInput" placeholder="搜索员工姓名、工号">            <button class="btn btn-ghost" id="btnSearch">搜索</button>          </div>          <select class="form-input" id="filterDept" style="width:auto;margin-left:8px;">            <option value="">全部部门</option>            <option value="工程部">工程部</option>            <option value="安保部">安保部</option>            <option value="客服部">客服部</option>            <option value="综合管理部">综合管理部</option>          </select>          <select class="form-input" id="filterStatus" style="width:auto;margin-left:8px;">            <option value="">全部状态</option>            <option value="1">在职</option>            <option value="2">休假</option>            <option value="0">离职</option>          </select>        </div>        <button class="btn btn-primary" id="btnAdd">+ 新增员工</button>      </div>      <div class="data-card">        <table>          <thead><tr><th>工号</th><th>姓名</th><th>手机号</th><th>岗位</th><th>部门</th><th>入职日期</th><th>本月出勤</th><th>本月工单</th><th>评分</th><th>状态</th><th>操作</th></tr></thead>          <tbody id="empTbody"></tbody>        </table>        <div class="table-footer">          <span class="table-footer-info" id="tableInfo">加载中...</span>          <div class="pagination" id="pagination"></div>        </div>      </div>    </div>  </main></div><div class="modal-overlay" id="formModal">  <div class="modal">    <h3 id="modalTitle">新增员工</h3>    <input type="hidden" id="f-id">    <div class="form-group"><label>工号 *</label><input type="text" class="form-input" id="f-empno" placeholder="如：E001"></div>    <div class="form-group"><label>姓名 *</label><input type="text" class="form-input" id="f-name" placeholder="请输入姓名"></div>    <div class="form-group"><label>手机号</label><input type="text" class="form-input" id="f-phone" placeholder="请输入手机号"></div>    <div class="form-group"><label>岗位</label><input type="text" class="form-input" id="f-position" placeholder="如：维修技工"></div>    <div class="form-group"><label>部门</label>      <select class="form-input" id="f-dept">        <option value="工程部">工程部</option>        <option value="安保部">安保部</option>        <option value="客服部">客服部</option>        <option value="综合管理部">综合管理部</option>      </select>    </div>    <div class="form-group"><label>入职日期</label><input type="date" class="form-input" id="f-hiredate"></div>    <div class="form-group"><label>状态</label>      <select class="form-input" id="f-status"><option value="1">在职</option><option value="2">休假</option><option value="0">离职</option></select>    </div>    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>  </div></div>  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script><script src="../js/axios-config.js"></script><script src="../js/sidebar.js"></script><script>var currentPage = 1, pageSize = 10, totalPages = 1;function showToast(msg, type) {  var el = document.getElementById('toast');  if (!el) return;  el.textContent = msg;  el.className = 'toast show toast-' + (type || 'success');  clearTimeout(el._timer);  el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000);}function loadList(page) {  currentPage = page || 1;  var queryString = document.getElementById('searchInput').value.trim();  var dept = document.getElementById('filterDept').value;  var status = document.getElementById('filterStatus').value;  if (dept) queryString = queryString ? queryString + ' ' + dept : dept;  if (status) queryString = queryString ? queryString + ' ' + status : status;  axios.post('/employee/findPage', { currentPage: currentPage, pageSize: pageSize, queryString: queryString }).then(function(res) {    renderTable(res.data.rows);    totalPages = Math.ceil(res.data.total / pageSize) || 1;    renderPagination(document.getElementById('tableInfo'), res.data.total);    loadStats();  }).catch(function() { showToast('加载失败', 'error'); });}function renderTable(list) {  var tbody = document.getElementById('empTbody');  if (!list || list.length === 0) {    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>';    return;  }  var html = '';  list.forEach(function(e) {    var statusTag = e.status == 1 ? '<span class="tag tag-ok">在职</span>' : (e.status == 2 ? '<span class="tag tag-paid">休假</span>' : '<span class="tag tag-off">离职</span>');    html += '<tr>';    html += '<td>' + escapeHtml(e.empNo) + '</td>';    html += '<td><strong>' + escapeHtml(e.name) + '</strong></td>';    html += '<td>' + escapeHtml(e.phone || '-') + '</td>';    html += '<td>' + escapeHtml(e.position || '-') + '</td>';    html += '<td>' + escapeHtml(e.department || '-') + '</td>';    html += '<td>' + (e.hireDate ? e.hireDate.substr(0, 10) : '-') + '</td>';    html += '<td>' + (e.attendanceDays || 0) + '天</td>';    html += '<td>' + (e.orderCount || 0) + '</td>';    html += '<td>' + (e.rating ? '?' + e.rating : '-') + '</td>';    html += '<td>' + statusTag + '</td>';    html += '<td class="action-btns">';    html += '<button class="btn-icon btn-edit" data-id="' + e.id + '">编辑</button>';    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + e.id + '">删除</button>';    html += '</td></tr>';  });  tbody.innerHTML = html;  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });}function renderPagination(infoEl, total) {  infoEl.textContent = '显示第 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条';  var pag = document.getElementById('pagination');  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">?</button>';  for (var p = 1; p <= totalPages; p++) html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">?</button>';  pag.innerHTML = html;  pag.querySelectorAll('.page-btn').forEach(function(btn) {    btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); });  });}function loadStats() {  axios.post('/employee/findPage', { currentPage: 1, pageSize: 9999, queryString: '' }).then(function(res) {    var list = res.data.rows;    document.getElementById('s-total').textContent = list.length;    document.getElementById('s-active').textContent = list.filter(function(e) { return e.status == 1; }).length;    document.getElementById('s-leave').textContent = list.filter(function(e) { return e.status == 2; }).length;    document.getElementById('s-quit').textContent = list.filter(function(e) { return e.status == 0; }).length;  });}function openAdd() {  document.getElementById('modalTitle').textContent = '新增员工';  document.getElementById('f-id').value = '';  document.getElementById('f-empno').value = '';  document.getElementById('f-name').value = '';  document.getElementById('f-phone').value = '';  document.getElementById('f-position').value = '';  document.getElementById('f-dept').value = '工程部';  document.getElementById('f-hiredate').value = '';  document.getElementById('f-status').value = '1';  document.getElementById('formModal').classList.add('show');}function openEdit(id) {  axios.get('/employee/findById/' + id).then(function(res) {    var e = res.data;    document.getElementById('modalTitle').textContent = '编辑员工';    document.getElementById('f-id').value = e.id;    document.getElementById('f-empno').value = e.empNo || '';    document.getElementById('f-name').value = e.name || '';    document.getElementById('f-phone').value = e.phone || '';    document.getElementById('f-position').value = e.position || '';    document.getElementById('f-dept').value = e.department || '工程部';    document.getElementById('f-hiredate').value = e.hireDate ? e.hireDate.substr(0, 10) : '';    document.getElementById('f-status').value = e.status != null ? e.status : '1';    document.getElementById('formModal').classList.add('show');  });}function doSave() {  var id = document.getElementById('f-id').value;  var data = {    empNo: document.getElementById('f-empno').value.trim(),    name: document.getElementById('f-name').value.trim(),    phone: document.getElementById('f-phone').value.trim(),    position: document.getElementById('f-position').value.trim(),    department: document.getElementById('f-dept').value,    hireDate: document.getElementById('f-hiredate').value || null,    status: parseInt(document.getElementById('f-status').value)  };  if (!data.empNo) { showToast('请填写工号', 'error'); return; }  if (!data.name) { showToast('请填写姓名', 'error'); return; }  var promise = id ? axios.put('/employee/edit', Object.assign({id: parseInt(id)}, data)) : axios.post('/employee/add', data);  promise.then(function() { showToast(id ? '修改成功' : '新增成功'); closeModal('form'); loadList(currentPage); }).catch(function() {});}function doDelete(id) {  if (!confirm('确认删除该员工吗？此操作不可恢复。')) return;  axios.delete('/employee/delete/' + id).then(function() { showToast('删除成功'); loadList(currentPage); }).catch(function() {});}function closeModal(name) { document.getElementById(name + 'Modal').classList.remove('show'); }function escapeHtml(s) { return s ? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '-'; }document.getElementById('btnAdd').addEventListener('click', openAdd);document.getElementById('btnSave').addEventListener('click', doSave);document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); });document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); });document.getElementById('filterDept').addEventListener('change', function() { loadList(1); });document.getElementById('filterStatus').addEventListener('change', function() { loadList(1); });document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });loadList(1);initSidebar('employee:list');</script></body></html>
