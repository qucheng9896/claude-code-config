<!DOCTYPE html><html lang="zh-CN"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>鍏叡璁炬柦 - 鐗╀笟绠＄悊绯荤粺</title>  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">  <link rel="stylesheet" href="../css/common.css"></head><body><div class="toast" id="toast"></div><div class="admin-layout">  <div id="sidebar-placeholder"></div>  <main class="main-content">    <div class="topbar"><div class="topbar-title">鍏叡璁炬柦</div><div class="topbar-user"><span>娆㈣繋锛?strong>绠＄悊鍛?/strong></span><div class="topbar-avatar">A</div></div></div>    <div class="page-body">      <div class="stats" id="facilityStats">        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">璁炬柦鎬绘暟</div></div>        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg></div><div class="stat-card-value" id="s-normal">-</div><div class="stat-card-label">姝ｅ父</div></div>        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div><div class="stat-card-value" id="s-repair">-</div><div class="stat-card-label">闇€缁翠慨</div></div>        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg></div><div class="stat-card-value" id="s-checking">-</div><div class="stat-card-label">妫€淇腑</div></div>      </div>      <div class="toolbar">        <div class="toolbar-left">          <div class="search-group">            <input type="text" class="search-input" id="searchInput" placeholder="鎼滅储璁炬柦鍚嶇О銆佷綅缃?>            <button class="btn btn-ghost" id="btnSearch">鎼滅储</button>          </div>          <select class="form-input" id="filterType" style="width:auto;margin-left:8px;">            <option value="">鍏ㄩ儴绫诲瀷</option>            <option value="鐢垫">鐢垫</option>            <option value="閰嶇數鎴?>閰嶇數鎴?/option>            <option value="姘存车鎴?>姘存车鎴?/option>            <option value="娑堥槻璁炬柦">娑堥槻璁炬柦</option>            <option value="缁垮寲鍖哄煙">缁垮寲鍖哄煙</option>            <option value="閬撹矾/鍥村">閬撹矾/鍥村</option>          </select>          <select class="form-input" id="filterStatus" style="width:auto;margin-left:8px;">            <option value="">鍏ㄩ儴鐘舵€?/option>            <option value="1">姝ｅ父</option>            <option value="2">闇€缁翠慨</option>            <option value="3">妫€淇腑</option>          </select>        </div>        <button class="btn btn-primary" id="btnAdd">+ 鏂板璁炬柦</button>      </div>      <div class="data-card">        <table>          <thead><tr><th>ID</th><th>璁炬柦鍚嶇О</th><th>绫诲瀷</th><th>浣嶇疆</th><th>鏁伴噺/闈㈢Н</th><th>缁存姢璐熻矗浜?/th><th>涓婃妫€淇?/th><th>涓嬫妫€淇?/th><th>鐘舵€?/th><th>鎿嶄綔</th></tr></thead>          <tbody id="facilityTbody"></tbody>        </table>        <div class="table-footer">          <span class="table-footer-info" id="tableInfo">鍔犺浇涓?..</span>          <div class="pagination" id="pagination"></div>        </div>      </div>    </div>  </main></div><div class="modal-overlay" id="formModal">  <div class="modal">    <h3 id="modalTitle">鏂板璁炬柦</h3>    <input type="hidden" id="f-id">    <div class="form-group"><label>璁炬柦鍚嶇О *</label><input type="text" class="form-input" id="f-name" placeholder="濡傦細1鏍嬬數姊疉"></div>    <div class="form-group"><label>绫诲瀷</label>      <select class="form-input" id="f-type">        <option value="鐢垫">鐢垫</option>        <option value="閰嶇數鎴?>閰嶇數鎴?/option>        <option value="姘存车鎴?>姘存车鎴?/option>        <option value="娑堥槻璁炬柦">娑堥槻璁炬柦</option>        <option value="缁垮寲鍖哄煙">缁垮寲鍖哄煙</option>        <option value="閬撹矾/鍥村">閬撹矾/鍥村</option>      </select>    </div>    <div class="form-group"><label>浣嶇疆</label><input type="text" class="form-input" id="f-location" placeholder="濡傦細1鏍?鍗曞厓"></div>    <div class="form-group"><label>鏁伴噺/闈㈢Н</label><input type="text" class="form-input" id="f-quantity" placeholder="濡傦細2鍙?1000kg)"></div>    <div class="form-group"><label>缁存姢璐熻矗浜?/label><input type="text" class="form-input" id="f-maintainer" placeholder="濡傦細寮犲笀鍌?></div>    <div class="form-group"><label>涓婃妫€淇?/label><input type="date" class="form-input" id="f-last"></div>    <div class="form-group"><label>涓嬫妫€淇?/label><input type="date" class="form-input" id="f-next"></div>    <div class="form-group"><label>鐘舵€?/label>      <select class="form-input" id="f-status"><option value="1">姝ｅ父</option><option value="2">闇€缁翠慨</option><option value="3">妫€淇腑</option></select>    </div>    <div class="form-group"><label>澶囨敞</label><textarea class="form-input" id="f-remark" rows="2" placeholder="澶囨敞淇℃伅"></textarea></div>    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">鍙栨秷</button><button class="btn btn-primary" id="btnSave">淇濆瓨</button></div>  </div></div>  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script><script src="../js/axios-config.js"></script><script src="../js/sidebar.js"></script><script>var currentPage = 1, pageSize = 10, totalPages = 1;function showToast(msg, type) {  var el = document.getElementById('toast');  if (!el) return;  el.textContent = msg;  el.className = 'toast show toast-' + (type || 'success');  clearTimeout(el._timer);  el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000);}function fmtDate(d) {  if (!d) return '-';  var dt = new Date(d);  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');}function loadList(page) {  currentPage = page || 1;  var queryString = document.getElementById('searchInput').value.trim();  var typeVal = document.getElementById('filterType').value;  var statusVal = document.getElementById('filterStatus').value;  var combinedQuery = typeVal ? (queryString ? queryString + ' ' + typeVal : typeVal) : queryString;  axios.post('/facility/findPage', {    currentPage: currentPage,    pageSize: pageSize,    queryString: combinedQuery,    status: statusVal !== '' ? parseInt(statusVal) : null  }).then(function(res) {    renderTable(res.data.rows);    totalPages = Math.ceil(res.data.total / pageSize) || 1;    renderPagination(document.getElementById('tableInfo'), res.data.total);    loadStats();  }).catch(function() { showToast('鍔犺浇澶辫触', 'error'); });}function renderTable(list) {  var tbody = document.getElementById('facilityTbody');  if (!list || list.length === 0) {    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#94a3b8;padding:40px">鏆傛棤鏁版嵁</td></tr>';    return;  }  var html = '';  list.forEach(function(f) {    var statusTag = f.status == 1 ? '<span class="tag tag-ok">姝ｅ父</span>' : (f.status == 2 ? '<span class="tag tag-confirm">闇€缁翠慨</span>' : '<span class="tag tag-off">妫€淇腑</span>');    html += '<tr>';    html += '<td>' + f.id + '</td>';    html += '<td><strong>' + escapeHtml(f.name) + '</strong></td>';    html += '<td>' + escapeHtml(f.type || '-') + '</td>';    html += '<td>' + escapeHtml(f.location || '-') + '</td>';    html += '<td>' + escapeHtml(f.quantity || '-') + '</td>';    html += '<td>' + escapeHtml(f.maintainer || '-') + '</td>';    html += '<td>' + fmtDate(f.lastCheck) + '</td>';    html += '<td>' + fmtDate(f.nextCheck) + '</td>';    html += '<td>' + statusTag + '</td>';    html += '<td class="action-btns">';    html += '<button class="btn-icon btn-edit" data-id="' + f.id + '">缂栬緫</button>';    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + f.id + '">鍒犻櫎</button>';    html += '</td></tr>';  });  tbody.innerHTML = html;  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });}function renderPagination(infoEl, total) {  if (total === 0) { infoEl.textContent = '鏆傛棤鏁版嵁'; document.getElementById('pagination').innerHTML = ''; return; }  infoEl.textContent = '鏄剧ず绗?' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 鏉★紝鍏?' + total + ' 鏉?;  var pag = document.getElementById('pagination');  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">鈥?/button>';  for (var p = 1; p <= totalPages; p++) html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">鈥?/button>';  pag.innerHTML = html;  pag.querySelectorAll('.page-btn').forEach(function(btn) {    btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); });  });}function loadStats() {  axios.get('/facility/stats').then(function(res) {    if (res.flag) {      var d = res.data;      document.getElementById('s-total').textContent = d.total || 0;      document.getElementById('s-normal').textContent = d.normal || 0;      document.getElementById('s-repair').textContent = d.needRepair || 0;      document.getElementById('s-checking').textContent = d.checking || 0;    }  });}function openAdd() {  document.getElementById('modalTitle').textContent = '鏂板璁炬柦';  document.getElementById('f-id').value = '';  document.getElementById('f-name').value = '';  document.getElementById('f-type').value = '鐢垫';  document.getElementById('f-location').value = '';  document.getElementById('f-quantity').value = '';  document.getElementById('f-maintainer').value = '';  document.getElementById('f-last').value = '';  document.getElementById('f-next').value = '';  document.getElementById('f-status').value = '1';  document.getElementById('f-remark').value = '';  document.getElementById('formModal').classList.add('show');}function openEdit(id) {  axios.get('/facility/findById/' + id).then(function(res) {    var f = res.data;    document.getElementById('modalTitle').textContent = '缂栬緫璁炬柦';    document.getElementById('f-id').value = f.id;    document.getElementById('f-name').value = f.name || '';    document.getElementById('f-type').value = f.type || '鐢垫';    document.getElementById('f-location').value = f.location || '';    document.getElementById('f-quantity').value = f.quantity || '';    document.getElementById('f-maintainer').value = f.maintainer || '';    document.getElementById('f-last').value = f.lastCheck ? f.lastCheck.substr(0, 10) : '';    document.getElementById('f-next').value = f.nextCheck ? f.nextCheck.substr(0, 10) : '';    document.getElementById('f-status').value = f.status != null ? f.status : '1';    document.getElementById('f-remark').value = f.remark || '';    document.getElementById('formModal').classList.add('show');  });}function doSave() {  var id = document.getElementById('f-id').value;  var data = {    name: document.getElementById('f-name').value.trim(),    type: document.getElementById('f-type').value,    location: document.getElementById('f-location').value.trim(),    quantity: document.getElementById('f-quantity').value.trim(),    maintainer: document.getElementById('f-maintainer').value.trim(),    lastCheck: document.getElementById('f-last').value || null,    nextCheck: document.getElementById('f-next').value || null,    status: parseInt(document.getElementById('f-status').value),    remark: document.getElementById('f-remark').value.trim()  };  if (!data.name) { showToast('璇峰～鍐欒鏂藉悕绉?, 'error'); return; }  var promise = id ? axios.put('/facility/edit', Object.assign({id: parseInt(id)}, data)) : axios.post('/facility/add', data);  promise.then(function() { showToast(id ? '淇敼鎴愬姛' : '鏂板鎴愬姛'); closeModal('form'); loadList(currentPage); }).catch(function() {});}function doDelete(id) {  if (!confirm('纭鍒犻櫎璇ヨ鏂藉悧锛熸鎿嶄綔涓嶅彲鎭㈠銆?)) return;  axios.delete('/facility/delete/' + id).then(function() { showToast('鍒犻櫎鎴愬姛'); loadList(currentPage); }).catch(function() {});}function closeModal(name) { document.getElementById(name + 'Modal').classList.remove('show'); }function escapeHtml(s) { return s ? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '-'; }document.getElementById('btnAdd').addEventListener('click', openAdd);document.getElementById('btnSave').addEventListener('click', doSave);document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); });document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); });document.getElementById('filterType').addEventListener('change', function() { loadList(1); });document.getElementById('filterStatus').addEventListener('change', function() { loadList(1); });document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });loadList(1);initSidebar('facility:list');</script></body></html>
