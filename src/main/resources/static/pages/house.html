<!DOCTYPE html><html lang="zh-CN"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>住宅管理 - 物业管理系统</title>  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">  <link rel="stylesheet" href="../css/common.css"></head><body><div class="toast" id="toast"></div><div class="admin-layout">  <div id="sidebar-placeholder"></div>  <main class="main-content">    <div class="topbar"><div class="topbar-title">住宅管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>    <div class="page-body">      <div class="stats" id="houseStats">        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">房屋总数</div></div>        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-card-value" id="s-occupied">-</div><div class="stat-card-label">已入住</div></div>        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></div><div class="stat-card-value" id="s-vacant">-</div><div class="stat-card-label">空置</div></div>        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div><div class="stat-card-value" id="s-buildings">-</div><div class="stat-card-label">楼栋数量</div></div>      </div>      <div class="toolbar">        <div class="toolbar-left">          <div class="search-group">            <input type="text" class="search-input" id="searchInput" placeholder="搜索楼栋、房间号、业主">            <button class="btn btn-ghost" id="btnSearch">搜索</button>          </div>          <select class="form-input" id="filterStatus" style="width:auto;margin-left:8px;">            <option value="">全部状态</option>            <option value="1">已入住</option>            <option value="0">空置</option>          </select>        </div>        <button class="btn btn-primary" id="btnAdd">+ 新增房屋</button>      </div>      <div class="data-card">        <table>          <thead><tr><th>ID</th><th>楼栋</th><th>房间号</th><th>面积(㎡)</th><th>户型</th><th>业主</th><th>租户</th><th>状态</th><th>操作</th></tr></thead>          <tbody id="houseTbody"></tbody>        </table>        <div class="table-footer">          <span class="table-footer-info" id="tableInfo">加载中...</span>          <div class="pagination" id="pagination"></div>        </div>      </div>    </div>  </main></div><!-- 新增/编辑弹窗 --><div class="modal-overlay" id="formModal">  <div class="modal">    <h3 id="modalTitle">新增房屋</h3>    <input type="hidden" id="f-id">    <div class="form-group"><label>楼栋 *</label>      <select class="form-input" id="f-building"></select>    </div>    <div class="form-group"><label>房间号 *</label><input type="text" class="form-input" id="f-room" placeholder="如：1001"></div>    <div class="form-group"><label>面积(㎡) *</label><input type="number" step="0.01" class="form-input" id="f-area" placeholder="如：89.50"></div>    <div class="form-group"><label>户型</label><input type="text" class="form-input" id="f-type" placeholder="如：三室一厅"></div>    <div class="form-group"><label>业主</label>      <select class="form-input" id="f-owner"><option value="">-- 无 --</option></select>    </div>    <div class="form-group"><label>租户</label>      <select class="form-input" id="f-tenant"><option value="">-- 无 --</option></select>    </div>    <div class="form-group"><label>状态</label>      <select class="form-input" id="f-status"><option value="0">空置</option><option value="1">已入住</option></select>    </div>    <div class="form-group"><label>备注</label><textarea class="form-input" id="f-remark" rows="2" placeholder="备注信息"></textarea></div>    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>  </div></div>  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script><script src="../js/axios-config.js"></script><script src="../js/sidebar.js"></script><script src="../js/page-common.js"></script><script>var currentPage = 1;var pageSize = 10;var totalPages = 1;var buildingList = [];function showToast(msg, type) {  var el = document.getElementById('toast');  if (!el) return;  el.textContent = msg;  el.className = 'toast show toast-' + (type || 'success');  clearTimeout(el._timer);  el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000);}function loadBuildings() {  return axios.post('/building/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {    buildingList = res.data.rows;    var opts = '<option value="">请选择楼栋</option>';    buildingList.forEach(function(b) { opts += '<option value="' + b.id + '">' + escapeHtml(b.buildingName) + '</option>'; });    document.getElementById('f-building').innerHTML = opts;  });}function loadOwners() {  return axios.post('/owner/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {    var opts = '<option value="">-- 无 --</option>';    res.data.rows.forEach(function(o) { opts += '<option value="' + o.id + '">' + escapeHtml(o.name) + '</option>'; });    document.getElementById('f-owner').innerHTML = opts;  });}function loadTenants() {  return axios.post('/tenant/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {    var opts = '<option value="">-- 无 --</option>';    res.data.rows.forEach(function(t) { opts += '<option value="' + t.id + '">' + escapeHtml(t.name) + '</option>'; });    document.getElementById('f-tenant').innerHTML = opts;  });}function loadList(page) {  currentPage = page || 1;  var queryString = document.getElementById('searchInput').value.trim();  var statusVal = document.getElementById('filterStatus').value;  axios.post('/house/findPage', {    currentPage: currentPage,    pageSize: pageSize,    queryString: queryString,    status: statusVal !== '' ? parseInt(statusVal) : null  }).then(function(res) {    renderTable(res.data.rows);    totalPages = Math.ceil(res.data.total / pageSize) || 1;    renderPagination(document.getElementById('tableInfo'), res.data.total);    loadStats();  }).catch(function() { showToast('加载失败', 'error'); });}function renderTable(list) {  var tbody = document.getElementById('houseTbody');  if (!list || list.length === 0) {    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>';    return;  }  var html = '';  list.forEach(function(h) {    var statusTag = h.status == 1 ? '<span class="tag tag-ok">已入住</span>' : '<span class="tag tag-empty">空置</span>';    html += '<tr>';    html += '<td>' + h.id + '</td>';    html += '<td><strong>' + escapeHtml(h.buildingName || '-') + '</strong></td>';    html += '<td>' + escapeHtml(h.roomNo) + '</td>';    html += '<td>' + (h.area || '-') + '</td>';    html += '<td>' + escapeHtml(h.houseType || '-') + '</td>';    html += '<td>' + escapeHtml(h.ownerName || '-') + '</td>';    html += '<td>' + escapeHtml(h.tenantName || '-') + '</td>';    html += '<td>' + statusTag + '</td>';    html += '<td class="action-btns">';    html += '<button class="btn-icon btn-edit" data-id="' + h.id + '">编辑</button>';    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + h.id + '">删除</button>';    html += '</td></tr>';  });  tbody.innerHTML = html;  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });}function renderPagination(infoEl, total) {  if (total === 0) { infoEl.textContent = '暂无数据'; document.getElementById('pagination').innerHTML = ''; return; }  infoEl.textContent = '显示第 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条';  var pag = document.getElementById('pagination');  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">?</button>';  for (var p = 1; p <= totalPages; p++) {    html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';  }  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">?</button>';  pag.innerHTML = html;  pag.querySelectorAll('.page-btn').forEach(function(btn) {    btn.addEventListener('click', function() {      var pg = parseInt(this.dataset.page);      if (pg >= 1 && pg <= totalPages) loadList(pg);    });  });}function loadStats() {  axios.get('/house/stats').then(function(res) {    if (res.flag) {      var d = res.data;      document.getElementById('s-total').textContent = d.total || 0;      document.getElementById('s-occupied').textContent = d.occupied || 0;      document.getElementById('s-vacant').textContent = d.vacant || 0;      document.getElementById('s-buildings').textContent = d.buildings || 0;    }  });}function openAdd() {  if (buildingList.length === 0) {    showToast('请先添加楼栋', 'error'); return;  }  document.getElementById('modalTitle').textContent = '新增房屋';  document.getElementById('f-id').value = '';  document.getElementById('f-room').value = '';  document.getElementById('f-area').value = '';  document.getElementById('f-type').value = '';  document.getElementById('f-owner').value = '';  document.getElementById('f-tenant').value = '';  document.getElementById('f-status').value = '0';  document.getElementById('f-remark').value = '';  document.getElementById('formModal').classList.add('show');}function openEdit(id) {  axios.get('/house/findById/' + id).then(function(res) {    var h = res.data;    document.getElementById('modalTitle').textContent = '编辑房屋';    document.getElementById('f-id').value = h.id;    document.getElementById('f-building').value = h.buildingId || '';    document.getElementById('f-room').value = h.roomNo || '';    document.getElementById('f-area').value = h.area || '';    document.getElementById('f-type').value = h.houseType || '';    document.getElementById('f-owner').value = h.ownerId || '';    document.getElementById('f-tenant').value = h.tenantId || '';    document.getElementById('f-status').value = h.status != null ? h.status : '0';    document.getElementById('f-remark').value = h.remark || '';    document.getElementById('formModal').classList.add('show');  });}function doSave() {  var id = document.getElementById('f-id').value;  var data = {    buildingId: parseInt(document.getElementById('f-building').value) || null,    roomNo: document.getElementById('f-room').value.trim(),    area: parseFloat(document.getElementById('f-area').value) || 0,    houseType: document.getElementById('f-type').value.trim(),    ownerId: parseInt(document.getElementById('f-owner').value) || null,    tenantId: parseInt(document.getElementById('f-tenant').value) || null,    status: parseInt(document.getElementById('f-status').value),    remark: document.getElementById('f-remark').value.trim()  };  if (!data.buildingId) { showToast('请选择楼栋', 'error'); return; }  if (!data.roomNo) { showToast('请填写房间号', 'error'); return; }  if (!data.area) { showToast('请填写面积', 'error'); return; }  var promise = id ? axios.put('/house/edit', Object.assign({id: parseInt(id)}, data))                   : axios.post('/house/add', data);  promise.then(function() {    showToast(id ? '修改成功' : '新增成功');    closeModal('form');    loadList(currentPage);  }).catch(function() {});}function doDelete(id) {  if (!confirm('确认删除该房屋吗？此操作不可恢复。')) return;  axios.delete('/house/delete/' + id).then(function() {    showToast('删除成功');    loadList(currentPage);  }).catch(function() {});}function closeModal(name) {  document.getElementById(name + 'Modal').classList.remove('show');}function escapeHtml(s) {  if (!s) return '';  return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}document.getElementById('btnAdd').addEventListener('click', openAdd);document.getElementById('btnSave').addEventListener('click', doSave);document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); });document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); });document.getElementById('filterStatus').addEventListener('change', function() { loadList(1); });document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });Promise.all([loadBuildings(), loadOwners(), loadTenants()]).then(function() {  loadList(1);}).catch(function() {  showToast('加载基础数据失败', 'error');});initSidebar('house:list');</script></body></html>
