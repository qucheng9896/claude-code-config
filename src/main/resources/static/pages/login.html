<!DOCTYPE html><html lang="zh-CN"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>鐧诲綍 - 鐗╀笟绠＄悊绯荤粺</title>  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">  <link rel="stylesheet" href="../css/common.css">  <style>    body {      min-height: 100vh;      display: flex;      align-items: center;      justify-content: center;      background: var(--bg-subtle);    }    .login-wrapper {      width: 100%;      padding: 24px;      animation: fadeUp 0.5s ease-out;    }    .login-card {      max-width: 400px;      margin: 0 auto;      background: white;      border-radius: var(--radius-lg);      box-shadow: var(--shadow-lg);      padding: 40px 36px;      border: 1px solid var(--border);    }    .login-header {      text-align: center;      margin-bottom: 32px;    }    .login-logo {      width: 48px;      height: 48px;      background: var(--accent);      border-radius: var(--radius-md);      display: flex;      align-items: center;      justify-content: center;      margin: 0 auto 16px;    }    .login-logo svg { color: white; }    .login-header h2 {      font-size: 22px;      font-weight: 700;      margin-bottom: 6px;    }    .login-header p {      font-size: 14px;      color: var(--text-tertiary);    }    .form-group {      margin-bottom: 18px;    }    .form-group label {      display: block;      font-size: 13px;      font-weight: 500;      color: var(--text-secondary);      margin-bottom: 6px;    }    .form-input {      width: 100%;      padding: 11px 14px;      border: 1px solid var(--border);      border-radius: var(--radius-sm);      font-size: 14px;      font-family: var(--font-sans);      color: var(--text-primary);      transition: border-color 0.2s, box-shadow 0.2s;      outline: none;    }    .form-input:focus {      border-color: var(--accent);      box-shadow: 0 0 0 3px rgba(5,150,105,0.1);    }    .form-input::placeholder { color: var(--text-tertiary); }    .login-btn {      width: 100%;      padding: 12px;      background: var(--accent);      color: white;      border: none;      border-radius: var(--radius-sm);      font-size: 15px;      font-weight: 600;      cursor: pointer;      margin-top: 8px;      transition: background 0.2s, box-shadow 0.2s;    }    .login-btn:hover {      background: var(--accent-hover);      box-shadow: 0 4px 12px rgba(5,150,105,0.3);    }    .login-btn:active { transform: scale(0.98); }    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }    .login-footer {      text-align: center;      margin-top: 20px;      font-size: 13px;      color: var(--text-tertiary);    }    .login-footer a { color: var(--accent); font-weight: 500; }    .demo-info {      margin-top: 20px;      padding: 12px;      background: var(--accent-subtle);      border-radius: var(--radius-sm);      font-size: 12px;      color: var(--accent);      text-align: center;    }    .demo-info strong { font-weight: 600; }    .toast {      position: fixed;      top: 24px;      left: 50%;      transform: translateX(-50%);      background: #1e293b;      color: white;      padding: 10px 20px;      border-radius: var(--radius-sm);      font-size: 14px;      box-shadow: var(--shadow-lg);      z-index: 200;      opacity: 0;      transition: opacity 0.3s;      pointer-events: none;    }    .toast.show { opacity: 1; }    .toast.error { background: #dc2626; }    .toast.success { background: var(--accent); }  </style></head><body>  <div class="toast" id="toast"></div>  <div class="login-wrapper">    <div class="login-card">      <div class="login-header">        <div class="login-logo">          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>        </div>        <h2>鐗╀笟绠＄悊绯荤粺</h2>        <p>璇蜂娇鐢ㄦ偍鐨勮处鍙峰瘑鐮佺櫥褰?/p>      </div>      <form id="loginForm" onsubmit="return handleLogin(event)">        <div class="form-group">          <label for="username">璐﹀彿</label>          <input type="text" id="username" class="form-input" placeholder="璇疯緭鍏ョ櫥褰曡处鍙? required autocomplete="username">        </div>        <div class="form-group">          <label for="password">瀵嗙爜</label>          <input type="password" id="password" class="form-input" placeholder="璇疯緭鍏ュ瘑鐮? required autocomplete="current-password">        </div>        <button type="submit" class="login-btn" id="loginBtn">鐧?褰?/button>      </form>      <div class="demo-info">        <strong>婕旂ず璐﹀彿锛?/strong>admin / 123456锛堢鐞嗗憳锛?      </div>      <div class="login-footer">        <a href="../index.html">鈫?杩斿洖棣栭〉</a>      </div>    </div>  </div>      <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script><script src="../js/axios-config.js"></script>  <script>    function showToast(msg, type) {      const t = document.getElementById('toast');      t.textContent = msg;      t.className = 'toast show ' + (type || '');      setTimeout(() => { t.className = 'toast ' + (type || ''); }, 3000);    }    async function handleLogin(e) {      e.preventDefault();      const btn = document.getElementById('loginBtn');      const username = document.getElementById('username').value.trim();      const password = document.getElementById('password').value.trim();      btn.disabled = true;      btn.textContent = '鐧诲綍涓?..';      try {        var response = await axios.post('/user/login', { username: username, password: password });        if (response.flag) {          localStorage.setItem('token', response.data.token);          localStorage.setItem('userInfo', JSON.stringify({            userId: response.data.userId,            username: response.data.username,            name: response.data.name,            role: response.data.roleId          }));          showToast('鐧诲綍鎴愬姛锛屾鍦ㄨ烦杞?..', 'success');          setTimeout(function() { window.location.href = 'dashboard.html'; }, 1000);        } else {          showToast(response.message || '璐﹀彿鎴栧瘑鐮侀敊璇?, 'error');          btn.disabled = false;          btn.textContent = '鐧?褰?;        }      } catch (err) {        showToast('鐧诲綍寮傚父锛岃閲嶈瘯', 'error');        btn.disabled = false;        btn.textContent = '鐧?褰?;      }      return false;    }  </script></body></html>
