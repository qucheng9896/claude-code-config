<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业主管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title">业主管理</div>
      <div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div>
    </div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-card-value">156</div><div class="stat-card-label">业主总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="stat-card-value">148</div><div class="stat-card-label">正常状态</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-rose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg></div><div class="stat-card-value">8</div><div class="stat-card-label">停用状态</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div><div class="stat-card-value">203</div><div class="stat-card-label">关联房屋</div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" placeholder="搜索业主姓名或手机号"><button class="btn btn-ghost">搜索</button></div></div>
        <button class="btn btn-ghost" onclick="openImportModal()">📥 导入</button><button class="btn btn-ghost" onclick="exportCSV()">📤 导出</button><button class="btn btn-primary" onclick="openAddModal()">+ 新增业主</button>
      </div>
      <div class="data-card">
        <table>
          <thead><tr><th>ID</th><th>姓名</th><th>手机号</th><th>身份证号</th><th>关联房屋</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="table-footer"><span class="table-footer-info">加载中...</span><div class="pagination"><button class="page-btn disabled">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div></div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="addModal"><div class="modal">
  <h3>新增业主</h3>
  <div class="form-group"><label>业主姓名 *</label><input type="text" class="form-input" placeholder="请输入姓名"></div>
  <div class="form-group"><label>手机号 *</label><input type="text" class="form-input" placeholder="请输入手机号"></div>
  <div class="form-group"><label>身份证号（选填）</label><input type="text" class="form-input" placeholder="请输入身份证号"></div>
  <div class="form-hint">默认密码为手机号后6位，MD5加密存储</div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('add')">取消</button><button class="btn btn-primary">确认添加</button></div>
</div></div>

<script src="../js/sidebar.js"></script><script src="../js/page-common.js"></script><script>
initPage({
  name: '业主管理',
  api: {
    findPage: API.ownerFindPage,
    findById: API.ownerFindById,
    add: API.ownerAdd,
    edit: API.ownerEdit,
    delete: API.ownerDelete
  },
  renderRow: function(item, index) {
    var statusClass = item.status == 1 ? 'tag-ok' : 'tag-off';
    var statusText = item.status == 1 ? '正常' : '停用';
    return '<td>' + item.id + '</td>' +
      '<td><strong>' + (item.name || '-') + '</strong></td>' +
      '<td>' + (item.phone || '-') + '</td>' +
      '<td>' + (item.idCard || '-') + '</td>' +
      '<td>' + (item.houseCount != null ? item.houseCount : '-') + '</td>' +
      '<td><span class="tag ' + statusClass + '">' + statusText + '</span></td>' +
      '<td>' + (item.createTime || '-') + '</td>' +
      '<td class="action-btns"><button class="btn-icon">编辑</button><button class="btn-icon btn-icon-danger">删除</button></td>';
  },
  hashActions: { add: function(){ openAddModal(); } }
});
initSidebar('owner:list');
</script>
<div class="modal-overlay" id="editModal"><div class="modal"><h3>编辑业主</h3><div class="form-group"><label>业主姓名 *</label><input type="text" class="form-input" placeholder="请输入业主姓名"></div><div class="form-group"><label>手机号 *</label><input type="text" class="form-input" placeholder="请输入手机号"></div><div class="form-group"><label>身份证号</label><input type="text" class="form-input" placeholder="请输入身份证号"></div><div class="form-group"><label>状态</label><select class="form-input"><option value="1">正常</option><option value="0">停用</option></select></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('edit')">取消</button><button class="btn btn-primary">保存修改</button></div></div></div>
</body>
</html>
