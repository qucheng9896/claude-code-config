<!DOCTYPE html><html lang="zh-CN"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>车位管理 - 物业管理系统</title>  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">  <link rel="stylesheet" href="../css/common.css"></head><body><div class="toast" id="toast"></div><div class="admin-layout">  <div id="sidebar-placeholder"></div>  <main class="main-content">    <div class="topbar"><div class="topbar-title">车位管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>    <div class="page-body">      <div class="stats" id="parkingStats">        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/><path d="M7 15h.01"/><path d="M17 15h.01"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">车位总数</div></div>        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M2 12h20"/></svg></div><div class="stat-card-value" id="s-rented">-</div><div class="stat-card-label">已出租</div></div>        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg></div><div class="stat-card-value" id="s-rent">-</div><div class="stat-card-label">月租金总额</div></div>        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg></div><div class="stat-card-value" id="s-rate">-</div><div class="stat-card-label">出租率</div></div>      </div>      <div class="toolbar">        <div class="toolbar-left">          <div class="search-group">            <input type="text" class="search-input" id="searchInput" placeholder="搜索车位编号、区域">            <button class="btn btn-ghost" id="btnSearch">搜索</button>          </div>          <select class="form-input" id="filterType" style="width:auto;margin-left:8px;">            <option value="">全部类型</option>            <option value="地下车位">地下车位</option>            <option value="地面车位">地面车位</option>            <option value="充电桩车位">充电桩车位</option>          </select>          <select class="form-input" id="filterStatus" style="width:auto;margin-left:8px;">            <option value="">全部状态</option>            <option value="1">租赁</option>            <option value="0">空闲</option>            <option value="2">产权</option>          </select>        </div>        <button class="btn btn-primary" id="btnAdd">+ 新增车位</button>      </div>      <div class="data-card">        <table>          <thead><tr><th>ID</th><th>车位编号</th><th>区域</th><th>类型</th><th>面积(㎡)</th><th>业主</th><th>租户</th><th>月租</th><th>状态</th><th>操作</th></tr></thead>          <tbody id="parkingTbody"></tbody>        </table>        <div class="table-footer">          <span class="table-footer-info" id="tableInfo">加载中...</span>          <div class="pagination" id="pagination"></div>        </div>      </div>    </div>  </main></div><div class="modal-overlay" id="formModal">  <div class="modal">    <h3 id="modalTitle">新增车位</h3>    <input type="hidden" id="f-id">    <div class="form-group"><label>车位编号 *</label><input type="text" class="form-input" id="f-no" placeholder="如：B1-A001"></div>    <div class="form-group"><label>区域</label><input type="text" class="form-input" id="f-area" placeholder="如：B1-A区"></div>    <div class="form-group"><label>类型</label>      <select class="form-input" id="f-type">        <option value="地下车位">地下车位</option>        <option value="地面车位">地面车位</option>        <option value="充电桩车位">充电桩车位</option>      </select>    </div>    <div class="form-group"><label>面积(㎡)</label><input type="number" step="0.01" class="form-input" id="f-size" placeholder="如：12.5"></div>    <div class="form-group"><label>业主</label>      <select class="form-input" id="f-owner"><option value="">-- 无 --</option></select>    </div>    <div class="form-group"><label>租户</label>      <select class="form-input" id="f-tenant"><option value="">-- 无 --</option></select>    </div>    <div class="form-group"><label>月租金</label><input type="number" step="0.01" class="form-input" id="f-rent" placeholder="如：300"></div>    <div class="form-group"><label>状态</label>      <select class="form-input" id="f-status"><option value="0">空闲</option><option value="1">租赁</option><option value="2">产权</option></select>    </div>    <div class="form-group"><label>备注</label><textarea class="form-input" id="f-remark" rows="2" placeholder="备注信息"></textarea></div>    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>  </div></div>  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script><script src="../js/axios-config.js"></script><script src="../js/sidebar.js"></script><script>var currentPage = 1, pageSize = 10, totalPages = 1;function showToast(msg, type) {  var el = document.getElementById('toast');  if (!el) return;  el.textContent = msg;  el.className = 'toast show toast-' + (type || 'success');  clearTimeout(el._timer);  el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000);}function loadOwners() {  return axios.post('/owner/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {    var opts = '<option value="">-- 无 --</option>';    res.data.rows.forEach(function(o) { opts += '<option value="' + o.id + '">' + escapeHtml(o.name) + '</option>'; });    document.getElementById('f-owner').innerHTML = opts;  });}function loadTenants() {  return axios.post('/tenant/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {    var opts = '<option value="">-- 无 --</option>';    res.data.rows.forEach(function(t) { opts += '<option value="' + t.id + '">' + escapeHtml(t.name) + '</option>'; });    document.getElementById('f-tenant').innerHTML = opts;  });}function loadList(page) {  currentPage = page || 1;  var queryString = document.getElementById('searchInput').value.trim();  var typeVal = document.getElementById('filterType').value;  var statusVal = document.getElementById('filterStatus').value;  axios.post('/parking/findPage', {    currentPage: currentPage,    pageSize: pageSize,    queryString: queryString,    type: typeVal || null,    status: statusVal !== '' ? parseInt(statusVal) : null  }).then(function(res) {    renderTable(res.data.rows);    totalPages = Math.ceil(res.data.total / pageSize) || 1;    renderPagination(document.getElementById('tableInfo'), res.data.total);    loadStats();  }).catch(function() { showToast('加载失败', 'error'); });}function renderTable(list) {  var tbody = document.getElementById('parkingTbody');  if (!list || list.length === 0) {    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>';    return;  }  var html = '';  list.forEach(function(p) {    var statusTag = p.status == 1 ? '<span class="tag tag-ok">租赁</span>' : (p.status == 2 ? '<span class="tag tag-info">产权</span>' : '<span class="tag tag-empty">空闲</span>');    html += '<tr>';    html += '<td>' + p.id + '</td>';    html += '<td><strong>' + escapeHtml(p.parkingNo) + '</strong></td>';    html += '<td>' + escapeHtml(p.area || '-') + '</td>';    html += '<td>' + escapeHtml(p.type || '-') + '</td>';    html += '<td>' + (p.size || '-') + '</td>';    html += '<td>' + escapeHtml(p.ownerName || '-') + '</td>';    html += '<td>' + escapeHtml(p.tenantName || '-') + '</td>';    html += '<td>' + (p.monthlyRent ? '￥' + p.monthlyRent : '-') + '</td>';    html += '<td>' + statusTag + '</td>';    html += '<td class="action-btns">';    html += '<button class="btn-icon btn-edit" data-id="' + p.id + '">编辑</button>';    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + p.id + '">删除</button>';    html += '</td></tr>';  });  tbody.innerHTML = html;  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });}function renderPagination(infoEl, total) {  if (total === 0) { infoEl.textContent = '暂无数据'; document.getElementById('pagination').innerHTML = ''; return; }  infoEl.textContent = '显示第 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条';  var pag = document.getElementById('pagination');  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">?</button>';  for (var p = 1; p <= totalPages; p++) html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">?</button>';  pag.innerHTML = html;  pag.querySelectorAll('.page-btn').forEach(function(btn) {    btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); });  });}function loadStats() {  axios.get('/parking/stats').then(function(res) {    if (res.flag) {      var d = res.data;      document.getElementById('s-total').textContent = d.total || 0;      document.getElementById('s-rented').textContent = d.rented || 0;      var rent = parseFloat(d.totalRent) || 0;      document.getElementById('s-rent').textContent = '￥' + (rent >= 1000 ? (rent / 1000).toFixed(1) + 'K' : rent.toFixed(0));      document.getElementById('s-rate').textContent = d.total > 0 ? (d.rented * 100 / d.total).toFixed(1) + '%' : '0%';    }  });}function openAdd() {  document.getElementById('modalTitle').textContent = '新增车位';  document.getElementById('f-id').value = '';  document.getElementById('f-no').value = '';  document.getElementById('f-area').value = '';  document.getElementById('f-type').value = '地下车位';  document.getElementById('f-size').value = '';  document.getElementById('f-owner').value = '';  document.getElementById('f-tenant').value = '';  document.getElementById('f-rent').value = '';  document.getElementById('f-status').value = '0';  document.getElementById('f-remark').value = '';  document.getElementById('formModal').classList.add('show');}function openEdit(id) {  axios.get('/parking/findById/' + id).then(function(res) {    var p = res.data;    document.getElementById('modalTitle').textContent = '编辑车位';    document.getElementById('f-id').value = p.id;    document.getElementById('f-no').value = p.parkingNo || '';    document.getElementById('f-area').value = p.area || '';    document.getElementById('f-type').value = p.type || '地下车位';    document.getElementById('f-size').value = p.size || '';    document.getElementById('f-owner').value = p.ownerId || '';    document.getElementById('f-tenant').value = p.tenantId || '';    document.getElementById('f-rent').value = p.monthlyRent || '';    document.getElementById('f-status').value = p.status != null ? p.status : '0';    document.getElementById('f-remark').value = p.remark || '';    document.getElementById('formModal').classList.add('show');  });}function doSave() {  var id = document.getElementById('f-id').value;  var data = {    parkingNo: document.getElementById('f-no').value.trim(),    area: document.getElementById('f-area').value.trim(),    type: document.getElementById('f-type').value,    size: parseFloat(document.getElementById('f-size').value) || 0,    ownerId: parseInt(document.getElementById('f-owner').value) || null,    tenantId: parseInt(document.getElementById('f-tenant').value) || null,    monthlyRent: parseFloat(document.getElementById('f-rent').value) || 0,    status: parseInt(document.getElementById('f-status').value),    remark: document.getElementById('f-remark').value.trim()  };  if (!data.parkingNo) { showToast('请填写车位编号', 'error'); return; }  var promise = id ? axios.put('/parking/edit', Object.assign({id: parseInt(id)}, data)) : axios.post('/parking/add', data);  promise.then(function() { showToast(id ? '修改成功' : '新增成功'); closeModal('form'); loadList(currentPage); }).catch(function() {});}function doDelete(id) {  if (!confirm('确认删除该车位吗？此操作不可恢复。')) return;  axios.delete('/parking/delete/' + id).then(function() { showToast('删除成功'); loadList(currentPage); }).catch(function() {});}function closeModal(name) { document.getElementById(name + 'Modal').classList.remove('show'); }function escapeHtml(s) { return s ? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '-'; }document.getElementById('btnAdd').addEventListener('click', openAdd);document.getElementById('btnSave').addEventListener('click', doSave);document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); });document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); });document.getElementById('filterType').addEventListener('change', function() { loadList(1); });document.getElementById('filterStatus').addEventListener('change', function() { loadList(1); });document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });Promise.all([loadOwners(), loadTenants()]).then(function() { loadList(1); }).catch(function() {});initSidebar('parking:list');</script></body></html>
