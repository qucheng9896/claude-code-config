<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>车位管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">车位管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/><path d="M7 15h.01"/><path d="M17 15h.01"/></svg></div><div class="stat-card-value">580</div><div class="stat-card-label">车位总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M2 12h20"/></svg></div><div class="stat-card-value">120</div><div class="stat-card-label">充电桩车位</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg></div><div class="stat-card-value">496</div><div class="stat-card-label">月租车位</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg></div><div class="stat-card-value">85.5%</div><div class="stat-card-label">出租率</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" placeholder="搜索车位编号"><select class="filter-select"><option value="">全部类型</option><option>地下车位</option><option>地面车位</option><option>充电桩车位</option></select><select class="filter-select"><option value="">全部状态</option><option>产权</option><option>租赁</option><option>空闲</option></select><button class="btn btn-ghost">搜索</button></div></div><button class="btn btn-primary">+ 新增车位</button></div>
      <div class="data-card"><table><thead><tr><th>车位编号</th><th>区域</th><th>类型</th><th>面积</th><th>业主</th><th>当前租户</th><th>月租</th><th>状态</th><th>操作</th></tr></thead><tbody>
        <tr data-idx="0"><td>B1-A001</td><td>B1-A区</td><td>地下车位</td><td>12.5㎡</td><td>物业</td><td>王大明</td><td>¥300</td><td><span class="tag tag-ok">租赁</span></td><td class="action-btns"><button class="btn-icon">查看</button><button class="btn-icon">编辑</button></td></tr>
        <tr data-idx="1"><td>B1-A002</td><td>B1-A区</td><td>充电桩车位</td><td>14.0㎡</td><td>物业</td><td>李小红</td><td>¥350</td><td><span class="tag tag-ok">租赁</span></td><td class="action-btns"><button class="btn-icon">查看</button><button class="btn-icon">编辑</button></td></tr>
        <tr data-idx="2"><td>B1-B058</td><td>B1-B区</td><td>地下车位</td><td>12.5㎡</td><td>王大明</td><td>—</td><td>—</td><td><span class="tag tag-info">产权</span></td><td class="action-btns"><button class="btn-icon">查看</button><button class="btn-icon">编辑</button></td></tr>
        <tr data-idx="3"><td>G-012</td><td>G区</td><td>地面车位</td><td>12.0㎡</td><td>物业</td><td>—</td><td>—</td><td><span class="tag tag-empty">空闲</span></td><td class="action-btns"><button class="btn-icon">出租</button><button class="btn-icon">编辑</button></td></tr>
      </tbody></table><div class="table-footer"><span class="table-footer-info">显示 1-4 条，共 580 个车位</span><div class="pagination"><button class="page-btn disabled">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div></div></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;
function showToast(msg) { var el = document.getElementById('toast'); if (!el) return; el.textContent = msg; el.className = 'toast show'; setTimeout(function() { el.className = 'toast'; }, 3000); }
function loadList(page) { currentPage = page || 1; var q = document.getElementById('searchInput').value.trim(); axios.post('/parking/findPage', { currentPage: currentPage, pageSize: pageSize, queryString: q }).then(function(res) { renderTable(res.data.rows); totalPages = Math.ceil(res.data.total / pageSize) || 1; renderPagination(document.getElementById('tableInfo'), res.data.total); loadStats(); }); }
function renderTable(list) { var tb = document.getElementById('parkingTbody'); if (!list || !list.length) { tb.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>'; return; } var h = ''; list.forEach(function(x) { var tag = x.status == 1 ? '<span class="tag tag-ok">租赁</span>' : (x.status == 2 ? '<span class="tag tag-info">产权</span>' : '<span class="tag tag-empty">空闲</span>'); h += '<tr><td>' + x.id + '</td><td><strong>' + (x.parkingNo || '-') + '</strong></td><td>' + (x.area || '-') + '</td><td>' + (x.type || '-') + '</td><td>' + (x.size || '-') + '</td><td>' + (x.ownerName || '-') + '</td><td>' + (x.tenantName || '-') + '</td><td>' + (x.monthlyRent ? '¥' + x.monthlyRent : '-') + '</td><td>' + tag + '</td><td class="action-btns"><button class="btn-icon btn-edit" data-id="' + x.id + '">编辑</button><button class="btn-icon btn-icon-danger btn-del" data-id="' + x.id + '">删除</button></td></tr>'; }); tb.innerHTML = h; tb.querySelectorAll('.btn-edit').forEach(function(b) { b.addEventListener('click', function() { openEdit(this.dataset.id); }); }); tb.querySelectorAll('.btn-del').forEach(function(b) { b.addEventListener('click', function() { doDelete(this.dataset.id); }); }); }
function renderPagination(e, t) { e.textContent = '显示第' + ((currentPage-1)*pageSize+1) + '-' + Math.min(currentPage*pageSize, t) + ' 条，共 ' + t + ' 条'; var p = document.getElementById('pagination'), h = '<button class="page-btn' + (currentPage<=1?' disabled':'') + '" data-page="' + (currentPage-1) + '">‹</button>'; for (var i=1;i<=totalPages;i++) h += '<button class="page-btn'+(i===currentPage?' active':'')+'" data-page="'+i+'">'+i+'</button>'; h += '<button class="page-btn'+(currentPage>=totalPages?' disabled':'')+'" data-page="'+(currentPage+1)+'">›</button>'; p.innerHTML = h; p.querySelectorAll('.page-btn').forEach(function(b) { b.addEventListener('click', function() { var pg=parseInt(this.dataset.page); if(pg>=1&&pg<=totalPages) loadList(pg); }); }); }
function loadStats() { axios.post('/parking/findPage', {currentPage:1,pageSize:9999,queryString:''}).then(function(res){var l=res.data.rows;document.getElementById('s-total').textContent=l.length;var r=l.filter(function(x){return x.status==1}).length;document.getElementById('s-rented').textContent=r;document.getElementById('s-rate').textContent=l.length?(r*100/l.length).toFixed(1)+'%':'0%';}); }
function openAdd(){document.getElementById('modalTitle').textContent='新增车位';document.getElementById('f-id').value='';document.getElementById('formModal').classList.add('show');}
function openEdit(id){axios.get('/parking/findById/'+id).then(function(res){var x=res.data;document.getElementById('modalTitle').textContent='编辑车位';document.getElementById('f-id').value=x.id;document.getElementById('f-no').value=x.parkingNo||'';document.getElementById('f-area').value=x.area||'';document.getElementById('f-type').value=x.type||'地下车位';document.getElementById('f-size').value=x.size||'';document.getElementById('f-rent').value=x.monthlyRent||'';document.getElementById('f-status').value=x.status!=null?x.status:'0';document.getElementById('formModal').classList.add('show');});}
function doSave(){var id=document.getElementById('f-id').value;var data={parkingNo:document.getElementById('f-no').value.trim(),area:document.getElementById('f-area').value.trim(),type:document.getElementById('f-type').value,size:parseFloat(document.getElementById('f-size').value)||0,monthlyRent:parseFloat(document.getElementById('f-rent').value)||0,status:parseInt(document.getElementById('f-status').value)};if(!data.parkingNo){showToast('请填写车位编号');return;}var p=id?axios.put('/parking/edit',Object.assign({id:parseInt(id)},data)):axios.post('/parking/add',data);p.then(function(){showToast(id?'修改成功':'新增成功');closeModal('form');loadList(currentPage);});}
function doDelete(id){if(!confirm('确认删除该车位吗？'))return;axios.delete('/parking/delete/'+id).then(function(){showToast('删除成功');loadList(currentPage);});}
function closeModal(n){document.getElementById(n+'Modal').classList.remove('show');}
document.getElementById('btnAdd').addEventListener('click',openAdd);document.getElementById('btnSave').addEventListener('click',doSave);document.getElementById('btnSearch').addEventListener('click',function(){loadList(1);});document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')loadList(1);});document.getElementById('formModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
loadList(1);initSidebar('parking:list');
</script>
<div class="modal-overlay" id="editModal"><div class="modal"><h3>编辑信息</h3><div class="form-group"><label>名称 *</label><input type="text" class="form-input" placeholder="请输入"></div><div class="form-group"><label>备注</label><textarea class="form-input" rows="3" placeholder="备注信息"></textarea></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('edit')">取消</button><button class="btn btn-primary">保存修改</button></div></div></div>
</body>
</html>
