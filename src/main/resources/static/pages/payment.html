<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缴费管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">缴费管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">账单总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"></div><div class="stat-card-value" id="s-paid">-</div><div class="stat-card-label">已缴</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"></div><div class="stat-card-value" id="s-unpaid">-</div><div class="stat-card-label">未缴</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-rose"></div><div class="stat-card-value" id="s-overdue">-</div><div class="stat-card-label">逾期</div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" id="searchInput" placeholder="搜索租户、楼栋或账单"><select class="filter-select" id="filterFeeType"><option value="">全部类型</option><option>物业费</option><option>水电费</option><option>停车费</option><option>租金</option></select><select class="filter-select" id="filterPayStatus"><option value="">全部状态</option><option value="0">未缴</option><option value="1">已缴</option><option value="2">已确认</option><option value="3">逾期</option></select><button class="btn btn-ghost" id="btnSearch">搜索</button></div></div>
        <div class="toolbar-right">
          <button class="btn btn-primary" style="background:linear-gradient(135deg,#7c3aed,#6366f1);box-shadow:0 2px 8px rgba(124,58,237,0.3);" id="btnAiRemind">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M12 2a3 3 0 0 0-3 3v1a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>AI智能催缴
          </button>
          <button class="btn btn-primary" id="btnAdd">+ 新增账单</button>
          <button class="btn btn-primary" id="btnBatchGen">⚡ 批量生成账单</button>
        </div>
      </div>
      <div class="data-card"><table><thead><tr><th>账单编号</th><th>租户</th><th>房屋</th><th>类型</th><th>金额</th><th>周期</th><th>到期日</th><th>状态</th><th>操作</th></tr></thead><tbody id="paymentTbody"></tbody></table>
        <div class="table-footer"><span class="table-footer-info" id="tableInfo">加载中...</span><div class="pagination" id="pagination"></div></div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="formModal"><div class="modal"><h3 id="modalTitle">新增账单</h3><input type="hidden" id="f-id">
  <div class="form-group"><label>账单编号</label><input type="text" class="form-input" id="f-billNo" placeholder="自动生成或手动输入"></div>
  <div class="form-group"><label>业主ID</label><input type="number" class="form-input" id="f-ownerId" placeholder="请输入业主ID"></div>
  <div class="form-group"><label>租户ID</label><input type="number" class="form-input" id="f-tenantId" placeholder="请输入租户ID"></div>
  <div class="form-group"><label>房屋ID *</label><input type="number" class="form-input" id="f-houseId" placeholder="请输入房屋ID"></div>
  <div class="form-group"><label>费用类型 *</label><select class="form-input" id="f-feeType"><option value="物业费">物业费</option><option value="水电费">水电费</option><option value="停车费">停车费</option><option value="租金">租金</option></select></div>
  <div class="form-group"><label>金额 *</label><input type="number" class="form-input" id="f-amount" step="0.01" placeholder="请输入金额"></div>
  <div class="form-group"><label>费用周期</label><input type="text" class="form-input" id="f-period" placeholder="如：2025-01"></div>
  <div class="form-group"><label>到期日</label><input type="date" class="form-input" id="f-dueDate"></div>
  <div class="form-group"><label>状态</label><select class="form-input" id="f-payStatus"><option value="0">未缴</option><option value="1">已缴</option><option value="2">已确认</option><option value="3">逾期</option></select></div>
  <div class="form-group"><label>备注</label><input type="text" class="form-input" id="f-remark" placeholder="备注信息"></div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>
</div></div>

<div class="modal-overlay" id="genModal"><div class="modal">
  <h3>批量生成账单</h3><p class="modal-subtitle">为指定周期自动生成所有已入住房屋的账单</p>
  <div class="form-group"><label>费用类型 *</label><select class="form-input" id="g-feeType"><option value="物业费">物业费</option><option value="水电费">水电费</option><option value="停车费">停车费</option><option value="租金">租金</option></select></div>
  <div class="form-group"><label>费用周期 *</label><input type="text" class="form-input" id="g-period" placeholder="如：2025-01"></div>
  <div class="form-group"><label>金额（元）*</label><input type="number" class="form-input" id="g-amount" step="0.01" placeholder="如：268.50"></div>
  <div class="form-group"><label>到期日</label><input type="date" class="form-input" id="g-dueDate"></div>
  <div class="form-hint">将为所有<strong>已入住</strong>房屋生成账单，已存在的账单自动跳过（防重复）</div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('gen')">取消</button><button class="btn btn-primary" id="btnGenSave">确认生成</button></div>
</div></div>

<div class="modal-overlay" id="aiRemindModal"><div class="modal" style="width:600px;">
  <h3><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:white;">AI</span> 智能催缴</h3>
  <p class="modal-subtitle">系统自动分析逾期账单，AI生成个性化催缴消息</p>
  <div style="margin-bottom:20px;">
    <div style="font-size:13px;font-weight:600;color:#334155;margin-bottom:10px;">逾期租户列表 (<span id="aiOverdueCount">0</span>)</div>
    <div id="aiOverdueList" style="display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto;">
      <div style="color:#94a3b8;font-size:13px;padding:12px;">加载中...</div>
    </div>
  </div>
  <div style="border-top:1px solid #e2e8f0;padding-top:20px;">
    <div style="font-size:13px;font-weight:600;color:#334155;margin-bottom:10px;">催缴消息预览</div>
    <div class="ai-msg-preview" id="aiMsgPreview"><span class="ai-msg-loading">← 选择左侧租户后点击下方"生成催缴消息"</span></div>
    <div style="display:flex;gap:10px;margin-top:12px;"><button class="btn btn-ghost" id="btnAiGen" onclick="generateAiRemind()" disabled>🤖 生成消息</button><button class="btn btn-primary" id="btnAiSend" onclick="sendAiRemind()" style="background:linear-gradient(135deg,#7c3aed,#6366f1);" disabled>📤 确认发送</button></div>
  </div>
  <div class="modal-footer" style="margin-top:20px;"><button class="btn btn-ghost" onclick="closeModal('aiRemind')">关闭</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;
var aiOwnerId = null;
function showToast(msg) { var el = document.getElementById("toast"); if (!el) return; el.textContent = msg; el.className = "toast show"; setTimeout(function() { el.className = "toast"; }, 3000); }
function fmtMoney(m) { return m != null ? '¥' + parseFloat(m).toFixed(2) : '-'; }
function fmtDate(d) { return d ? (typeof d === 'string' ? d.substring(0,10) : d) : '-'; }
function loadList(page) {
  currentPage = page || 1;
  var q = document.getElementById("searchInput").value.trim();
  var feeType = document.getElementById("filterFeeType").value;
  var payStatus = document.getElementById("filterPayStatus").value;
  var params = { currentPage: currentPage, pageSize: pageSize, queryString: q };
  if (feeType) params.feeType = feeType;
  if (payStatus) params.payStatus = parseInt(payStatus);
  axios.post("/payment/findPage", params).then(function(res) {
    renderTable(res.data.rows);
    totalPages = Math.ceil(res.data.total / pageSize) || 1;
    document.getElementById("tableInfo").textContent = "显示第" + ((currentPage-1)*pageSize+1) + "-" + Math.min(currentPage*pageSize, res.data.total) + " 条，共 " + res.data.total + " 条";
    renderPagination();
    loadStats();
  });
}
function renderTable(list) {
  var tb = document.getElementById("paymentTbody");
  if (!list || !list.length) { tb.innerHTML = "<tr><td colspan=\"9\" style=\"text-align:center;color:#94a3b8;padding:40px\">暂无数据</td></tr>"; return; }
  var h = "";
  list.forEach(function(p) {
    var statusMap = { "0": "<span class='tag tag-unpaid'>未缴</span>", "1": "<span class='tag tag-paid'>已缴</span>", "2": "<span class='tag tag-confirm'>已确认</span>", "3": "<span class='tag tag-overdue'>逾期</span>" };
    var actions = '';
    if (p.payStatus == 1) { actions = "<button class='btn-icon btn-confirm' data-id='" + p.id + "'>确认</button>"; } else if (p.payStatus == 3) { actions = "<button class='btn-icon btn-ai' data-owner-id='" + p.ownerId + "' style='border-color:#7c3aed;color:#7c3aed;'>AI催缴</button>"; }
    actions += "<button class='btn-icon btn-edit' data-id='" + p.id + "'>编辑</button><button class='btn-icon btn-icon-danger btn-del' data-id='" + p.id + "'>删除</button>";
    h += "<tr><td>" + (p.billNo || "-") + "</td><td>" + (p.ownerName || "-") + "</td><td>" + (p.houseAddress || "-") + "</td><td>" + (p.feeType || "-") + "</td><td>" + fmtMoney(p.amount) + "</td><td>" + (p.period || "-") + "</td><td>" + fmtDate(p.dueDate) + "</td><td>" + (statusMap[p.payStatus] || "-") + "</td><td class='action-btns'>" + actions + "</td></tr>";
  });
  tb.innerHTML = h;
  tb.querySelectorAll(".btn-edit").forEach(function(b) { b.addEventListener("click", function() { openEdit(this.dataset.id); }); });
  tb.querySelectorAll(".btn-del").forEach(function(b) { b.addEventListener("click", function() { doDelete(this.dataset.id); }); });
  tb.querySelectorAll(".btn-confirm").forEach(function(b) { b.addEventListener("click", function() { doConfirm(this.dataset.id); }); });
  tb.querySelectorAll(".btn-ai").forEach(function(b) { b.addEventListener("click", function() { openAiRemindForOwner(this.dataset.ownerId); }); });
}
function renderPagination() {
  var p = document.getElementById("pagination");
  var h = "<button class='page-btn" + (currentPage<=1?" disabled":"") + "' data-page='" + (currentPage-1) + "'>‹</button>";
  for (var i=1;i<=totalPages;i++) h += "<button class='page-btn"+(i===currentPage?" active":"")+"' data-page='"+i+"'>"+i+"</button>";
  h += "<button class='page-btn"+(currentPage>=totalPages?" disabled":"")+"' data-page='"+(currentPage+1)+"'>›</button>";
  p.innerHTML = h;
  p.querySelectorAll(".page-btn").forEach(function(b) { b.addEventListener("click", function() { var pg=parseInt(this.dataset.page); if(pg>=1&&pg<=totalPages) loadList(pg); }); });
}
function loadStats() {
  axios.post("/payment/findPage", { currentPage: 1, pageSize: 1 }).then(function(res) { document.getElementById("s-total").textContent = res.data.total || 0; });
  axios.post("/payment/findPage", { currentPage: 1, pageSize: 1, payStatus: 1 }).then(function(res) { document.getElementById("s-paid").textContent = res.data.total || 0; });
  axios.post("/payment/findPage", { currentPage: 1, pageSize: 1, payStatus: 0 }).then(function(res) { document.getElementById("s-unpaid").textContent = res.data.total || 0; });
  axios.post("/payment/findPage", { currentPage: 1, pageSize: 1, payStatus: 3 }).then(function(res) { document.getElementById("s-overdue").textContent = res.data.total || 0; });
}
function openAdd() {
  document.getElementById("modalTitle").textContent = "新增账单";
  document.getElementById("f-id").value = "";
  ["f-billNo","f-ownerId","f-tenantId","f-houseId","f-period","f-dueDate","f-amount","f-remark"].forEach(function(id){document.getElementById(id).value="";});
  document.getElementById("f-feeType").value = "物业费";
  document.getElementById("f-payStatus").value = "0";
  document.getElementById("formModal").classList.add("show");
}
function openEdit(id) {
  axios.post("/payment/findPage", { currentPage: 1, pageSize: 1 }).then(function() {});
  axios.get("/payment/findById/" + id).then(function(res) {
    var p = res.data;
    document.getElementById("modalTitle").textContent = "编辑账单";
    document.getElementById("f-id").value = p.id;
    document.getElementById("f-billNo").value = p.billNo || "";
    document.getElementById("f-ownerId").value = p.ownerId || "";
    document.getElementById("f-tenantId").value = p.tenantId || "";
    document.getElementById("f-houseId").value = p.houseId || "";
    document.getElementById("f-feeType").value = p.feeType || "物业费";
    document.getElementById("f-amount").value = p.amount || "";
    document.getElementById("f-period").value = p.period || "";
    document.getElementById("f-dueDate").value = fmtDate(p.dueDate);
    document.getElementById("f-payStatus").value = p.payStatus != null ? p.payStatus : "0";
    document.getElementById("f-remark").value = p.remark || "";
    document.getElementById("formModal").classList.add("show");
  });
}
function doSave() {
  var id = document.getElementById("f-id").value;
  var data = {
    billNo: document.getElementById("f-billNo").value.trim(),
    ownerId: parseInt(document.getElementById("f-ownerId").value) || null,
    tenantId: parseInt(document.getElementById("f-tenantId").value) || null,
    houseId: parseInt(document.getElementById("f-houseId").value) || null,
    feeType: document.getElementById("f-feeType").value,
    amount: parseFloat(document.getElementById("f-amount").value) || 0,
    period: document.getElementById("f-period").value.trim(),
    dueDate: document.getElementById("f-dueDate").value || null,
    payStatus: parseInt(document.getElementById("f-payStatus").value),
    remark: document.getElementById("f-remark").value.trim()
  };
  if (!data.houseId) { showToast("请填写房屋ID"); return; }
  if (!data.amount) { showToast("请填写金额"); return; }
  var p = id ? axios.put("/payment/edit", Object.assign({ id: parseInt(id) }, data)) : axios.post("/payment/add", data);
  p.then(function() { showToast(id ? "修改成功" : "新增成功"); closeModal("form"); loadList(currentPage); });
}
function doDelete(id) { if (!confirm("确认删除该账单吗？此操作不可恢复。")) return; axios.delete("/payment/delete/" + id).then(function() { showToast("删除成功"); loadList(currentPage); }); }
function doConfirm(id) { axios.put("/payment/confirm/" + id).then(function() { showToast("确认到账成功"); loadList(currentPage); }); }
function closeModal(n) { document.getElementById(n + "Modal").classList.remove("show"); }

function openAiRemindForOwner(ownerId) { aiOwnerId = ownerId; document.getElementById("aiRemindModal").classList.add("show"); loadOverdueList(); }
document.getElementById("btnAiRemind").addEventListener("click", function() { aiOwnerId = null; document.getElementById("aiRemindModal").classList.add("show"); loadOverdueList(); });
function loadOverdueList() {
  axios.get("/payment/overdue").then(function(res) {
    var list = res.data || [];
    document.getElementById("aiOverdueCount").textContent = list.length;
    var el = document.getElementById("aiOverdueList");
    if (!list.length) { el.innerHTML = '<div style="color:#94a3b8;font-size:13px;padding:12px;">暂无逾期账单</div>'; return; }
    var h = '';
    list.forEach(function(p) {
      h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff5f5;border:1px solid #fecaca;border-radius:8px;">';
      h += '<div><strong>' + (p.ownerName || '业主') + '</strong> <span style="font-size:12px;color:#64748b;">' + (p.houseAddress || '') + ' ' + (p.feeType || '') + '</span></div>';
      h += '<div style="display:flex;align-items:center;gap:12px;"><span style="font-family:\'JetBrains Mono\',monospace;color:#dc2626;font-weight:600;">' + fmtMoney(p.amount) + '</span><button class="btn btn-ghost" style="padding:4px 10px;font-size:12px;" data-owner-id="' + p.ownerId + '" onclick="selectForAiRemind(this.dataset.ownerId)">选择</button></div></div>';
    });
    el.innerHTML = h;
  });
}
function selectForAiRemind(ownerId) {
  aiOwnerId = parseInt(ownerId);
  document.getElementById("btnAiGen").disabled = false;
  document.getElementById("btnAiSend").disabled = true;
  document.getElementById("aiMsgPreview").innerHTML = '<span class="ai-msg-loading">已选择业主ID=' + ownerId + '，点击下方"生成催缴消息"</span>';
}
function generateAiRemind() {
  if (!aiOwnerId) return;
  var p = document.getElementById("aiMsgPreview");
  p.innerHTML = '<span class="ai-msg-loading">AI 正在生成催缴消息...</span>';
  axios.post("/payment/ai/preview", { ownerId: aiOwnerId }).then(function(res) {
    var msg = res.data.message;
    p.textContent = msg;
    p.dataset.msg = msg;
    document.getElementById("btnAiSend").disabled = false;
  }).catch(function() { p.innerHTML = '<span class="ai-msg-loading">生成失败，请重试</span>'; });
}
function sendAiRemind() {
  var msg = document.getElementById("aiMsgPreview").dataset.msg;
  if (!msg) return;
  axios.post("/payment/ai/send/0").then(function() { showToast("催缴消息已发送"); document.getElementById("btnAiSend").disabled = true; }).catch(function() { showToast("发送失败"); });
}

document.getElementById("btnBatchGen").addEventListener("click", function() { document.getElementById("genModal").classList.add("show"); });
document.getElementById("btnGenSave").addEventListener("click", function() {
  var data = { feeType: document.getElementById("g-feeType").value, period: document.getElementById("g-period").value, amount: parseFloat(document.getElementById("g-amount").value) || 0, dueDate: document.getElementById("g-dueDate").value || null };
  if (!data.period) { showToast("请填写费用周期"); return; }
  if (!data.amount) { showToast("请填写金额"); return; }
  axios.post("/payment/generateBills", data).then(function() { showToast("账单生成成功"); closeModal("gen"); loadList(1); });
});


document.getElementById("btnSave").addEventListener("click", doSave);
document.getElementById("btnSearch").addEventListener("click", function() { loadList(1); });
document.getElementById("searchInput").addEventListener("keydown", function(e) { if (e.key === "Enter") loadList(1); });
document.getElementById("filterFeeType").addEventListener("change", function() { loadList(1); });
document.getElementById("filterPayStatus").addEventListener("change", function() { loadList(1); });
document.getElementById("formModal").addEventListener("click", function(e) { if (e.target === this) this.classList.remove("show"); });
document.getElementById("genModal").addEventListener("click", function(e) { if (e.target === this) this.classList.remove("show"); });
document.getElementById("aiRemindModal").addEventListener("click", function(e) { if (e.target === this) this.classList.remove("show"); });
loadList(1); initSidebar("payment:list");
</script>
</body>
</html>
