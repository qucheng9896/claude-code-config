<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缴费管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">缴费管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="stat-card-value">¥128,450</div><div class="stat-card-label">本月已收缴</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="stat-card-value">96.2%</div><div class="stat-card-label">缴费完成率</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value">42</div><div class="stat-card-label">待确认账单</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-rose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div><div class="stat-card-value">¥18,620</div><div class="stat-card-label">待缴/逾期金额</div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" placeholder="搜索租户、楼栋或账单"><select class="filter-select"><option value="">全部类型</option><option>物业费</option><option>水电费</option><option>停车费</option><option>租金</option></select><select class="filter-select"><option value="">全部状态</option><option value="3">逾期</option><option value="0">未缴</option><option value="1">已缴</option><option value="2">已确认</option></select><button class="btn btn-ghost">搜索</button></div></div>
        <div class="toolbar-right">
          <button class="btn btn-primary" style="background:linear-gradient(135deg,#7c3aed,#6366f1);box-shadow:0 2px 8px rgba(124,58,237,0.3);" onclick="openAiRemindModal()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M12 2a3 3 0 0 0-3 3v1a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>AI智能催缴
          </button>
          <button class="btn btn-primary" onclick="if(typeof generateBills==='function')generateBills();else showToast('批量生成账单功能');">⚡ 批量生成账单</button>
        </div>
      </div>
      <div class="data-card"><table><thead><tr><th>账单编号</th><th>租户</th><th>房屋</th><th>类型</th><th>金额</th><th>周期</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table><div class="table-footer"><span class="table-footer-info">加载中...</span><div class="pagination"><button class="page-btn disabled">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div></div></div>
    </div>
  </main>
</div>

<!-- AI催缴弹窗 -->
<div class="modal-overlay" id="aiRemindModal"><div class="modal" style="width:600px;">
  <h3><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:white;">AI</span> 智能催缴</h3>
  <p class="modal-subtitle">系统自动分析逾期账单，AI生成个性化催缴消息</p>
  <div style="margin-bottom:20px;">
    <div style="font-size:13px;font-weight:600;color:#334155;margin-bottom:10px;">逾期租户列表</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff5f5;border:1px solid #fecaca;border-radius:8px;">
        <div><strong>陈租客</strong> <span style="font-size:12px;color:#64748b;">1-1001 停车费</span></div>
        <div style="display:flex;align-items:center;gap:12px;"><span style="font-family:'JetBrains Mono',monospace;color:#dc2626;font-weight:600;">¥150.00</span><span style="font-size:11px;color:#94a3b8;">逾期15天</span><button class="btn btn-ghost" style="padding:4px 10px;font-size:12px;" onclick="selectForAiRemind('陈租客',150,15)">选择</button></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff5f5;border:1px solid #fecaca;border-radius:8px;">
        <div><strong>刘租客</strong> <span style="font-size:12px;color:#64748b;">2-301 水电费</span></div>
        <div style="display:flex;align-items:center;gap:12px;"><span style="font-family:'JetBrains Mono',monospace;color:#dc2626;font-weight:600;">¥224.60</span><span style="font-size:11px;color:#94a3b8;">逾期12天</span><button class="btn btn-ghost" style="padding:4px 10px;font-size:12px;" onclick="selectForAiRemind('刘租客',224.6,12)">选择</button></div>
      </div>
    </div>
  </div>
  <div style="border-top:1px solid #e2e8f0;padding-top:20px;">
    <div style="font-size:13px;font-weight:600;color:#334155;margin-bottom:10px;">催缴消息预览</div>
    <div class="ai-msg-preview" id="aiMsgPreview"><span class="ai-msg-loading">← 选择左侧租户后点击下方"生成催缴消息"</span></div>
    <div style="display:flex;gap:10px;margin-top:12px;"><button class="btn btn-ghost" id="btnAiGen" onclick="generateAiRemind()" disabled>🤖 生成消息</button><button class="btn btn-primary" id="btnAiSend" onclick="sendAiRemind()" style="background:linear-gradient(135deg,#7c3aed,#6366f1);" disabled>📤 确认发送</button></div>
  </div>
  <div class="modal-footer" style="margin-top:20px;"><button class="btn btn-ghost" onclick="closeModal('aiRemind')">关闭</button></div>
</div></div>

<!-- 生成账单弹窗 -->
<div class="modal-overlay" id="genModal"><div class="modal">
  <h3>批量生成账单</h3><p class="modal-subtitle">为指定周期自动生成所有已入住房屋的账单</p>
  <div class="form-group"><label>费用类型 *</label><select class="form-input"><option>物业费</option><option>水电费</option><option>停车费</option><option>租金</option></select></div>
  <div class="form-group"><label>费用周期 *</label><input type="month" class="form-input"></div>
  <div class="form-group"><label>单价（元/㎡/月）*</label><input type="number" class="form-input" step="0.01" placeholder="如：3.00"></div>
  <div class="form-hint">将为所有<strong>已入住</strong>房屋生成账单，已存在的账单自动跳过（防重复）</div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('gen')">取消</button><button class="btn btn-primary">确认生成</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script><script src="../js/api.js"></script><script src="../js/page-common.js"></script><script>
initPage({
  name: '收费管理',
  api: {
    findPage: API.paymentFindPage,
    findById: API.paymentFindById,
    add: API.paymentAdd,
    edit: API.paymentEdit,
    delete: API.paymentDelete
  },
  renderRow: function(item, index) {
    var statusMap = {0: ['tag-unpaid', '未缴'], 1: ['tag-paid', '已缴'], 2: ['tag-confirm', '已确认'], 3: ['tag-overdue', '逾期']};
    var s = statusMap[item.payStatus] || statusMap[0];
    var actionBtns = '';
    if (item.payStatus == 1) actionBtns += '<button class="btn-icon">确认</button>';
    else if (item.payStatus == 0 || item.payStatus == 3) actionBtns += '<button class="btn-icon" style="border-color:#7c3aed;color:#7c3aed;">AI催缴</button>';
    actionBtns += '<button class="btn-icon btn-icon-danger">删除</button>';
    return '<td>' + item.billNo + '</td>' +
      '<td>' + (item.tenantName || '-') + '</td>' +
      '<td>' + (item.houseName || '-') + '</td>' +
      '<td>' + (item.feeType || '-') + '</td>' +
      '<td>¥' + (item.amount || 0).toFixed(2) + '</td>' +
      '<td>' + (item.period || '-') + '</td>' +
      '<td><span class="tag ' + s[0] + '">' + s[1] + '</span></td>' +
      '<td class="action-btns">' + actionBtns + '</td>';
  },
  hashActions: { generate: function(){ showToast('打开批量生成弹窗'); }, ai: function(){ openAiRemindModal(); } }
});
initSidebar('payment:list');
</script>
<script>
var aiOwner=null, aiMsg=null;
function closeModal(n){document.getElementById(n+'Modal').classList.remove('show');}
function openAiRemindModal(){document.getElementById('aiRemindModal').classList.add('show');}
function openAiRemindSingle(id){selectForAiRemind('陈租客',150,15);openAiRemindModal();}
function selectForAiRemind(name,amount,days){aiOwner={name:name,amount:amount,days:days};document.getElementById('btnAiGen').disabled=false;document.getElementById('btnAiSend').disabled=true;document.getElementById('aiMsgPreview').innerHTML='<span class="ai-msg-loading">已选择：<strong>'+name+'</strong>，逾期 ¥'+amount+'，'+days+'天</span>';}
function generateAiRemind(){if(!aiOwner)return;var p=document.getElementById('aiMsgPreview');p.innerHTML='<span class="ai-msg-loading">AI 正在生成催缴消息...</span>';setTimeout(function(){aiMsg=aiOwner.name+' 您好，您有账单逾期未缴，总金额 ¥'+aiOwner.amount.toFixed(2)+'，已逾期 '+aiOwner.days+' 天。请尽快登录系统或到物业处缴纳，以免影响信用记录。如有疑问请联系物业客服。感谢配合！';p.textContent=aiMsg;document.getElementById('btnAiSend').disabled=false;},1200);}
function sendAiRemind(){if(!aiMsg)return;alert('催缴消息已发送给 '+aiOwner.name);document.getElementById('btnAiSend').disabled=true;aiOwner=null;aiMsg=null;}
</script>
<div class="modal-overlay" id="editModal"><div class="modal"><h3>编辑账单</h3><div class="form-group"><label>金额 *</label><input type="number" class="form-input" step="0.01" placeholder="请输入金额"></div><div class="form-group"><label>备注</label><textarea class="form-input" rows="3" placeholder="备注信息"></textarea></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('edit')">取消</button><button class="btn btn-primary">保存修改</button></div></div></div>
</body>
</html>
