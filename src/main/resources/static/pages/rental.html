<!DOCTYPE html><html lang="zh-CN"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>租赁管理 - 物业管理系统</title>  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">  <link rel="stylesheet" href="../css/common.css"></head><body><div class="toast" id="toast"></div><div class="admin-layout">  <div id="sidebar-placeholder"></div>  <main class="main-content">    <div class="topbar"><div class="topbar-title">租赁管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>    <div class="page-body">      <div class="stats" id="rentalStats">        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">合同总数</div></div>        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="stat-card-value" id="s-active">-</div><div class="stat-card-label">生效中</div></div>        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value" id="s-expire">-</div><div class="stat-card-label">已到期</div></div>        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg></div><div class="stat-card-value" id="s-terminate">-</div><div class="stat-card-label">提前终止</div></div>      </div>      <div class="toolbar">        <div class="toolbar-left">          <div class="search-group">            <input type="text" class="search-input" id="searchInput" placeholder="搜索合同号、业主、租户">            <button class="btn btn-ghost" id="btnSearch">搜索</button>          </div>          <select class="form-input" id="filterStatus" style="width:auto;margin-left:8px;">            <option value="">全部状态</option>            <option value="1">生效中</option>            <option value="0">已到期</option>            <option value="2">提前终止</option>          </select>        </div>        <button class="btn btn-primary" id="btnAdd">+ 新建合同</button>      </div>      <div class="data-card">        <table>          <thead><tr><th>合同编号</th><th>业主</th><th>租户</th><th>房屋</th><th>租期</th><th>月租金</th><th>状态</th><th>操作</th></tr></thead>          <tbody id="rentalTbody"></tbody>        </table>        <div class="table-footer">          <span class="table-footer-info" id="tableInfo">加载中...</span>          <div class="pagination" id="pagination"></div>        </div>      </div>    </div>  </main></div><div class="modal-overlay" id="formModal">  <div class="modal">    <h3 id="modalTitle">新建合同</h3>    <input type="hidden" id="f-id">    <div class="form-group"><label>合同编号 *</label><input type="text" class="form-input" id="f-no" placeholder="如：HT2025010001"></div>    <div class="form-group"><label>业主 *</label>      <select class="form-input" id="f-owner"><option value="">请选择业主</option></select>    </div>    <div class="form-group"><label>租户 *</label>      <select class="form-input" id="f-tenant"><option value="">请选择租户</option></select>    </div>    <div class="form-group"><label>房屋 *</label>      <select class="form-input" id="f-house"><option value="">请选择房屋</option></select>    </div>    <div class="form-group"><label>开始日期</label><input type="date" class="form-input" id="f-start"></div>    <div class="form-group"><label>结束日期</label><input type="date" class="form-input" id="f-end"></div>    <div class="form-group"><label>月租金</label><input type="number" step="0.01" class="form-input" id="f-rent" placeholder="如：2800"></div>    <div class="form-group"><label>押金</label><input type="number" step="0.01" class="form-input" id="f-deposit" placeholder="如：5600"></div>    <div class="form-group"><label>状态</label>      <select class="form-input" id="f-status"><option value="1">生效中</option><option value="0">已到期</option><option value="2">提前终止</option></select>    </div>    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>  </div></div>  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script><script src="../js/axios-config.js"></script><script src="../js/sidebar.js"></script><script>var currentPage = 1, pageSize = 10, totalPages = 1;function showToast(msg, type) {  var el = document.getElementById('toast');  if (!el) return;  el.textContent = msg;  el.className = 'toast show toast-' + (type || 'success');  clearTimeout(el._timer);  el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000);}function loadOwners() {  return axios.post('/owner/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {    var opts = '<option value="">请选择业主</option>';    res.data.rows.forEach(function(o) { opts += '<option value="' + o.id + '">' + escapeHtml(o.name) + '</option>'; });    document.getElementById('f-owner').innerHTML = opts;  });}function loadTenants() {  return axios.post('/tenant/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {    var opts = '<option value="">请选择租户</option>';    res.data.rows.forEach(function(t) { opts += '<option value="' + t.id + '">' + escapeHtml(t.name) + '</option>'; });    document.getElementById('f-tenant').innerHTML = opts;  });}function loadHouses() {  return axios.post('/house/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {    var opts = '<option value="">请选择房屋</option>';    res.data.rows.forEach(function(h) { opts += '<option value="' + h.id + '">' + escapeHtml((h.buildingName || '') + '-' + h.roomNo) + '</option>'; });    document.getElementById('f-house').innerHTML = opts;  });}function loadList(page) {  currentPage = page || 1;  var queryString = document.getElementById('searchInput').value.trim();  var status = document.getElementById('filterStatus').value;  if (status) queryString = queryString ? queryString + ' ' + status : status;  axios.post('/rental/findPage', { currentPage: currentPage, pageSize: pageSize, queryString: queryString }).then(function(res) {    renderTable(res.data.rows);    totalPages = Math.ceil(res.data.total / pageSize) || 1;    renderPagination(document.getElementById('tableInfo'), res.data.total);    loadStats();  }).catch(function() { showToast('加载失败', 'error'); });}function renderTable(list) {  var tbody = document.getElementById('rentalTbody');  if (!list || list.length === 0) {    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>';    return;  }  var html = '';  list.forEach(function(r) {    var statusTag = r.status == 1 ? '<span class="tag tag-ok">生效中</span>' : (r.status == 2 ? '<span class="tag tag-off">提前终止</span>' : '<span class="tag tag-overdue">已到期</span>');    html += '<tr>';    html += '<td>' + escapeHtml(r.rentalNo) + '</td>';    html += '<td>' + escapeHtml(r.ownerName || '-') + '</td>';    html += '<td>' + escapeHtml(r.tenantName || '-') + '</td>';    html += '<td>' + escapeHtml(r.houseAddress || '-') + '</td>';    html += '<td>' + (r.startDate ? r.startDate.substr(0, 10) : '-') + ' ~ ' + (r.endDate ? r.endDate.substr(0, 10) : '-') + '</td>';    html += '<td>' + (r.monthlyRent ? '￥' + r.monthlyRent : '-') + '</td>';    html += '<td>' + statusTag + '</td>';    html += '<td class="action-btns">';    html += '<button class="btn-icon btn-edit" data-id="' + r.id + '">编辑</button>';    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + r.id + '">删除</button>';    html += '</td></tr>';  });  tbody.innerHTML = html;  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });}function renderPagination(infoEl, total) {  infoEl.textContent = '显示第 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条';  var pag = document.getElementById('pagination');  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">?</button>';  for (var p = 1; p <= totalPages; p++) html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">?</button>';  pag.innerHTML = html;  pag.querySelectorAll('.page-btn').forEach(function(btn) {    btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); });  });}function loadStats() {  axios.post('/rental/findPage', { currentPage: 1, pageSize: 9999, queryString: '' }).then(function(res) {    var list = res.data.rows;    document.getElementById('s-total').textContent = list.length;    document.getElementById('s-active').textContent = list.filter(function(r) { return r.status == 1; }).length;    document.getElementById('s-expire').textContent = list.filter(function(r) { return r.status == 0; }).length;    document.getElementById('s-terminate').textContent = list.filter(function(r) { return r.status == 2; }).length;  });}function openAdd() {  document.getElementById('modalTitle').textContent = '新建合同';  document.getElementById('f-id').value = '';  document.getElementById('f-no').value = 'HT' + new Date().getFullYear() + String(Math.floor(Math.random() * 999999)).padStart(6, '0');  document.getElementById('f-owner').value = '';  document.getElementById('f-tenant').value = '';  document.getElementById('f-house').value = '';  document.getElementById('f-start').value = '';  document.getElementById('f-end').value = '';  document.getElementById('f-rent').value = '';  document.getElementById('f-deposit').value = '';  document.getElementById('f-status').value = '1';  document.getElementById('formModal').classList.add('show');}function openEdit(id) {  axios.get('/rental/findById/' + id).then(function(res) {    var r = res.data;    document.getElementById('modalTitle').textContent = '编辑合同';    document.getElementById('f-id').value = r.id;    document.getElementById('f-no').value = r.rentalNo || '';    document.getElementById('f-owner').value = r.ownerId || '';    document.getElementById('f-tenant').value = r.tenantId || '';    document.getElementById('f-house').value = r.houseId || '';    document.getElementById('f-start').value = r.startDate ? r.startDate.substr(0, 10) : '';    document.getElementById('f-end').value = r.endDate ? r.endDate.substr(0, 10) : '';    document.getElementById('f-rent').value = r.monthlyRent || '';    document.getElementById('f-deposit').value = r.deposit || '';    document.getElementById('f-status').value = r.status != null ? r.status : '1';    document.getElementById('formModal').classList.add('show');  });}function doSave() {  var id = document.getElementById('f-id').value;  var data = {    rentalNo: document.getElementById('f-no').value.trim(),    ownerId: parseInt(document.getElementById('f-owner').value) || null,    tenantId: parseInt(document.getElementById('f-tenant').value) || null,    houseId: parseInt(document.getElementById('f-house').value) || null,    startDate: document.getElementById('f-start').value || null,    endDate: document.getElementById('f-end').value || null,    monthlyRent: parseFloat(document.getElementById('f-rent').value) || 0,    deposit: parseFloat(document.getElementById('f-deposit').value) || 0,    status: parseInt(document.getElementById('f-status').value)  };  if (!data.rentalNo) { showToast('请填写合同编号', 'error'); return; }  if (!data.ownerId) { showToast('请选择业主', 'error'); return; }  if (!data.tenantId) { showToast('请选择租户', 'error'); return; }  if (!data.houseId) { showToast('请选择房屋', 'error'); return; }  var promise = id ? axios.put('/rental/edit', Object.assign({id: parseInt(id)}, data)) : axios.post('/rental/add', data);  promise.then(function() { showToast(id ? '修改成功' : '新增成功'); closeModal('form'); loadList(currentPage); }).catch(function() {});}function doDelete(id) {  if (!confirm('确认删除该合同吗？此操作不可恢复。')) return;  axios.delete('/rental/delete/' + id).then(function() { showToast('删除成功'); loadList(currentPage); }).catch(function() {});}function closeModal(name) { document.getElementById(name + 'Modal').classList.remove('show'); }function escapeHtml(s) { return s ? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '-'; }document.getElementById('btnAdd').addEventListener('click', openAdd);document.getElementById('btnSave').addEventListener('click', doSave);document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); });document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); });document.getElementById('filterStatus').addEventListener('change', function() { loadList(1); });document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });Promise.all([loadOwners(), loadTenants(), loadHouses()]).then(function() { loadList(1); }).catch(function() {});initSidebar('rental:house');</script></body></html>
