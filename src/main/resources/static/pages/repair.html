<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报修服务 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">报修服务</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div><div class="stat-card-value">186</div><div class="stat-card-label">本月工单</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="stat-card-value">162</div><div class="stat-card-label">已完成</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value">2.3h</div><div class="stat-card-label">平均响应</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><div class="stat-card-value">97%</div><div class="stat-card-label">满意度</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" id="searchInput" class="search-input" placeholder="搜索工单号、业主"><select id="filterStatus" class="filter-select"><option value="">全部状态</option><option value="0">待派单</option><option value="1">维修中</option><option value="2">已完成</option></select><select id="filterUrgency" class="filter-select"><option value="">紧急程度</option><option value="一般">一般</option><option value="紧急">紧急</option><option value="特急">特急</option></select><button id="btnSearch" class="btn btn-ghost">搜索</button></div></div><button id="btnAdd" class="btn btn-primary">+ 新增报修</button></div>
      <div class="data-card"><table><thead><tr><th>工单号</th><th>报修人</th><th>房屋</th><th>问题类型</th><th>紧急程度</th><th>派单维修工</th><th>创建时间</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table><div class="table-footer"><span class="table-footer-info">加载中...</span><div class="pagination"><button class="page-btn disabled">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div></div></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script><script src="../js/api.js"></script><script src="../js/page-common.js"></script><script>
initPage({
  name: '报修服务',
  api: {
    findPage: API.repairFindPage,
    findById: API.repairFindById,
    add: API.repairAdd,
    edit: API.repairEdit,
    delete: API.repairDelete,
    dispatch: API.repairDispatch,
    evaluate: API.repairEvaluate
  },
  renderRow: function(item, index) {
    var urgencyMap = {0: ['tag-info', '一般'], 1: ['tag-overdue', '紧急'], 2: ['tag-overdue', '特急']};
    var u = urgencyMap[item.urgency] || urgencyMap[0];
    var statusMap = {0: ['tag-unpaid', '待派单'], 1: ['tag-paid', '维修中'], 2: ['tag-confirm', '已完成']};
    var s = statusMap[item.status] || statusMap[0];
    var actionBtns = '<button class="btn-icon">查看</button>';
    if (item.status == 0) actionBtns += '<button class="btn-icon">派单</button>';
    else if (item.status == 1) actionBtns += '<button class="btn-icon">催办</button>';
    else if (item.status == 2) actionBtns += '<button class="btn-icon">评价</button>';
    return '<td>' + item.workOrderNo + '</td>' +
      '<td>' + (item.repairName || '-') + '</td>' +
      '<td>' + (item.houseName || '-') + '</td>' +
      '<td>' + (item.faultType || '-') + '</td>' +
      '<td><span class="tag ' + u[0] + '">' + u[1] + '</span></td>' +
      '<td>' + (item.workerName || '-') + '</td>' +
      '<td>' + (item.createTime || '-') + '</td>' +
      '<td><span class="tag ' + s[0] + '">' + s[1] + '</span></td>' +
      '<td class="action-btns">' + actionBtns + '</td>';
  },
  hashActions: { pending: function(){ showToast('筛选待派单工单'); }, processing: function(){ showToast('筛选维修中工单'); } }
});
initSidebar('repair:list');
</script>
<div class="modal-overlay" id="editModal"><div class="modal"><h3>编辑信息</h3><div class="form-group"><label>名称 *</label><input type="text" class="form-input" placeholder="请输入"></div><div class="form-group"><label>备注</label><textarea class="form-input" rows="3" placeholder="备注信息"></textarea></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('edit')">取消</button><button class="btn btn-primary">保存修改</button></div></div></div>
</body>
</html>
