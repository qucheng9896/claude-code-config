<!DOCTYPE html><html lang="zh-CN"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>报修服务 - 物业管理系统</title>  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">  <link rel="stylesheet" href="../css/common.css"></head><body><div class="toast" id="toast"></div><div class="admin-layout">  <div id="sidebar-placeholder"></div>  <main class="main-content">    <div class="topbar"><div class="topbar-title">报修服务</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>    <div class="page-body">      <div class="stats" id="repairStats">        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">工单总数</div></div>        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value" id="s-pending">-</div><div class="stat-card-label">待派单</div></div>        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M2 12h20"/></svg></div><div class="stat-card-value" id="s-processing">-</div><div class="stat-card-label">维修中</div></div>        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg></div><div class="stat-card-value" id="s-done">-</div><div class="stat-card-label">已完成</div></div>      </div>      <div class="toolbar">        <div class="toolbar-left">          <div class="search-group">            <input type="text" class="search-input" id="searchInput" placeholder="搜索工号、报修人">            <button class="btn btn-ghost" id="btnSearch">搜索</button>          </div>          <select class="form-input" id="filterStatus" style="width:auto;margin-left:8px;">            <option value="">全部状态</option>            <option value="0">待派单</option>            <option value="1">维修中</option>            <option value="2">已完成</option>          </select>        </div>        <button class="btn btn-primary" id="btnAdd">+ 新建工单</button>      </div>      <div class="data-card">        <table>          <thead><tr><th>工单编号</th><th>报修人</th><th>问题类型</th><th>紧急程度</th><th>维修人</th><th>派单时间</th><th>状态</th><th>操作</th></tr></thead>          <tbody id="repairTbody"></tbody>        </table>        <div class="table-footer">          <span class="table-footer-info" id="tableInfo">加载中...</span>          <div class="pagination" id="pagination"></div>        </div>      </div>    </div>  </main></div><div class="modal-overlay" id="formModal">  <div class="modal">    <h3 id="modalTitle">新建工单</h3>    <input type="hidden" id="f-id">    <div class="form-group"><label>工单编号 *</label><input type="text" class="form-input" id="f-no" placeholder="如：WX2501001"></div>    <div class="form-group"><label>报修人 *</label><input type="text" class="form-input" id="f-reporter" placeholder="请输入报修人"></div>    <div class="form-group"><label>问题类型</label><input type="text" class="form-input" id="f-issue" placeholder="如：水管漏水"></div>    <div class="form-group"><label>紧急程度</label>      <select class="form-input" id="f-urgency"><option value="1">一般</option><option value="2">紧急</option><option value="3">非常紧急</option></select>    </div>    <div class="form-group"><label>问题描述</label><textarea class="form-input" id="f-desc" rows="3" placeholder="请描述问题"></textarea></div>    <div class="form-group"><label>维修人</label>      <select class="form-input" id="f-worker"><option value="">请选择维修人</option></select>    </div>    <div class="form-group"><label>状态</label>      <select class="form-input" id="f-status"><option value="0">待派单</option><option value="1">维修中</option><option value="2">已完成</option></select>    </div>    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>  </div></div>  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script><script src="../js/axios-config.js"></script><script src="../js/sidebar.js"></script><script>var currentPage = 1, pageSize = 10, totalPages = 1;function showToast(msg, type) {  var el = document.getElementById('toast');  if (!el) return;  el.textContent = msg;  el.className = 'toast show toast-' + (type || 'success');  clearTimeout(el._timer);  el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000);}function loadWorkers() {  return axios.post('/employee/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {    var opts = '<option value="">请选择维修人</option>';    res.data.rows.forEach(function(e) { opts += '<option value="' + e.id + '" data-name="' + escapeHtml(e.name) + '">' + escapeHtml(e.name + ' (' + (e.position || '') + ')') + '</option>'; });    document.getElementById('f-worker').innerHTML = opts;  });}function loadList(page) {  currentPage = page || 1;  var queryString = document.getElementById('searchInput').value.trim();  var status = document.getElementById('filterStatus').value;  if (status) queryString = queryString ? queryString + ' ' + status : status;  axios.post('/repair/findPage', { currentPage: currentPage, pageSize: pageSize, queryString: queryString }).then(function(res) {    renderTable(res.data.rows);    totalPages = Math.ceil(res.data.total / pageSize) || 1;    renderPagination(document.getElementById('tableInfo'), res.data.total);    loadStats();  }).catch(function() { showToast('加载失败', 'error'); });}function renderTable(list) {  var tbody = document.getElementById('repairTbody');  if (!list || list.length === 0) {    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>';    return;  }  var html = '';  list.forEach(function(r) {    var statusTag = r.status == 2 ? '<span class="tag tag-ok">已完成</span>' : (r.status == 1 ? '<span class="tag tag-paid">维修中</span>' : '<span class="tag tag-info">待派单</span>');    var urgencyTag = r.urgency == 3 ? '<span class="tag tag-overdue">非常紧急</span>' : (r.urgency == 2 ? '<span class="tag tag-confirm">紧急</span>' : '<span class="tag tag-info">一般</span>');    html += '<tr>';    html += '<td>' + escapeHtml(r.orderNo) + '</td>';    html += '<td>' + escapeHtml(r.reporter || '-') + '</td>';    html += '<td>' + escapeHtml(r.issueType || '-') + '</td>';    html += '<td>' + urgencyTag + '</td>';    html += '<td>' + escapeHtml(r.workerName || '待派单') + '</td>';    html += '<td>' + (r.dispatchTime ? r.dispatchTime.replace('T', ' ').substr(0, 16) : '-') + '</td>';    html += '<td>' + statusTag + '</td>';    html += '<td class="action-btns">';    html += '<button class="btn-icon btn-edit" data-id="' + r.id + '">编辑</button>';    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + r.id + '">删除</button>';    html += '</td></tr>';  });  tbody.innerHTML = html;  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });}function renderPagination(infoEl, total) {  infoEl.textContent = '显示第 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条';  var pag = document.getElementById('pagination');  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">?</button>';  for (var p = 1; p <= totalPages; p++) html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">?</button>';  pag.innerHTML = html;  pag.querySelectorAll('.page-btn').forEach(function(btn) {    btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); });  });}function loadStats() {  axios.post('/repair/findPage', { currentPage: 1, pageSize: 9999, queryString: '' }).then(function(res) {    var list = res.data.rows;    document.getElementById('s-total').textContent = list.length;    document.getElementById('s-pending').textContent = list.filter(function(r) { return r.status == 0; }).length;    document.getElementById('s-processing').textContent = list.filter(function(r) { return r.status == 1; }).length;    document.getElementById('s-done').textContent = list.filter(function(r) { return r.status == 2; }).length;  });}function openAdd() {  document.getElementById('modalTitle').textContent = '新建工单';  document.getElementById('f-id').value = '';  document.getElementById('f-no').value = 'WX' + new Date().getFullYear() + String(Math.floor(Math.random() * 999999)).padStart(6, '0');  document.getElementById('f-reporter').value = '';  document.getElementById('f-issue').value = '';  document.getElementById('f-urgency').value = '1';  document.getElementById('f-desc').value = '';  document.getElementById('f-worker').value = '';  document.getElementById('f-status').value = '0';  document.getElementById('formModal').classList.add('show');}function openEdit(id) {  axios.get('/repair/findById/' + id).then(function(res) {    var r = res.data;    document.getElementById('modalTitle').textContent = '编辑工单';    document.getElementById('f-id').value = r.id;    document.getElementById('f-no').value = r.orderNo || '';    document.getElementById('f-reporter').value = r.reporter || '';    document.getElementById('f-issue').value = r.issueType || '';    document.getElementById('f-urgency').value = r.urgency || '1';    document.getElementById('f-desc').value = r.description || '';    document.getElementById('f-worker').value = r.workerId || '';    document.getElementById('f-status').value = r.status != null ? r.status : '0';    document.getElementById('formModal').classList.add('show');  });}function doSave() {  var id = document.getElementById('f-id').value;  var workerSel = document.getElementById('f-worker');  var workerName = workerSel.value ? workerSel.options[workerSel.selectedIndex].dataset.name : '';  var data = {    orderNo: document.getElementById('f-no').value.trim(),    reporter: document.getElementById('f-reporter').value.trim(),    issueType: document.getElementById('f-issue').value.trim(),    urgency: parseInt(document.getElementById('f-urgency').value),    description: document.getElementById('f-desc').value.trim(),    workerId: parseInt(workerSel.value) || null,    workerName: workerName,    status: parseInt(document.getElementById('f-status').value)  };  if (!data.orderNo) { showToast('请填写工单编号', 'error'); return; }  if (!data.reporter) { showToast('请填写报修人', 'error'); return; }  var promise = id ? axios.put('/repair/edit', Object.assign({id: parseInt(id)}, data)) : axios.post('/repair/add', data);  promise.then(function() { showToast(id ? '修改成功' : '新增成功'); closeModal('form'); loadList(currentPage); }).catch(function() {});}function doDelete(id) {  if (!confirm('确认删除该工单吗？此操作不可恢复。')) return;  axios.delete('/repair/delete/' + id).then(function() { showToast('删除成功'); loadList(currentPage); }).catch(function() {});}function closeModal(name) { document.getElementById(name + 'Modal').classList.remove('show'); }function escapeHtml(s) { return s ? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '-'; }document.getElementById('btnAdd').addEventListener('click', openAdd);document.getElementById('btnSave').addEventListener('click', doSave);document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); });document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); });document.getElementById('filterStatus').addEventListener('change', function() { loadList(1); });document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });Promise.all([loadWorkers()]).then(function() { loadList(1); }).catch(function() {});initSidebar('repair:list');</script></body></html>
