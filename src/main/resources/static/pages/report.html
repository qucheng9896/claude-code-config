<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报表统计 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">报表统计</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="stat-card-value" id="v-paid">-</div><div class="stat-card-label">累计已收缴</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div><div class="stat-card-value" id="v-rate">-</div><div class="stat-card-label">综合收缴率</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value" id="v-overdue">-</div><div class="stat-card-label">逾期未缴</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></div><div class="stat-card-value" id="v-bills">-</div><div class="stat-card-label">账单总数</div></div>
      </div>
      <div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:24px;margin-top:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><div style="font-size:15px;font-weight:600;">月度收缴明细表</div><button class="btn btn-ghost" onclick="exportCSV()">导出 CSV</button></div>
        <table><thead><tr><th>月份</th><th>物业费</th><th>水电费</th><th>停车费</th><th>合计</th><th>收缴率</th></tr></thead><tbody id="reportTbody">
          <tr><td>加载中...</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>
        </tbody></table>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/page-common.js"></script>
<script>
initSidebar('report:payment');
axios.get('/dashboard/payment').then(function(res) {
  if (res.flag) {
    var d = res.data;
    document.getElementById('v-paid').textContent = '¥' + ((d.totalPaidAmount || 0) / 1000).toFixed(0) + 'K';
    document.getElementById('v-rate').textContent = (d.paymentRate || '0%');
    document.getElementById('v-overdue').textContent = '¥' + ((d.totalOverdueAmount || 0) / 1000).toFixed(1) + 'K';
    document.getElementById('v-bills').textContent = d.totalBills || 0;
  }
}).catch(function() {});
</script>
</body>
</html>
