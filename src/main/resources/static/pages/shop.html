<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商铺管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">商铺管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M5 21V7l8-4 8 4v14"/></svg></div><div class="stat-card-value">36</div><div class="stat-card-label">商铺总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg></div><div class="stat-card-value">31</div><div class="stat-card-label">已出租</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="stat-card-value">¥95K</div><div class="stat-card-label">月租金总额</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg></div><div class="stat-card-value">86.1%</div><div class="stat-card-label">出租率</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" placeholder="搜索商铺编号、租户"><select class="filter-select"><option value="">全部状态</option><option>在租</option><option>空置</option><option>自用</option></select><button class="btn btn-ghost">搜索</button></div></div><button class="btn btn-primary">+ 新增商铺</button></div>
      <div class="data-card"><table><thead><tr><th>商铺编号</th><th>面积(㎡)</th><th>业主</th><th>当前租户</th><th>月租金</th><th>经营范围</th><th>状态</th><th>操作</th></tr></thead><tbody>
        <tr data-idx="0"><td>S1F-001</td><td>120.00</td><td>物业自持</td><td>便利超市</td><td>¥5,800</td><td>便利店</td><td><span class="tag tag-ok">在租</span></td><td class="action-btns"><button class="btn-icon">合同</button><button class="btn-icon">编辑</button></td></tr>
        <tr data-idx="1"><td>S1F-002</td><td>85.50</td><td>物业自持</td><td>鑫鑫餐饮</td><td>¥4,200</td><td>餐饮</td><td><span class="tag tag-ok">在租</span></td><td class="action-btns"><button class="btn-icon">合同</button><button class="btn-icon">编辑</button></td></tr>
        <tr data-idx="2"><td>S1F-003</td><td>200.00</td><td>王大明</td><td>—</td><td>—</td><td>—</td><td><span class="tag tag-empty">空置</span></td><td class="action-btns"><button class="btn-icon">招商</button><button class="btn-icon">编辑</button></td></tr>
        <tr data-idx="3"><td>S2F-001</td><td>60.00</td><td>李小红</td><td>鲜丰水果</td><td>¥3,600</td><td>水果生鲜</td><td><span class="tag tag-ok">在租</span></td><td class="action-btns"><button class="btn-icon">合同</button><button class="btn-icon">编辑</button></td></tr>
      </tbody></table><div class="table-footer"><span class="table-footer-info">显示 1-4 条，共 36 间商铺</span><div class="pagination"><button class="page-btn disabled">‹</button><button class="page-btn active">1</button><button class="page-btn">›</button></div></div></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;
function showToast(msg) { var el = document.getElementById('toast'); if (!el) return; el.textContent = msg; el.className = 'toast show'; setTimeout(function() { el.className = 'toast'; }, 3000); }
function loadList(page) { currentPage = page || 1; var q = document.getElementById('searchInput').value.trim(); var s = document.getElementById('filterStatus').value; if (s) q = q ? q + ' ' + s : s; axios.post('/shop/findPage', { currentPage: currentPage, pageSize: pageSize, queryString: q }).then(function(res) { renderTable(res.data.rows); totalPages = Math.ceil(res.data.total / pageSize) || 1; renderPagination(document.getElementById('tableInfo'), res.data.total); loadStats(); }); }
function renderTable(list) { var tb = document.getElementById('shopTbody'); if (!list || !list.length) { tb.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>'; return; } var h = ''; list.forEach(function(x) { var tag = x.status == 1 ? '<span class="tag tag-ok">在租</span>' : '<span class="tag tag-empty">空置</span>'; h += '<tr><td>' + x.id + '</td><td><strong>' + (x.shopNo || '-') + '</strong></td><td>' + (x.area || '-') + '</td><td>' + (x.ownerName || '-') + '</td><td>' + (x.tenantName || '-') + '</td><td>' + (x.monthlyRent ? '¥' + x.monthlyRent : '-') + '</td><td>' + (x.businessScope || '-') + '</td><td>' + tag + '</td><td class="action-btns"><button class="btn-icon btn-edit" data-id="' + x.id + '">编辑</button><button class="btn-icon btn-icon-danger btn-del" data-id="' + x.id + '">删除</button></td></tr>'; }); tb.innerHTML = h; tb.querySelectorAll('.btn-edit').forEach(function(b) { b.addEventListener('click', function() { openEdit(this.dataset.id); }); }); tb.querySelectorAll('.btn-del').forEach(function(b) { b.addEventListener('click', function() { doDelete(this.dataset.id); }); }); }
function renderPagination(e, t) { e.textContent = '显示第' + ((currentPage-1)*pageSize+1) + '-' + Math.min(currentPage*pageSize, t) + ' 条，共 ' + t + ' 条'; var p = document.getElementById('pagination'), h = '<button class="page-btn' + (currentPage<=1?' disabled':'') + '" data-page="' + (currentPage-1) + '">‹</button>'; for (var i=1;i<=totalPages;i++) h += '<button class="page-btn'+(i===currentPage?' active':'')+'" data-page="'+i+'">'+i+'</button>'; h += '<button class="page-btn'+(currentPage>=totalPages?' disabled':'')+'" data-page="'+(currentPage+1)+'">›</button>'; p.innerHTML = h; p.querySelectorAll('.page-btn').forEach(function(b) { b.addEventListener('click', function() { var pg=parseInt(this.dataset.page); if(pg>=1&&pg<=totalPages) loadList(pg); }); }); }
function loadStats() { axios.post('/shop/findPage', {currentPage:1,pageSize:9999,queryString:''}).then(function(res){var l=res.data.rows;document.getElementById('s-total').textContent=l.length;var r=l.filter(function(x){return x.status==1}).length;document.getElementById('s-rented').textContent=r;document.getElementById('s-rate').textContent=l.length?(r*100/l.length).toFixed(1)+'%':'0%';}); }
function openAdd(){document.getElementById('modalTitle').textContent='新增商铺';document.getElementById('f-id').value='';document.getElementById('formModal').classList.add('show');}
function openEdit(id){axios.get('/shop/findById/'+id).then(function(res){var x=res.data;document.getElementById('modalTitle').textContent='编辑商铺';document.getElementById('f-id').value=x.id;document.getElementById('f-no').value=x.shopNo||'';document.getElementById('f-area').value=x.area||'';document.getElementById('f-status').value=x.status!=null?x.status:'0';document.getElementById('formModal').classList.add('show');});}
function doSave(){var id=document.getElementById('f-id').value;var data={shopNo:document.getElementById('f-no').value.trim(),area:parseFloat(document.getElementById('f-area').value)||0,status:parseInt(document.getElementById('f-status').value)};if(!data.shopNo){showToast('请填写商铺编号');return;}var p=id?axios.put('/shop/edit',Object.assign({id:parseInt(id)},data)):axios.post('/shop/add',data);p.then(function(){showToast(id?'修改成功':'新增成功');closeModal('form');loadList(currentPage);});}
function doDelete(id){if(!confirm('确认删除该商铺吗？'))return;axios.delete('/shop/delete/'+id).then(function(){showToast('删除成功');loadList(currentPage);});}
function closeModal(n){document.getElementById(n+'Modal').classList.remove('show');}
document.getElementById('btnAdd').addEventListener('click',openAdd);document.getElementById('btnSave').addEventListener('click',doSave);document.getElementById('btnSearch').addEventListener('click',function(){loadList(1);});document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')loadList(1);});document.getElementById('filterStatus').addEventListener('change',function(){loadList(1);});document.getElementById('formModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
loadList(1);initSidebar('shop:list');
</script>
<div class="modal-overlay" id="editModal"><div class="modal"><h3>编辑信息</h3><div class="form-group"><label>名称 *</label><input type="text" class="form-input" placeholder="请输入"></div><div class="form-group"><label>备注</label><textarea class="form-input" rows="3" placeholder="备注信息"></textarea></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('edit')">取消</button><button class="btn btn-primary">保存修改</button></div></div></div>
</body>
</html>
