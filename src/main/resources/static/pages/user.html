<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">用户管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">用户总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"></div><div class="stat-card-value" id="s-admin">-</div><div class="stat-card-label">管理员</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"></div><div class="stat-card-value" id="s-owner">-</div><div class="stat-card-label">业主用户</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"></div><div class="stat-card-value" id="s-active">-</div><div class="stat-card-label">正常状态</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" id="searchInput" placeholder="搜索用户名、姓名"><select class="filter-select" id="filterRole"><option value="">全部角色</option><option value="1">管理员</option><option value="2">业主</option><option value="3">租户</option></select><select class="filter-select" id="filterStatus"><option value="">全部状态</option><option value="1">正常</option><option value="0">停用</option></select><button class="btn btn-ghost" id="btnSearch">搜索</button></div></div><button class="btn btn-primary" id="btnAdd">+ 新增用户</button></div>
      <div class="data-card"><table><thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>手机号</th><th>角色</th><th>状态</th><th>最后登录</th><th>操作</th></tr></thead><tbody id="userTbody"></tbody></table>
        <div class="table-footer"><span class="table-footer-info" id="tableInfo">加载中...</span><div class="pagination" id="pagination"></div></div>
      </div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="formModal"><div class="modal"><h3 id="modalTitle">新增用户</h3><input type="hidden" id="f-id">
  <div class="form-group"><label>用户名 *</label><input type="text" class="form-input" id="f-username" placeholder="请输入用户名"></div>
  <div class="form-group"><label>密码 *</label><input type="password" class="form-input" id="f-password" placeholder="请输入密码"></div>
  <div class="form-group"><label>姓名 *</label><input type="text" class="form-input" id="f-name" placeholder="请输入姓名"></div>
  <div class="form-group"><label>手机号</label><input type="text" class="form-input" id="f-phone" placeholder="请输入手机号"></div>
  <div class="form-group"><label>邮箱</label><input type="text" class="form-input" id="f-email" placeholder="请输入邮箱"></div>
  <div class="form-group"><label>角色</label><select class="form-input" id="f-roleId"><option value="1">管理员</option><option value="2">业主</option><option value="3">租户</option></select></div>
  <div class="form-group"><label>状态</label><select class="form-input" id="f-status"><option value="1">正常</option><option value="0">停用</option></select></div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;
function showToast(msg) { var el = document.getElementById("toast"); if (!el) return; el.textContent = msg; el.className = "toast show"; setTimeout(function() { el.className = "toast"; }, 3000); }
function fmtDate(d) { return d ? (typeof d === 'string' ? d.substring(0,19).replace('T',' ') : d) : '-'; }
function loadList(page) {
  currentPage = page || 1;
  var q = document.getElementById("searchInput").value.trim();
  var roleId = document.getElementById("filterRole").value;
  var status = document.getElementById("filterStatus").value;
  var params = { currentPage: currentPage, pageSize: pageSize, queryString: q };
  if (roleId) params.roleId = parseInt(roleId);
  if (status) params.status = parseInt(status);
  axios.post("/user/findPage", params).then(function(res) {
    renderTable(res.data.rows);
    totalPages = Math.ceil(res.data.total / pageSize) || 1;
    document.getElementById("tableInfo").textContent = "显示第" + ((currentPage-1)*pageSize+1) + "-" + Math.min(currentPage*pageSize, res.data.total) + " 条，共 " + res.data.total + " 条";
    renderPagination();
    loadStats();
  });
}
function renderTable(list) {
  var tb = document.getElementById("userTbody");
  if (!list || !list.length) { tb.innerHTML = "<tr><td colspan=\"8\" style=\"text-align:center;color:#94a3b8;padding:40px\">暂无数据</td></tr>"; return; }
  var h = "";
  list.forEach(function(u) {
    var roleMap = { "1": "<span class='tag tag-admin'>管理员</span>", "2": "<span class='tag tag-owner'>业主</span>", "3": "<span class='tag tag-info'>租户</span>" };
    var statusMap = { "1": "<span class='tag tag-ok'>正常</span>", "0": "<span class='tag tag-off'>停用</span>" };
    h += "<tr><td>" + u.id + "</td><td><strong>" + (u.username || "-") + "</strong></td><td>" + (u.name || "-") + "</td><td>" + (u.phone || "-") + "</td><td>" + (roleMap[u.roleId] || u.roleId || "-") + "</td><td>" + (statusMap[u.status] || "-") + "</td><td>" + fmtDate(u.lastLoginTime) + "</td><td class='action-btns'><button class='btn-icon btn-edit' data-id='" + u.id + "'>编辑</button><button class='btn-icon btn-icon-danger btn-del' data-id='" + u.id + "'>删除</button></td></tr>";
  });
  tb.innerHTML = h;
  tb.querySelectorAll(".btn-edit").forEach(function(b) { b.addEventListener("click", function() { openEdit(this.dataset.id); }); });
  tb.querySelectorAll(".btn-del").forEach(function(b) { b.addEventListener("click", function() { doDelete(this.dataset.id); }); });
}
function renderPagination() {
  var p = document.getElementById("pagination");
  var h = "<button class='page-btn" + (currentPage<=1?" disabled":"") + "' data-page='" + (currentPage-1) + "'>‹</button>";
  for (var i=1;i<=totalPages;i++) h += "<button class='page-btn"+(i===currentPage?" active":"")+"' data-page='"+i+"'>"+i+"</button>";
  h += "<button class='page-btn"+(currentPage>=totalPages?" disabled":"")+"' data-page='"+(currentPage+1)+"'>›</button>";
  p.innerHTML = h;
  p.querySelectorAll(".page-btn").forEach(function(b) { b.addEventListener("click", function() { var pg=parseInt(this.dataset.page); if(pg>=1&&pg<=totalPages) loadList(pg); }); });
}
function loadStats() {
  axios.post("/user/findPage", { currentPage: 1, pageSize: 1 }).then(function(res) { document.getElementById("s-total").textContent = res.data.total || 0; });
  axios.post("/user/findPage", { currentPage: 1, pageSize: 1, roleId: 1 }).then(function(res) { document.getElementById("s-admin").textContent = res.data.total || 0; });
  axios.post("/user/findPage", { currentPage: 1, pageSize: 1, roleId: 2 }).then(function(res) { document.getElementById("s-owner").textContent = res.data.total || 0; });
  axios.post("/user/findPage", { currentPage: 1, pageSize: 1, status: 1 }).then(function(res) { document.getElementById("s-active").textContent = res.data.total || 0; });
}
function openAdd() {
  document.getElementById("modalTitle").textContent = "新增用户";
  document.getElementById("f-id").value = "";
  ["f-username","f-password","f-name","f-phone","f-email"].forEach(function(id){document.getElementById(id).value="";});
  document.getElementById("f-roleId").value = "2";
  document.getElementById("f-status").value = "1";
  document.getElementById("formModal").classList.add("show");
}
function openEdit(id) {
  axios.get("/user/findById/" + id).then(function(res) {
    var u = res.data;
    document.getElementById("modalTitle").textContent = "编辑用户";
    document.getElementById("f-id").value = u.id;
    document.getElementById("f-username").value = u.username || "";
    document.getElementById("f-password").value = "";
    document.getElementById("f-name").value = u.name || "";
    document.getElementById("f-phone").value = u.phone || "";
    document.getElementById("f-email").value = u.email || "";
    document.getElementById("f-roleId").value = u.roleId || "2";
    document.getElementById("f-status").value = u.status != null ? u.status : "1";
    document.getElementById("formModal").classList.add("show");
  });
}
function doSave() {
  var id = document.getElementById("f-id").value;
  var data = {
    username: document.getElementById("f-username").value.trim(),
    name: document.getElementById("f-name").value.trim(),
    phone: document.getElementById("f-phone").value.trim(),
    email: document.getElementById("f-email").value.trim(),
    roleId: parseInt(document.getElementById("f-roleId").value),
    status: parseInt(document.getElementById("f-status").value)
  };
  var pwd = document.getElementById("f-password").value;
  if (!data.username) { showToast("请填写用户名"); return; }
  if (!data.name) { showToast("请填写姓名"); return; }
  if (!id && !pwd) { showToast("请填写密码"); return; }
  if (pwd) data.password = pwd;
  var p = id ? axios.put("/user/edit", Object.assign({ id: parseInt(id) }, data)) : axios.post("/user/add", data);
  p.then(function() { showToast(id ? "修改成功" : "新增成功"); closeModal("form"); loadList(currentPage); });
}
function doDelete(id) { if (!confirm("确认删除该用户吗？此操作不可恢复。")) return; axios.delete("/user/delete/" + id).then(function() { showToast("删除成功"); loadList(currentPage); }); }
function closeModal(n) { document.getElementById(n + "Modal").classList.remove("show"); }
document.getElementById("btnAdd").addEventListener("click", openAdd);
document.getElementById("btnSave").addEventListener("click", doSave);
document.getElementById("btnSearch").addEventListener("click", function() { loadList(1); });
document.getElementById("searchInput").addEventListener("keydown", function(e) { if (e.key === "Enter") loadList(1); });
document.getElementById("filterRole").addEventListener("change", function() { loadList(1); });
document.getElementById("filterStatus").addEventListener("change", function() { loadList(1); });
document.getElementById("formModal").addEventListener("click", function(e) { if (e.target === this) this.classList.remove("show"); });
loadList(1); initSidebar("user:list");
</script>
</body>
</html>
