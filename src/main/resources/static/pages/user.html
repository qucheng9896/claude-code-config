<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">用户管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="stat-card-value">161</div><div class="stat-card-label">用户总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><div class="stat-card-value">5</div><div class="stat-card-label">管理员</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-card-value">156</div><div class="stat-card-label">业主/租户用户</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/></svg></div><div class="stat-card-value">3</div><div class="stat-card-label">待激活</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" id="searchInput" class="search-input" placeholder="搜索用户名"><select id="filterRole" class="filter-select"><option value="">全部角色</option><option value="admin">管理员</option><option value="user">普通用户</option></select><button id="btnSearch" class="btn btn-ghost">搜索</button></div></div><button id="btnAdd" class="btn btn-primary">+ 新增用户</button></div>
      <div class="data-card"><table><thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>手机号</th><th>角色</th><th>关联人员</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table><div class="table-footer"><span class="table-footer-info">加载中...</span><div class="pagination"><button class="page-btn disabled">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div></div></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script><script src="../js/api.js"></script><script src="../js/page-common.js"></script><script>
initPage({
  name: '系统管理',
  api: {
    findPage: API.userFindPage,
    findById: API.userFindById,
    add: API.userAdd,
    edit: API.userEdit,
    delete: API.userDelete
  },
  renderRow: function(item, index) {
    var roleMap = {0: ['tag-admin', '管理员'], 1: ['tag-owner', '业主'], 2: ['tag-info', '租户']};
    var r = roleMap[item.role] || roleMap[0];
    var statusClass = item.status == 1 ? 'tag-ok' : 'tag-off';
    var statusText = item.status == 1 ? '正常' : '停用';
    var actionBtns = '<button class="btn-icon">编辑</button>';
    if (item.role != 0) actionBtns += '<button class="btn-icon btn-icon-danger">删除</button>';
    return '<td>' + item.id + '</td>' +
      '<td><strong>' + item.username + '</strong></td>' +
      '<td>' + (item.realName || '-') + '</td>' +
      '<td>' + (item.phone || '-') + '</td>' +
      '<td><span class="tag ' + r[0] + '">' + r[1] + '</span></td>' +
      '<td>' + (item.relatedName || '-') + '</td>' +
      '<td><span class="tag ' + statusClass + '">' + statusText + '</span></td>' +
      '<td class="action-btns">' + actionBtns + '</td>';
  },
  hashActions: { add: function(){ openAddModal(); }, role: function(){ showToast('角色管理'); }, log: function(){ showToast('操作日志'); } }
});
initSidebar('user:list');
</script>
<div class="modal-overlay" id="editModal"><div class="modal"><h3>编辑信息</h3><div class="form-group"><label>名称 *</label><input type="text" class="form-input" placeholder="请输入"></div><div class="form-group"><label>备注</label><textarea class="form-input" rows="3" placeholder="备注信息"></textarea></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('edit')">取消</button><button class="btn btn-primary">保存修改</button></div></div></div>
</body>
</html>
