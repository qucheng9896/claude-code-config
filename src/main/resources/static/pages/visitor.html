<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访客管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">访客管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg></div><div class="stat-card-value">28</div><div class="stat-card-label">今日访客</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div><div class="stat-card-value">15</div><div class="stat-card-label">已核验</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value">8</div><div class="stat-card-label">待核验</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div class="stat-card-value">52</div><div class="stat-card-label">本周预约</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" placeholder="搜索访客姓名、手机号"><select class="filter-select"><option value="">全部状态</option><option>待核验</option><option>已核验</option><option>已过期</option></select><button class="btn btn-ghost">搜索</button></div></div></div>
      <div class="data-card"><table><thead><tr><th>访客姓名</th><th>联系电话</th><th>被访业主</th><th>被访房屋</th><th>预约时间</th><th>通行方式</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table><div class="table-footer"><span class="table-footer-info">加载中...</span><div class="pagination"><button class="page-btn disabled">‹</button><button class="page-btn active">1</button><button class="page-btn">›</button></div></div></div>
    </div>
  </main>
</div>
<script src="../js/sidebar.js"></script><script src="../js/page-common.js"></script><script>
initPage({
  name: '访客管理',
  api: {
    findPage: API.visitorFindPage,
    findById: API.visitorFindById,
    add: API.visitorAdd,
    edit: API.visitorEdit,
    delete: API.visitorDelete
  },
  renderRow: function(item, index) {
    var statusMap = {0: ['tag-off', '已过期'], 1: ['tag-info', '待核验'], 2: ['tag-ok', '已核验']};
    var s = statusMap[item.status] || statusMap[1];
    var actionBtn = item.status == 1 ? '<button class="btn-icon">核验</button><button class="btn-icon">取消</button>' : '<button class="btn-icon">查看</button>';
    return '<td>' + item.visitorName + '</td>' +
      '<td>' + (item.phone || '-') + '</td>' +
      '<td>' + (item.ownerName || '-') + '</td>' +
      '<td>' + (item.houseName || '-') + '</td>' +
      '<td>' + (item.appointTime || '-') + '</td>' +
      '<td>' + (item.passType || '-') + '</td>' +
      '<td><span class="tag ' + s[0] + '">' + s[1] + '</span></td>' +
      '<td class="action-btns">' + actionBtn + '</td>';
  },
  hashActions: { reserve: function(){ openAddModal(); } }
});
initSidebar('visitor:list');
</script>
<div class="modal-overlay" id="editModal"><div class="modal"><h3>编辑信息</h3><div class="form-group"><label>名称 *</label><input type="text" class="form-input" placeholder="请输入"></div><div class="form-group"><label>备注</label><textarea class="form-input" rows="3" placeholder="备注信息"></textarea></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('edit')">取消</button><button class="btn btn-primary">保存修改</button></div></div></div>
</body>
</html>
