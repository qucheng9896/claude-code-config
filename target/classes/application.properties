# Server
server.port=8080
server.servlet.context-path=/

# Database
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/property_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# MyBatis
mybatis.type-aliases-package=com.wygl.pojo
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# PageHelper
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true

# JWT
jwt.secret=property_management_jwt_secret_key_2025
jwt.expiration=604800000

# AI
ai.enabled=false
ai.api.url=https://api.deepseek.com/v1/chat/completions
ai.api.key=your-api-key-here
ai.model=deepseek-chat
ai.timeout=30

# Logging
logging.level.com.wygl.dao=debug
logging.level.org.springframework=info
