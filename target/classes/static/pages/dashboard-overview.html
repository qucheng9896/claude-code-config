<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>综合统计 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">综合统计</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-card-value" id="v-ownerCount">-</div><div class="stat-card-label">业主总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div><div class="stat-card-value" id="v-houseCount">-</div><div class="stat-card-label">房屋总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="stat-card-value" id="v-paidAmount">-</div><div class="stat-card-label">已收缴金额</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg></div><div class="stat-card-value" id="v-payRate">-</div><div class="stat-card-label">缴费完成率</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;">
        <div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:24px;">
          <div style="font-size:15px;font-weight:600;margin-bottom:16px;">房屋入住情况</div>
          <div style="display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:14px;color:#64748b;">已入住</span><span style="font-size:20px;font-weight:700;color:#059669;" id="v-occupied">-</span></div>
            <div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:14px;color:#64748b;">空置</span><span style="font-size:20px;font-weight:700;color:#dc2626;" id="v-vacant">-</span></div>
          </div>
        </div>
        <div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:24px;">
          <div style="font-size:15px;font-weight:600;margin-bottom:16px;">快捷操作</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <a href="owner.html" style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #e2e8f0;border-radius:8px;text-decoration:none;"><span style="font-size:13px;font-weight:500;color:#334155;">新增业主</span></a>
            <a href="payment.html" style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #e2e8f0;border-radius:8px;text-decoration:none;"><span style="font-size:13px;font-weight:500;color:#334155;">生成账单</span></a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sidebar.js"></script>
<script>
initSidebar('dashboard:view');

function formatMoney(val) {
  if (!val) return '¥0';
  var n = parseFloat(val);
  if (n >= 1000) return '¥' + (n / 1000).toFixed(0) + 'K';
  return '¥' + n.toFixed(0);
}

API.dashboardOverview().then(function(res) {
  if (res.flag) {
    var d = res.data;
    document.getElementById('v-ownerCount').textContent = d.ownerCount || 0;
    document.getElementById('v-houseCount').textContent = d.houseCount || 0;
    document.getElementById('v-paidAmount').textContent = formatMoney(d.totalPaidAmount);
    document.getElementById('v-payRate').textContent = d.paymentRate || '0%';
    document.getElementById('v-occupied').textContent = d.occupiedCount || 0;
    document.getElementById('v-vacant').textContent = d.vacantCount || 0;
  }
}).catch(function() {});
</script>
</body>
</html>
