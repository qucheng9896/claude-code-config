<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据概览 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .dashboard-section { display: none; }
    .dashboard-section.active { display: block; animation: fadeUp 0.3s ease-out; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">数据概览</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="dashboard-section active" id="sec-overview">
        <div class="stats">
          <div class="stat-card"><div class="stat-card-value" id="v-ownerCount">-</div><div class="stat-card-label">业主总数</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-houseCount">-</div><div class="stat-card-label">房屋总数</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-paidAmount">-</div><div class="stat-card-label">已收缴金额</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-payRate">-</div><div class="stat-card-label">缴费完成率</div></div>
        </div>
      </div>
      <div class="dashboard-section" id="sec-payment">
        <div class="stats">
          <div class="stat-card"><div class="stat-card-value" id="v-pay-paid">-</div><div class="stat-card-label">累计已收缴</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-pay-rate">-</div><div class="stat-card-label">综合收缴率</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-pay-overdue">-</div><div class="stat-card-label">逾期未缴</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-pay-bills">-</div><div class="stat-card-label">账单总数</div></div>
        </div>
      </div>
      <div class="dashboard-section" id="sec-repair">
        <div class="stats">
          <div class="stat-card"><div class="stat-card-value" id="v-repair-total">-</div><div class="stat-card-label">工单总数</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-repair-done">-</div><div class="stat-card-label">已完成</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-repair-time">-</div><div class="stat-card-label">平均响应时间</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-repair-rate">-</div><div class="stat-card-label">满意度</div></div>
        </div>
      </div>
      <div class="dashboard-section" id="sec-ai">
        <div class="stats">
          <div class="stat-card"><div class="stat-card-value" id="v-ai-total">-</div><div class="stat-card-label">催缴总数</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-ai-sent">-</div><div class="stat-card-label">已发送</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-ai-rate">-</div><div class="stat-card-label">催缴成功率</div></div>
          <div class="stat-card"><div class="stat-card-value" id="v-ai-amount">-</div><div class="stat-card-label">催缴回收金额</div></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
script src="../js/sidebar.js"></script>
<script>
initSidebar(window.location.hash.replace('#', '') || 'dashboard:view');
function switchTab(key) {
  document.querySelectorAll('.dashboard-section').forEach(function(s) { s.classList.remove('active'); });
  var secEl = document.getElementById('sec-' + key);
  if (secEl) secEl.classList.add('active');
  loadTabData(key);
}
function formatMoney(val) { if (!val) return '¥0'; var n = parseFloat(val); return n >= 1000 ? '¥' + (n/1000).toFixed(0) + 'K' : '¥' + n.toFixed(0); }
function loadTabData(key) {
  if (key === 'overview') {
    axios.get('/dashboard/overview').then(function(res) { if (res.flag) { var d = res.data; document.getElementById('v-ownerCount').textContent = d.ownerCount || 0; document.getElementById('v-houseCount').textContent = d.houseCount || 0; document.getElementById('v-paidAmount').textContent = formatMoney(d.totalPaidAmount); document.getElementById('v-payRate').textContent = d.paymentRate || '0%'; } }).catch(function() {});
  } else if (key === 'payment') {
    axios.get('/dashboard/payment').then(function(res) { if (res.flag) { var d = res.data; document.getElementById('v-pay-paid').textContent = formatMoney(d.totalPaidAmount); document.getElementById('v-pay-rate').textContent = d.paymentRate || '0%'; document.getElementById('v-pay-overdue').textContent = formatMoney(d.totalOverdueAmount); document.getElementById('v-pay-bills').textContent = d.totalBills || 0; } }).catch(function() {});
  } else if (key === 'repair') {
    axios.get('/dashboard/repair').then(function(res) { if (res.flag) { var d = res.data; document.getElementById('v-repair-total').textContent = d.totalOrders || 0; document.getElementById('v-repair-done').textContent = d.completedOrders || 0; document.getElementById('v-repair-time').textContent = d.avgResponseTime || '-'; document.getElementById('v-repair-rate').textContent = d.satisfactionRate || '-'; } }).catch(function() {});
  } else if (key === 'ai') {
    axios.get('/dashboard/ai').then(function(res) { if (res.flag) { var d = res.data; document.getElementById('v-ai-total').textContent = d.totalReminds || 0; document.getElementById('v-ai-sent').textContent = d.sentReminds || 0; document.getElementById('v-ai-rate').textContent = d.successRate || '0%'; document.getElementById('v-ai-amount').textContent = formatMoney(d.recoveredAmount); } }).catch(function() {});
  }
}
loadTabData('overview');
</script>
</body>
</html>
