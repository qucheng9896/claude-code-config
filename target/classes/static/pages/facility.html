<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公共设施 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">公共设施</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats" id="facilityStats">
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">设施总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg></div><div class="stat-card-value" id="s-normal">-</div><div class="stat-card-label">正常</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div><div class="stat-card-value" id="s-repair">-</div><div class="stat-card-label">需维修</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg></div><div class="stat-card-value" id="s-checking">-</div><div class="stat-card-label">检修中</div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-group">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索设施名称、位置">
            <button class="btn btn-ghost" id="btnSearch">搜索</button>
          </div>
          <select class="form-input" id="filterType" style="width:auto;margin-left:8px;">
            <option value="">全部类型</option>
            <option value="电梯">电梯</option>
            <option value="配电房">配电房</option>
            <option value="水泵房">水泵房</option>
            <option value="消防设施">消防设施</option>
            <option value="绿化区域">绿化区域</option>
            <option value="道路/围墙">道路/围墙</option>
          </select>
          <select class="form-input" id="filterStatus" style="width:auto;margin-left:8px;">
            <option value="">全部状态</option>
            <option value="1">正常</option>
            <option value="2">需维修</option>
            <option value="3">检修中</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ 新增设施</button>
      </div>
      <div class="data-card">
        <table>
          <thead><tr><th>ID</th><th>设施名称</th><th>类型</th><th>位置</th><th>数量/面积</th><th>维护负责人</th><th>上次检修</th><th>下次检修</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="facilityTbody"></tbody>
        </table>
        <div class="table-footer">
          <span class="table-footer-info" id="tableInfo">加载中...</span>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h3 id="modalTitle">新增设施</h3>
    <input type="hidden" id="f-id">
    <div class="form-group"><label>设施名称 *</label><input type="text" class="form-input" id="f-name" placeholder="如：1栋电梯A"></div>
    <div class="form-group"><label>类型</label>
      <select class="form-input" id="f-type">
        <option value="电梯">电梯</option>
        <option value="配电房">配电房</option>
        <option value="水泵房">水泵房</option>
        <option value="消防设施">消防设施</option>
        <option value="绿化区域">绿化区域</option>
        <option value="道路/围墙">道路/围墙</option>
      </select>
    </div>
    <div class="form-group"><label>位置</label><input type="text" class="form-input" id="f-location" placeholder="如：1栋1单元"></div>
    <div class="form-group"><label>数量/面积</label><input type="text" class="form-input" id="f-quantity" placeholder="如：2台(1000kg)"></div>
    <div class="form-group"><label>维护负责人</label><input type="text" class="form-input" id="f-maintainer" placeholder="如：张师傅"></div>
    <div class="form-group"><label>上次检修</label><input type="date" class="form-input" id="f-last"></div>
    <div class="form-group"><label>下次检修</label><input type="date" class="form-input" id="f-next"></div>
    <div class="form-group"><label>状态</label>
      <select class="form-input" id="f-status"><option value="1">正常</option><option value="2">需维修</option><option value="3">检修中</option></select>
    </div>
    <div class="form-group"><label>备注</label><textarea class="form-input" id="f-remark" rows="2" placeholder="备注信息"></textarea></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;

function showToast(msg, type) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show toast-' + (type || 'success');
  clearTimeout(el._timer);
  el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000);
}

function fmtDate(d) {
  if (!d) return '-';
  var dt = new Date(d);
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}

function loadList(page) {
  currentPage = page || 1;
  var queryString = document.getElementById('searchInput').value.trim();
  var typeVal = document.getElementById('filterType').value;
  var statusVal = document.getElementById('filterStatus').value;
  var combinedQuery = typeVal ? (queryString ? queryString + ' ' + typeVal : typeVal) : queryString;
  axios.post('/facility/findPage', {
    currentPage: currentPage,
    pageSize: pageSize,
    queryString: combinedQuery,
    status: statusVal !== '' ? parseInt(statusVal) : null
  }).then(function(res) {
    renderTable(res.data.rows);
    totalPages = Math.ceil(res.data.total / pageSize) || 1;
    renderPagination(document.getElementById('tableInfo'), res.data.total);
    loadStats();
  }).catch(function() { showToast('加载失败', 'error'); });
}

function renderTable(list) {
  var tbody = document.getElementById('facilityTbody');
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>';
    return;
  }
  var html = '';
  list.forEach(function(f) {
    var statusTag = f.status == 1 ? '<span class="tag tag-ok">正常</span>' : (f.status == 2 ? '<span class="tag tag-confirm">需维修</span>' : '<span class="tag tag-off">检修中</span>');
    html += '<tr>';
    html += '<td>' + f.id + '</td>';
    html += '<td><strong>' + escapeHtml(f.name) + '</strong></td>';
    html += '<td>' + escapeHtml(f.type || '-') + '</td>';
    html += '<td>' + escapeHtml(f.location || '-') + '</td>';
    html += '<td>' + escapeHtml(f.quantity || '-') + '</td>';
    html += '<td>' + escapeHtml(f.maintainer || '-') + '</td>';
    html += '<td>' + fmtDate(f.lastCheck) + '</td>';
    html += '<td>' + fmtDate(f.nextCheck) + '</td>';
    html += '<td>' + statusTag + '</td>';
    html += '<td class="action-btns">';
    html += '<button class="btn-icon btn-edit" data-id="' + f.id + '">编辑</button>';
    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + f.id + '">删除</button>';
    html += '</td></tr>';
  });
  tbody.innerHTML = html;
  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });
  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });
}

function renderPagination(infoEl, total) {
  if (total === 0) { infoEl.textContent = '暂无数据'; document.getElementById('pagination').innerHTML = ''; return; }
  infoEl.textContent = '显示第 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条';
  var pag = document.getElementById('pagination');
  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">‹</button>';
  for (var p = 1; p <= totalPages; p++) html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">›</button>';
  pag.innerHTML = html;
  pag.querySelectorAll('.page-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); });
  });
}

function loadStats() {
  axios.get('/facility/stats').then(function(res) {
    if (res.flag) {
      var d = res.data;
      document.getElementById('s-total').textContent = d.total || 0;
      document.getElementById('s-normal').textContent = d.normal || 0;
      document.getElementById('s-repair').textContent = d.needRepair || 0;
      document.getElementById('s-checking').textContent = d.checking || 0;
    }
  });
}

function openAdd() {
  document.getElementById('modalTitle').textContent = '新增设施';
  document.getElementById('f-id').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-type').value = '电梯';
  document.getElementById('f-location').value = '';
  document.getElementById('f-quantity').value = '';
  document.getElementById('f-maintainer').value = '';
  document.getElementById('f-last').value = '';
  document.getElementById('f-next').value = '';
  document.getElementById('f-status').value = '1';
  document.getElementById('f-remark').value = '';
  document.getElementById('formModal').classList.add('show');
}

function openEdit(id) {
  axios.get('/facility/findById/' + id).then(function(res) {
    var f = res.data;
    document.getElementById('modalTitle').textContent = '编辑设施';
    document.getElementById('f-id').value = f.id;
    document.getElementById('f-name').value = f.name || '';
    document.getElementById('f-type').value = f.type || '电梯';
    document.getElementById('f-location').value = f.location || '';
    document.getElementById('f-quantity').value = f.quantity || '';
    document.getElementById('f-maintainer').value = f.maintainer || '';
    document.getElementById('f-last').value = f.lastCheck ? f.lastCheck.substr(0, 10) : '';
    document.getElementById('f-next').value = f.nextCheck ? f.nextCheck.substr(0, 10) : '';
    document.getElementById('f-status').value = f.status != null ? f.status : '1';
    document.getElementById('f-remark').value = f.remark || '';
    document.getElementById('formModal').classList.add('show');
  });
}

function doSave() {
  var id = document.getElementById('f-id').value;
  var data = {
    name: document.getElementById('f-name').value.trim(),
    type: document.getElementById('f-type').value,
    location: document.getElementById('f-location').value.trim(),
    quantity: document.getElementById('f-quantity').value.trim(),
    maintainer: document.getElementById('f-maintainer').value.trim(),
    lastCheck: document.getElementById('f-last').value || null,
    nextCheck: document.getElementById('f-next').value || null,
    status: parseInt(document.getElementById('f-status').value),
    remark: document.getElementById('f-remark').value.trim()
  };
  if (!data.name) { showToast('请填写设施名称', 'error'); return; }
  var promise = id ? axios.put('/facility/edit', Object.assign({id: parseInt(id)}, data)) : axios.post('/facility/add', data);
  promise.then(function() { showToast(id ? '修改成功' : '新增成功'); closeModal('form'); loadList(currentPage); }).catch(function() {});
}

function doDelete(id) {
  if (!confirm('确认删除该设施吗？此操作不可恢复。')) return;
  axios.delete('/facility/delete/' + id).then(function() { showToast('删除成功'); loadList(currentPage); }).catch(function() {});
}

function closeModal(name) { document.getElementById(name + 'Modal').classList.remove('show'); }
function escapeHtml(s) { return s ? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '-'; }

document.getElementById('btnAdd').addEventListener('click', openAdd);
document.getElementById('btnSave').addEventListener('click', doSave);
document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); });
document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); });
document.getElementById('filterType').addEventListener('change', function() { loadList(1); });
document.getElementById('filterStatus').addEventListener('change', function() { loadList(1); });
document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });

loadList(1);
initSidebar('facility:list');
</script>
</body>
</html>
