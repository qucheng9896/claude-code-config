<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社区服务 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">社区服务</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats" id="noticeStats">
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">公告总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28"/></svg></div><div class="stat-card-value" id="s-notice">-</div><div class="stat-card-label">通知公告</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72"/></svg></div><div class="stat-card-value" id="s-welfare">-</div><div class="stat-card-label">福利活动</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/></svg></div><div class="stat-card-value" id="s-vote">-</div><div class="stat-card-label">在线投票</div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-group">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索公告标题">
            <button class="btn btn-ghost" id="btnSearch">搜索</button>
          </div>
          <select class="form-input" id="filterType" style="width:auto;margin-left:8px;">
            <option value="">全部类型</option>
            <option value="通知">通知</option>
            <option value="公告">公告</option>
            <option value="福利">福利</option>
            <option value="投票">投票</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ 发布公告</button>
      </div>
      <div class="data-card">
        <table>
          <thead><tr><th>标题</th><th>类型</th><th>发布范围</th><th>已读/总数</th><th>发布日期</th><th>操作</th></tr></thead>
          <tbody id="noticeTbody"></tbody>
        </table>
        <div class="table-footer">
          <span class="table-footer-info" id="tableInfo">加载中...</span>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h3 id="modalTitle">发布公告</h3>
    <input type="hidden" id="f-id">
    <div class="form-group"><label>标题 *</label><input type="text" class="form-input" id="f-title" placeholder="请输入公告标题"></div>
    <div class="form-group"><label>类型</label>
      <select class="form-input" id="f-type"><option value="通知">通知</option><option value="公告">公告</option><option value="福利">福利</option><option value="投票">投票</option></select>
    </div>
    <div class="form-group"><label>发布范围</label><input type="text" class="form-input" id="f-scope" placeholder="如：全体业主"></div>
    <div class="form-group"><label>发布日期</label><input type="date" class="form-input" id="f-date"></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;

function showToast(msg, type) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show toast-' + (type || 'success');
  clearTimeout(el._timer);
  el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000);
}

function loadList(page) {
  currentPage = page || 1;
  var queryString = document.getElementById('searchInput').value.trim();
  var type = document.getElementById('filterType').value;
  if (type) queryString = queryString ? queryString + ' ' + type : type;
  axios.post('/notice/findPage', { currentPage: currentPage, pageSize: pageSize, queryString: queryString }).then(function(res) {
    renderTable(res.data.rows);
    totalPages = Math.ceil(res.data.total / pageSize) || 1;
    renderPagination(document.getElementById('tableInfo'), res.data.total);
    loadStats();
  }).catch(function() { showToast('加载失败', 'error'); });
}

function renderTable(list) {
  var tbody = document.getElementById('noticeTbody');
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>';
    return;
  }
  var html = '';
  list.forEach(function(n) {
    var typeTag = n.type == '福利' ? '<span class="tag tag-confirm">福利</span>' : (n.type == '投票' ? '<span class="tag tag-paid">投票</span>' : '<span class="tag tag-info">' + (n.type || '通知') + '</span>');
    html += '<tr>';
    html += '<td><strong>' + escapeHtml(n.title) + '</strong></td>';
    html += '<td>' + typeTag + '</td>';
    html += '<td>' + escapeHtml(n.scope || '-') + '</td>';
    html += '<td>' + (n.readCount || 0) + '/' + (n.totalCount || 0) + '</td>';
    html += '<td>' + (n.publishDate ? n.publishDate.substr(0, 10) : '-') + '</td>';
    html += '<td class="action-btns">';
    html += '<button class="btn-icon btn-edit" data-id="' + n.id + '">编辑</button>';
    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + n.id + '">删除</button>';
    html += '</td></tr>';
  });
  tbody.innerHTML = html;
  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });
  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });
}

function renderPagination(infoEl, total) {
  infoEl.textContent = '显示第 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条';
  var pag = document.getElementById('pagination');
  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">‹</button>';
  for (var p = 1; p <= totalPages; p++) html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">›</button>';
  pag.innerHTML = html;
  pag.querySelectorAll('.page-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); });
  });
}

function loadStats() {
  axios.post('/notice/findPage', { currentPage: 1, pageSize: 9999, queryString: '' }).then(function(res) {
    var list = res.data.rows;
    document.getElementById('s-total').textContent = list.length;
    document.getElementById('s-notice').textContent = list.filter(function(n) { return n.type == '通知' || n.type == '公告'; }).length;
    document.getElementById('s-welfare').textContent = list.filter(function(n) { return n.type == '福利'; }).length;
    document.getElementById('s-vote').textContent = list.filter(function(n) { return n.type == '投票'; }).length;
  });
}

function openAdd() {
  document.getElementById('modalTitle').textContent = '发布公告';
  document.getElementById('f-id').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-type').value = '通知';
  document.getElementById('f-scope').value = '全体业主';
  document.getElementById('f-date').value = new Date().toISOString().substr(0, 10);
  document.getElementById('formModal').classList.add('show');
}

function openEdit(id) {
  axios.get('/notice/findById/' + id).then(function(res) {
    var n = res.data;
    document.getElementById('modalTitle').textContent = '编辑公告';
    document.getElementById('f-id').value = n.id;
    document.getElementById('f-title').value = n.title || '';
    document.getElementById('f-type').value = n.type || '通知';
    document.getElementById('f-scope').value = n.scope || '';
    document.getElementById('f-date').value = n.publishDate ? n.publishDate.substr(0, 10) : '';
    document.getElementById('formModal').classList.add('show');
  });
}

function doSave() {
  var id = document.getElementById('f-id').value;
  var data = {
    title: document.getElementById('f-title').value.trim(),
    type: document.getElementById('f-type').value,
    scope: document.getElementById('f-scope').value.trim(),
    publishDate: document.getElementById('f-date').value || null
  };
  if (!data.title) { showToast('请填写标题', 'error'); return; }
  var promise = id ? axios.put('/notice/edit', Object.assign({id: parseInt(id)}, data)) : axios.post('/notice/add', data);
  promise.then(function() { showToast(id ? '修改成功' : '发布成功'); closeModal('form'); loadList(currentPage); }).catch(function() {});
}

function doDelete(id) {
  if (!confirm('确认删除该公告吗？此操作不可恢复。')) return;
  axios.delete('/notice/delete/' + id).then(function() { showToast('删除成功'); loadList(currentPage); }).catch(function() {});
}

function closeModal(name) { document.getElementById(name + 'Modal').classList.remove('show'); }
function escapeHtml(s) { return s ? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '-'; }

document.getElementById('btnAdd').addEventListener('click', openAdd);
document.getElementById('btnSave').addEventListener('click', doSave);
document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); });
document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); });
document.getElementById('filterType').addEventListener('change', function() { loadList(1); });
document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });

loadList(1);
initSidebar('notice:list');
</script>
</body>
</html>
