<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业主管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title">业主管理</div>
      <div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div>
    </div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">业主总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="stat-card-value" id="s-active">-</div><div class="stat-card-label">正常状态</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-rose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg></div><div class="stat-card-value" id="s-disabled">-</div><div class="stat-card-label">停用状态</div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-group">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索业主姓名或手机号">
            <button class="btn btn-ghost" onclick="loadList(1)">搜索</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="openAdd()">+ 新增业主</button>
      </div>
      <div class="data-card">
        <table>
          <thead><tr><th>ID</th><th>姓名</th><th>手机号</th><th>身份证号</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody id="ownerTbody"></tbody>
        </table>
        <div class="table-footer">
          <span class="table-footer-info" id="tableInfo">加载中...</span>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h3 id="modalTitle">新增业主</h3>
    <input type="hidden" id="f-id">
    <div class="form-group"><label>业主姓名 *</label><input type="text" class="form-input" id="f-name" placeholder="请输入姓名"></div>
    <div class="form-group"><label>手机号 *</label><input type="text" class="form-input" id="f-phone" placeholder="请输入手机号"></div>
    <div class="form-group"><label>身份证号</label><input type="text" class="form-input" id="f-idcard" placeholder="请输入身份证号"></div>
    <div class="form-group"><label>状态</label><select class="form-input" id="f-status"><option value="1">正常</option><option value="0">停用</option></select></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="doSave()">保存</button>
    </div>
  </div>
</div>

<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
initSidebar('owner:list');

var currentPage = 1, pageSize = 10, totalPages = 1;

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' toast-error' : '');
  setTimeout(function() { t.className = 'toast'; }, 2500);
}

function loadList(page) {
  currentPage = page || 1;
  var queryString = document.getElementById('searchInput').value.trim();
  axios.post('/owner/findPage', { currentPage: currentPage, pageSize: pageSize, queryString: queryString }).then(function(res) {
    renderTable(res.data.rows);
    totalPages = Math.ceil(res.data.total / pageSize) || 1;
    renderPagination(document.getElementById('tableInfo'), res.data.total);
    loadStats();
  }).catch(function() { showToast('加载失败', 'error'); });
}

function renderTable(list) {
  var tbody = document.getElementById('ownerTbody');
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;padding:40px">暂无数据</td></tr>';
    return;
  }
  var html = '';
  list.forEach(function(o) {
    var phone = o.phone ? o.phone.substring(0,3) + '****' + o.phone.substring(7) : '-';
    var idCard = o.idCard ? o.idCard.substring(0,4) + '********' + o.idCard.substring(12) : '-';
    var statusTag = o.status == 1 ? '<span class="tag tag-ok">正常</span>' : '<span class="tag tag-off">停用</span>';
    var time = o.createTime ? new Date(o.createTime).toLocaleDateString() : '-';
    html += '<tr>';
    html += '<td>' + o.id + '</td>';
    html += '<td><strong>' + escapeHtml(o.name) + '</strong></td>';
    html += '<td>' + phone + '</td>';
    html += '<td>' + idCard + '</td>';
    html += '<td>' + statusTag + '</td>';
    html += '<td>' + time + '</td>';
    html += '<td class="action-btns">';
    html += '<button class="btn-icon btn-edit" data-id="' + o.id + '">编辑</button>';
    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + o.id + '">删除</button>';
    html += '</td></tr>';
  });
  tbody.innerHTML = html;
  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });
  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });
}

function renderPagination(infoEl, total) {
  if (total === 0) { infoEl.textContent = '暂无数据'; document.getElementById('pagination').innerHTML = ''; return; }
  infoEl.textContent = '显示第 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条';
  var pag = document.getElementById('pagination');
  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">‹</button>';
  for (var p = 1; p <= totalPages; p++) html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">›</button>';
  pag.innerHTML = html;
  pag.querySelectorAll('.page-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); });
  });
}

function loadStats() {
  axios.post('/owner/findPage', { currentPage: 1, pageSize: 9999, queryString: '' }).then(function(res) {
    var list = res.data.rows;
    document.getElementById('s-total').textContent = list.length;
    document.getElementById('s-active').textContent = list.filter(function(o) { return o.status == 1; }).length;
    document.getElementById('s-disabled').textContent = list.filter(function(o) { return o.status == 0; }).length;
  });
}

function openAdd() {
  document.getElementById('modalTitle').textContent = '新增业主';
  document.getElementById('f-id').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-phone').value = '';
  document.getElementById('f-idcard').value = '';
  document.getElementById('f-status').value = '1';
  document.getElementById('formModal').classList.add('show');
}

function openEdit(id) {
  axios.get('/owner/findById/' + id).then(function(res) {
    var o = res.data;
    document.getElementById('modalTitle').textContent = '编辑业主';
    document.getElementById('f-id').value = o.id;
    document.getElementById('f-name').value = o.name || '';
    document.getElementById('f-phone').value = o.phone || '';
    document.getElementById('f-idcard').value = o.idCard || '';
    document.getElementById('f-status').value = o.status != null ? o.status : 1;
    document.getElementById('formModal').classList.add('show');
  }).catch(function() { showToast('加载失败', 'error'); });
}

function doSave() {
  var id = document.getElementById('f-id').value;
  var name = document.getElementById('f-name').value.trim();
  var phone = document.getElementById('f-phone').value.trim();
  if (!name) { showToast('请输入姓名', 'error'); return; }
  if (!phone) { showToast('请输入手机号', 'error'); return; }
  var data = {
    name: name,
    phone: phone,
    idCard: document.getElementById('f-idcard').value.trim(),
    status: parseInt(document.getElementById('f-status').value)
  };
  var req = id ? axios.put('/owner/edit', Object.assign(data, { id: parseInt(id) })) : axios.post('/owner/add', data);
  req.then(function(res) {
    if (res.flag) { showToast(res.message); closeModal(); loadList(currentPage); }
    else { showToast(res.message || '操作失败', 'error'); }
  }).catch(function(err) { showToast(err.response && err.response.data && err.response.data.message || '操作失败', 'error'); });
}

function doDelete(id) {
  if (!confirm('确定删除该业主？')) return;
  axios.delete('/owner/delete/' + id).then(function(res) {
    if (res.flag) { showToast(res.message); loadList(1); }
    else { showToast(res.message || '删除失败', 'error'); }
  }).catch(function(err) { showToast(err.response && err.response.data && err.response.data.message || '删除失败', 'error'); });
}

function closeModal() { document.getElementById('formModal').classList.remove('show'); }
document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

document.getElementById('searchInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') loadList(1); });

loadList(1);
</script>
</body>
</html>
