<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缴费管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">缴费管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats" id="payStats">
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="stat-card-value" id="s-paid">-</div><div class="stat-card-label">已收缴金额</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg></div><div class="stat-card-value" id="s-rate">-</div><div class="stat-card-label">缴费完成率</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value" id="s-unpaid">-</div><div class="stat-card-label">未缴/逾期</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">账单总数</div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-group">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索账单编号、租户">
            <button class="btn btn-ghost" id="btnSearch">搜索</button>
          </div>
          <select class="form-input" id="filterType" style="width:auto;margin-left:8px;">
            <option value="">全部类型</option>
            <option value="物业费">物业费</option>
            <option value="水电费">水电费</option>
            <option value="停车费">停车费</option>
          </select>
          <select class="form-input" id="filterStatus" style="width:auto;margin-left:8px;">
            <option value="">全部状态</option>
            <option value="0">未缴</option>
            <option value="1">已缴</option>
            <option value="2">已确认</option>
            <option value="3">逾期</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ 新增账单</button>
      </div>
      <div class="data-card">
        <table>
          <thead><tr><th>账单编号</th><th>租户</th><th>房屋</th><th>类型</th><th>金额</th><th>周期</th><th>到期日</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="payTbody"></tbody>
        </table>
        <div class="table-footer">
          <span class="table-footer-info" id="tableInfo">加载中...</span>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h3 id="modalTitle">新增账单</h3>
    <input type="hidden" id="f-id">
    <div class="form-group"><label>账单编号 *</label><input type="text" class="form-input" id="f-no" placeholder="如：BILL202501001"></div>
    <div class="form-group"><label>租户</label>
      <select class="form-input" id="f-tenant"><option value="">请选择租户</option></select>
    </div>
    <div class="form-group"><label>房屋</label>
      <select class="form-input" id="f-house"><option value="">请选择房屋</option></select>
    </div>
    <div class="form-group"><label>费用类型</label>
      <select class="form-input" id="f-type"><option value="物业费">物业费</option><option value="水电费">水电费</option><option value="停车费">停车费</option></select>
    </div>
    <div class="form-group"><label>金额 *</label><input type="number" step="0.01" class="form-input" id="f-amount" placeholder="如：268.50"></div>
    <div class="form-group"><label>费用周期</label><input type="text" class="form-input" id="f-period" placeholder="如：2025-01"></div>
    <div class="form-group"><label>到期日</label><input type="date" class="form-input" id="f-due"></div>
    <div class="form-group"><label>状态</label>
      <select class="form-input" id="f-status"><option value="0">未缴</option><option value="1">已缴</option><option value="2">已确认</option><option value="3">逾期</option></select>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;

function showToast(msg, type) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show toast-' + (type || 'success');
  clearTimeout(el._timer);
  el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000);
}

function loadTenants() {
  return axios.post('/tenant/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {
    var opts = '<option value="">请选择租户</option>';
    res.data.rows.forEach(function(t) { opts += '<option value="' + t.id + '">' + escapeHtml(t.name) + '</option>'; });
    document.getElementById('f-tenant').innerHTML = opts;
  });
}

function loadHouses() {
  return axios.post('/house/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {
    var opts = '<option value="">请选择房屋</option>';
    res.data.rows.forEach(function(h) { opts += '<option value="' + h.id + '">' + escapeHtml((h.buildingName || '') + '-' + h.roomNo) + '</option>'; });
    document.getElementById('f-house').innerHTML = opts;
  });
}

function loadList(page) {
  currentPage = page || 1;
  var queryString = document.getElementById('searchInput').value.trim();
  var type = document.getElementById('filterType').value;
  var status = document.getElementById('filterStatus').value;
  if (type) queryString = queryString ? queryString + ' ' + type : type;
  if (status) queryString = queryString ? queryString + ' ' + status : status;
  axios.post('/payment/findPage', { currentPage: currentPage, pageSize: pageSize, queryString: queryString }).then(function(res) {
    renderTable(res.data.rows);
    totalPages = Math.ceil(res.data.total / pageSize) || 1;
    renderPagination(document.getElementById('tableInfo'), res.data.total);
    loadStats();
  }).catch(function() { showToast('加载失败', 'error'); });
}

function renderTable(list) {
  var tbody = document.getElementById('payTbody');
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>';
    return;
  }
  var html = '';
  list.forEach(function(p) {
    var statusTag = p.payStatus == 2 ? '<span class="tag tag-confirm">已确认</span>' : (p.payStatus == 1 ? '<span class="tag tag-paid">已缴</span>' : (p.payStatus == 3 ? '<span class="tag tag-overdue">逾期</span>' : '<span class="tag tag-info">未缴</span>'));
    html += '<tr>';
    html += '<td>' + escapeHtml(p.billNo) + '</td>';
    html += '<td>' + escapeHtml(p.tenantName || '-') + '</td>';
    html += '<td>' + escapeHtml(p.houseAddress || '-') + '</td>';
    html += '<td>' + escapeHtml(p.feeType || '-') + '</td>';
    html += '<td>¥' + (p.amount || 0) + '</td>';
    html += '<td>' + escapeHtml(p.period || '-') + '</td>';
    html += '<td>' + (p.dueDate ? p.dueDate.substr(0, 10) : '-') + '</td>';
    html += '<td>' + statusTag + '</td>';
    html += '<td class="action-btns">';
    html += '<button class="btn-icon btn-edit" data-id="' + p.id + '">编辑</button>';
    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + p.id + '">删除</button>';
    html += '</td></tr>';
  });
  tbody.innerHTML = html;
  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });
  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });
}

function renderPagination(infoEl, total) {
  infoEl.textContent = '显示第 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条';
  var pag = document.getElementById('pagination');
  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">‹</button>';
  for (var p = 1; p <= totalPages; p++) html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">›</button>';
  pag.innerHTML = html;
  pag.querySelectorAll('.page-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); });
  });
}

function loadStats() {
  axios.post('/payment/findPage', { currentPage: 1, pageSize: 9999, queryString: '' }).then(function(res) {
    var list = res.data.rows;
    var paid = list.filter(function(p) { return p.payStatus == 1 || p.payStatus == 2; });
    var paidAmount = paid.reduce(function(sum, p) { return sum + parseFloat(p.amount || 0); }, 0);
    var unpaid = list.filter(function(p) { return p.payStatus == 0 || p.payStatus == 3; }).length;
    document.getElementById('s-paid').textContent = '¥' + paidAmount.toFixed(0);
    document.getElementById('s-rate').textContent = list.length ? (paid.length * 100 / list.length).toFixed(1) + '%' : '0%';
    document.getElementById('s-unpaid').textContent = unpaid;
    document.getElementById('s-total').textContent = list.length;
  });
}

function openAdd() {
  document.getElementById('modalTitle').textContent = '新增账单';
  document.getElementById('f-id').value = '';
  document.getElementById('f-no').value = 'BILL' + new Date().getFullYear() + String(Math.floor(Math.random() * 999999)).padStart(6, '0');
  document.getElementById('f-tenant').value = '';
  document.getElementById('f-house').value = '';
  document.getElementById('f-type').value = '物业费';
  document.getElementById('f-amount').value = '';
  document.getElementById('f-period').value = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0');
  document.getElementById('f-due').value = '';
  document.getElementById('f-status').value = '0';
  document.getElementById('formModal').classList.add('show');
}

function openEdit(id) {
  axios.get('/payment/findById/' + id).then(function(res) {
    var p = res.data;
    document.getElementById('modalTitle').textContent = '编辑账单';
    document.getElementById('f-id').value = p.id;
    document.getElementById('f-no').value = p.billNo || '';
    document.getElementById('f-tenant').value = p.tenantId || '';
    document.getElementById('f-house').value = p.houseId || '';
    document.getElementById('f-type').value = p.feeType || '物业费';
    document.getElementById('f-amount').value = p.amount || '';
    document.getElementById('f-period').value = p.period || '';
    document.getElementById('f-due').value = p.dueDate ? p.dueDate.substr(0, 10) : '';
    document.getElementById('f-status').value = p.payStatus != null ? p.payStatus : '0';
    document.getElementById('formModal').classList.add('show');
  });
}

function doSave() {
  var id = document.getElementById('f-id').value;
  var data = {
    billNo: document.getElementById('f-no').value.trim(),
    tenantId: parseInt(document.getElementById('f-tenant').value) || null,
    houseId: parseInt(document.getElementById('f-house').value) || null,
    feeType: document.getElementById('f-type').value,
    amount: parseFloat(document.getElementById('f-amount').value) || 0,
    period: document.getElementById('f-period').value.trim(),
    dueDate: document.getElementById('f-due').value || null,
    payStatus: parseInt(document.getElementById('f-status').value)
  };
  if (!data.billNo) { showToast('请填写账单编号', 'error'); return; }
  var promise = id ? axios.put('/payment/edit', Object.assign({id: parseInt(id)}, data)) : axios.post('/payment/add', data);
  promise.then(function() { showToast(id ? '修改成功' : '新增成功'); closeModal('form'); loadList(currentPage); }).catch(function() {});
}

function doDelete(id) {
  if (!confirm('确认删除该账单吗？此操作不可恢复。')) return;
  axios.delete('/payment/delete/' + id).then(function() { showToast('删除成功'); loadList(currentPage); }).catch(function() {});
}

function closeModal(name) { document.getElementById(name + 'Modal').classList.remove('show'); }
function escapeHtml(s) { return s ? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '-'; }

document.getElementById('btnAdd').addEventListener('click', openAdd);
document.getElementById('btnSave').addEventListener('click', doSave);
document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); });
document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); });
document.getElementById('filterType').addEventListener('change', function() { loadList(1); });
document.getElementById('filterStatus').addEventListener('change', function() { loadList(1); });
document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });

Promise.all([loadTenants(), loadHouses()]).then(function() { loadList(1); }).catch(function() {});
initSidebar('payment:property');
</script>
</body>
</html>
