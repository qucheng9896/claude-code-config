<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>租赁管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">租赁管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">合同总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"></div><div class="stat-card-value" id="s-active">-</div><div class="stat-card-label">生效中</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"></div><div class="stat-card-value" id="s-expired">-</div><div class="stat-card-label">已到期</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"></div><div class="stat-card-value" id="s-terminated">-</div><div class="stat-card-label">提前终止</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" id="searchInput" placeholder="搜索合同号、业主、租户"><select class="filter-select" id="filterStatus"><option value="">全部状态</option><option value="1">生效中</option><option value="0">已到期</option><option value="2">提前终止</option></select><button class="btn btn-ghost" id="btnSearch">搜索</button></div></div><button class="btn btn-primary" id="btnAdd">+ 新建合同</button></div>
      <div class="data-card"><table><thead><tr><th>合同编号</th><th>业主</th><th>租户</th><th>房屋</th><th>租期</th><th>月租金</th><th>押金</th><th>状态</th><th>操作</th></tr></thead><tbody id="rentalTbody"></tbody></table>
        <div class="table-footer"><span class="table-footer-info" id="tableInfo">加载中...</span><div class="pagination" id="pagination"></div></div>
      </div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="formModal"><div class="modal"><h3 id="modalTitle">新建合同</h3><input type="hidden" id="f-id">
  <div class="form-group"><label>合同编号 *</label><input type="text" class="form-input" id="f-rentalNo" placeholder="如：HT25010001"></div>
  <div class="form-group"><label>业主ID *</label><input type="number" class="form-input" id="f-ownerId" placeholder="请输入业主ID"></div>
  <div class="form-group"><label>租户ID *</label><input type="number" class="form-input" id="f-tenantId" placeholder="请输入租户ID"></div>
  <div class="form-group"><label>房屋ID *</label><input type="number" class="form-input" id="f-houseId" placeholder="请输入房屋ID"></div>
  <div class="form-group"><label>起始日期 *</label><input type="date" class="form-input" id="f-startDate"></div>
  <div class="form-group"><label>结束日期 *</label><input type="date" class="form-input" id="f-endDate"></div>
  <div class="form-group"><label>月租金 *</label><input type="number" class="form-input" id="f-monthlyRent" step="0.01" placeholder="如：2800"></div>
  <div class="form-group"><label>押金</label><input type="number" class="form-input" id="f-deposit" step="0.01" placeholder="如：5600"></div>
  <div class="form-group"><label>状态</label><select class="form-input" id="f-status"><option value="1">生效中</option><option value="0">已到期</option><option value="2">提前终止</option></select></div>
  <div class="form-group"><label>备注</label><input type="text" class="form-input" id="f-remark" placeholder="备注信息"></div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;
function showToast(msg) { var el = document.getElementById("toast"); if (!el) return; el.textContent = msg; el.className = "toast show"; setTimeout(function() { el.className = "toast"; }, 3000); }
function fmtDate(d) { return d ? (typeof d === 'string' ? d.substring(0,10) : d) : '-'; }
function fmtMoney(m) { return m != null ? '¥' + parseFloat(m).toLocaleString('zh-CN', {minimumFractionDigits: 0, maximumFractionDigits: 2}) : '-'; }
function loadList(page) {
  currentPage = page || 1;
  var q = document.getElementById("searchInput").value.trim();
  var status = document.getElementById("filterStatus").value;
  var params = { currentPage: currentPage, pageSize: pageSize, queryString: q };
  if (status) params.status = parseInt(status);
  axios.post("/rental/findPage", params).then(function(res) {
    renderTable(res.data.rows);
    totalPages = Math.ceil(res.data.total / pageSize) || 1;
    document.getElementById("tableInfo").textContent = "显示第" + ((currentPage-1)*pageSize+1) + "-" + Math.min(currentPage*pageSize, res.data.total) + " 条，共 " + res.data.total + " 条";
    renderPagination();
    loadStats();
  });
}
function renderTable(list) {
  var tb = document.getElementById("rentalTbody");
  if (!list || !list.length) { tb.innerHTML = "<tr><td colspan=\"9\" style=\"text-align:center;color:#94a3b8;padding:40px\">暂无数据</td></tr>"; return; }
  var h = "";
  list.forEach(function(r) {
    var statusMap = { "1": "<span class='tag tag-ok'>生效中</span>", "0": "<span class='tag tag-overdue'>已到期</span>", "2": "<span class='tag tag-off'>提前终止</span>" };
    h += "<tr><td>" + (r.rentalNo || "-") + "</td><td>" + (r.ownerName || "-") + "</td><td>" + (r.tenantName || "-") + "</td><td>" + (r.houseAddress || "-") + "</td><td>" + fmtDate(r.startDate) + " ~ " + fmtDate(r.endDate) + "</td><td>" + fmtMoney(r.monthlyRent) + "</td><td>" + fmtMoney(r.deposit) + "</td><td>" + (statusMap[r.status] || "-") + "</td><td class='action-btns'><button class='btn-icon btn-edit' data-id='" + r.id + "'>编辑</button><button class='btn-icon btn-icon-danger btn-del' data-id='" + r.id + "'>删除</button></td></tr>";
  });
  tb.innerHTML = h;
  tb.querySelectorAll(".btn-edit").forEach(function(b) { b.addEventListener("click", function() { openEdit(this.dataset.id); }); });
  tb.querySelectorAll(".btn-del").forEach(function(b) { b.addEventListener("click", function() { doDelete(this.dataset.id); }); });
}
function renderPagination() {
  var p = document.getElementById("pagination");
  var h = "<button class='page-btn" + (currentPage<=1?" disabled":"") + "' data-page='" + (currentPage-1) + "'>‹</button>";
  for (var i=1;i<=totalPages;i++) h += "<button class='page-btn"+(i===currentPage?" active":"")+"' data-page='"+i+"'>"+i+"</button>";
  h += "<button class='page-btn"+(currentPage>=totalPages?" disabled":"")+"' data-page='"+(currentPage+1)+"'>›</button>";
  p.innerHTML = h;
  p.querySelectorAll(".page-btn").forEach(function(b) { b.addEventListener("click", function() { var pg=parseInt(this.dataset.page); if(pg>=1&&pg<=totalPages) loadList(pg); }); });
}
function loadStats() {
  axios.post("/rental/findPage", { currentPage: 1, pageSize: 1 }).then(function(res) { document.getElementById("s-total").textContent = res.data.total || 0; });
  axios.post("/rental/findPage", { currentPage: 1, pageSize: 1, status: 1 }).then(function(res) { document.getElementById("s-active").textContent = res.data.total || 0; });
  axios.post("/rental/findPage", { currentPage: 1, pageSize: 1, status: 0 }).then(function(res) { document.getElementById("s-expired").textContent = res.data.total || 0; });
  axios.post("/rental/findPage", { currentPage: 1, pageSize: 1, status: 2 }).then(function(res) { document.getElementById("s-terminated").textContent = res.data.total || 0; });
}
function openAdd() {
  document.getElementById("modalTitle").textContent = "新建合同";
  document.getElementById("f-id").value = "";
  ["f-rentalNo","f-ownerId","f-tenantId","f-houseId","f-startDate","f-endDate","f-monthlyRent","f-deposit","f-remark"].forEach(function(id){document.getElementById(id).value="";});
  document.getElementById("f-status").value = "1";
  document.getElementById("formModal").classList.add("show");
}
function openEdit(id) {
  axios.get("/rental/findById/" + id).then(function(res) {
    var r = res.data;
    document.getElementById("modalTitle").textContent = "编辑合同";
    document.getElementById("f-id").value = r.id;
    document.getElementById("f-rentalNo").value = r.rentalNo || "";
    document.getElementById("f-ownerId").value = r.ownerId || "";
    document.getElementById("f-tenantId").value = r.tenantId || "";
    document.getElementById("f-houseId").value = r.houseId || "";
    document.getElementById("f-startDate").value = fmtDate(r.startDate);
    document.getElementById("f-endDate").value = fmtDate(r.endDate);
    document.getElementById("f-monthlyRent").value = r.monthlyRent || "";
    document.getElementById("f-deposit").value = r.deposit || "";
    document.getElementById("f-status").value = r.status != null ? r.status : "1";
    document.getElementById("f-remark").value = r.remark || "";
    document.getElementById("formModal").classList.add("show");
  });
}
function doSave() {
  var id = document.getElementById("f-id").value;
  var data = {
    rentalNo: document.getElementById("f-rentalNo").value.trim(),
    ownerId: parseInt(document.getElementById("f-ownerId").value) || null,
    tenantId: parseInt(document.getElementById("f-tenantId").value) || null,
    houseId: parseInt(document.getElementById("f-houseId").value) || null,
    startDate: document.getElementById("f-startDate").value || null,
    endDate: document.getElementById("f-endDate").value || null,
    monthlyRent: parseFloat(document.getElementById("f-monthlyRent").value) || 0,
    deposit: parseFloat(document.getElementById("f-deposit").value) || 0,
    status: parseInt(document.getElementById("f-status").value),
    remark: document.getElementById("f-remark").value.trim()
  };
  if (!data.rentalNo) { showToast("请填写合同编号"); return; }
  var p = id ? axios.put("/rental/edit", Object.assign({ id: parseInt(id) }, data)) : axios.post("/rental/add", data);
  p.then(function() { showToast(id ? "修改成功" : "新增成功"); closeModal("form"); loadList(currentPage); });
}
function doDelete(id) { if (!confirm("确认删除该合同吗？此操作不可恢复。")) return; axios.delete("/rental/delete/" + id).then(function() { showToast("删除成功"); loadList(currentPage); }); }
function closeModal(n) { document.getElementById(n + "Modal").classList.remove("show"); }
document.getElementById("btnAdd").addEventListener("click", openAdd);
document.getElementById("btnSave").addEventListener("click", doSave);
document.getElementById("btnSearch").addEventListener("click", function() { loadList(1); });
document.getElementById("searchInput").addEventListener("keydown", function(e) { if (e.key === "Enter") loadList(1); });
document.getElementById("filterStatus").addEventListener("change", function() { loadList(1); });
document.getElementById("formModal").addEventListener("click", function(e) { if (e.target === this) this.classList.remove("show"); });
loadList(1); initSidebar("rental:list");
</script>
</body>
</html>
