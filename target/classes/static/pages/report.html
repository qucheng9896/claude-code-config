<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报表统计 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">报表统计</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"></div><div class="stat-card-value" id="s-paidAmount">-</div><div class="stat-card-label">累计已收缴</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"></div><div class="stat-card-value" id="s-paymentRate">-</div><div class="stat-card-label">综合收缴率</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"></div><div class="stat-card-value" id="s-overdueAmount">-</div><div class="stat-card-label">逾期未缴</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"></div><div class="stat-card-value" id="s-activeRentals">-</div><div class="stat-card-label">在租合同</div></div>
      </div>

      <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px;">
        <div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:24px;">
          <div style="font-size:15px;font-weight:600;margin-bottom:16px;">关键指标概览</div>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;">
            <div style="padding:16px;background:#f8fafc;border-radius:8px;"><div style="font-size:12px;color:#64748b;">业主总数</div><div style="font-size:20px;font-weight:700;margin-top:4px;" id="s-ownerCount">-</div></div>
            <div style="padding:16px;background:#f8fafc;border-radius:8px;"><div style="font-size:12px;color:#64748b;">房屋总数</div><div style="font-size:20px;font-weight:700;margin-top:4px;" id="s-houseCount">-</div></div>
            <div style="padding:16px;background:#f8fafc;border-radius:8px;"><div style="font-size:12px;color:#64748b;">已入住</div><div style="font-size:20px;font-weight:700;margin-top:4px;" id="s-occupiedCount">-</div></div>
            <div style="padding:16px;background:#f8fafc;border-radius:8px;"><div style="font-size:12px;color:#64748b;">空置房屋</div><div style="font-size:20px;font-weight:700;margin-top:4px;" id="s-vacantCount">-</div></div>
          </div>
        </div>
        <div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:24px;">
          <div style="font-size:15px;font-weight:600;margin-bottom:16px;">月度汇总</div>
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="padding-bottom:14px;border-bottom:1px solid #f1f5f9;"><div style="font-size:13px;color:#64748b;margin-bottom:4px;">账单总数</div><div style="font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;" id="s-totalBills">-</div></div>
            <div style="padding-bottom:14px;border-bottom:1px solid #f1f5f9;"><div style="font-size:13px;color:#64748b;margin-bottom:4px;">已确认收入</div><div style="font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#059669;" id="s-confirmedAmount">-</div></div>
            <div style="padding-bottom:14px;border-bottom:1px solid #f1f5f9;"><div style="font-size:13px;color:#64748b;margin-bottom:4px;">逾期账单金额</div><div style="font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#dc2626;" id="s-overdueBills">-</div></div>
            <div><div style="font-size:13px;color:#64748b;margin-bottom:4px;">催缴已发送</div><div style="font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#7c3aed;" id="s-aiReminds">-</div></div>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:20px;">
        <div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:24px;">
          <div style="font-size:15px;font-weight:600;margin-bottom:12px;">报修统计</div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:#64748b;">工单总数</span><span style="font-weight:700;" id="s-totalOrders">-</span></div>
            <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:#64748b;">已完成</span><span style="font-weight:700;color:#059669;" id="s-completedOrders">-</span></div>
            <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:#64748b;">平均响应</span><span style="font-weight:700;" id="s-avgResponse">-</span></div>
            <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;color:#64748b;">满意度</span><span style="font-weight:700;color:#7c3aed;" id="s-satisfaction">-</span></div>
          </div>
        </div>
        <div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:24px;">
          <div style="font-size:15px;font-weight:600;margin-bottom:12px;">费用类型分布</div>
          <div style="display:flex;align-items:center;justify-content:center;height:140px;">
            <div style="width:120px;height:120px;border-radius:50%;background:conic-gradient(#059669 0% 45%, #2563eb 45% 70%, #d97706 70% 85%, #7c3aed 85% 100%);"></div>
          </div>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px;"><span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#64748b;"><span style="width:8px;height:8px;border-radius:50%;background:#059669;"></span>物业费</span><span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#64748b;"><span style="width:8px;height:8px;border-radius:50%;background:#2563eb;"></span>租金</span><span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#64748b;"><span style="width:8px;height:8px;border-radius:50%;background:#d97706;"></span>水电</span><span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#64748b;"><span style="width:8px;height:8px;border-radius:50%;background:#7c3aed;"></span>停车</span></div>
        </div>
        <div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:24px;">
          <div style="font-size:15px;font-weight:600;margin-bottom:12px;">AI 催缴效果</div>
          <div style="display:flex;flex-direction:column;gap:12px;padding-top:8px;">
            <div><div style="display:flex;justify-content:space-between;font-size:13px;color:#334155;margin-bottom:6px;"><span>催缴消息总数</span><span style="font-family:'JetBrains Mono',monospace;font-weight:600;" id="s-totalReminds">-</span></div><div style="height:8px;background:#f1f5f9;border-radius:4px;"><div style="width:0%;height:100%;background:#7c3aed;border-radius:4px;" id="s-remindBar"></div></div></div>
            <div style="display:flex;justify-content:space-between;font-size:13px;color:#334155;"><span>成功率</span><span style="font-family:'JetBrains Mono',monospace;font-weight:600;" id="s-successRate">-</span></div>
            <div style="display:flex;justify-content:space-between;font-size:13px;color:#334155;"><span>追回金额</span><span style="font-family:'JetBrains Mono',monospace;font-weight:600;" id="s-recoveredAmount">-</span></div>
          </div>
          <div style="margin-top:12px;padding:10px;background:#fef3c7;border-radius:6px;font-size:12px;color:#92400e;">AI 催缴功能需开启后生效 (ai.enabled=true)</div>
        </div>
      </div>

      <div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><div style="font-size:15px;font-weight:600;">月度收缴明细表</div><button class="btn btn-ghost" onclick="exportCSV()">导出 Excel</button></div>
        <table><thead><tr><th>周期</th><th>账单数</th><th>已缴</th><th>逾期</th><th>已确认金额</th><th>收缴率</th></tr></thead><tbody id="reportTbody"><tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px">加载中...</td></tr></tbody></table>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
function showToast(msg) { var el = document.getElementById("toast"); if (!el) return; el.textContent = msg; el.className = "toast show"; setTimeout(function() { el.className = "toast"; }, 3000); }
function fmtMoney(m) { return '¥' + parseFloat(m || 0).toLocaleString('zh-CN', {minimumFractionDigits: 0, maximumFractionDigits: 2}); }

function loadDashboardData() {
  axios.get("/dashboard/overview").then(function(res) {
    var d = res.data || {};
    document.getElementById("s-ownerCount").textContent = d.ownerCount || 0;
    document.getElementById("s-houseCount").textContent = d.houseCount || 0;
    document.getElementById("s-occupiedCount").textContent = d.occupiedCount || 0;
    document.getElementById("s-vacantCount").textContent = d.vacantCount || 0;
    document.getElementById("s-paidAmount").textContent = fmtMoney(d.totalPaidAmount);
    document.getElementById("s-paymentRate").textContent = d.paymentRate || "0%";
  });
  axios.get("/dashboard/payment").then(function(res) {
    var d = res.data || {};
    document.getElementById("s-totalBills").textContent = (d.totalBills || 0) + " 笔";
    document.getElementById("s-confirmedAmount").textContent = fmtMoney(d.totalPaidAmount);
    document.getElementById("s-overdueBills").textContent = fmtMoney(d.totalOverdueAmount);
    document.getElementById("s-overdueAmount").textContent = fmtMoney(d.totalOverdueAmount);
  });
  axios.get("/dashboard/repair").then(function(res) {
    var d = res.data || {};
    document.getElementById("s-totalOrders").textContent = d.totalOrders || 0;
    document.getElementById("s-completedOrders").textContent = d.completedOrders || 0;
    document.getElementById("s-avgResponse").textContent = d.avgResponseTime || "-";
    document.getElementById("s-satisfaction").textContent = d.satisfactionRate || "-";
  });
  axios.get("/dashboard/ai").then(function(res) {
    var d = res.data || {};
    document.getElementById("s-totalReminds").textContent = d.totalReminds || 0;
    document.getElementById("s-successRate").textContent = d.successRate || "-";
    document.getElementById("s-recoveredAmount").textContent = fmtMoney(d.recoveredAmount);
    document.getElementById("s-aiReminds").textContent = (d.sentReminds || 0) + " 条";
    var rate = parseFloat(d.successRate) || 0;
    document.getElementById("s-remindBar").style.width = rate + "%";
  });
  axios.post("/rental/findPage", { currentPage: 1, pageSize: 1, status: 1 }).then(function(res) {
    document.getElementById("s-activeRentals").textContent = res.data.total || 0;
  });
}

function loadReportTable() {
  axios.post("/payment/findPage", { currentPage: 1, pageSize: 100 }).then(function(res) {
    var list = res.data.rows || [];
    var grouped = {};
    list.forEach(function(p) {
      var period = p.period || "未知";
      if (!grouped[period]) grouped[period] = { total: 0, paid: 0, overdue: 0, amount: 0 };
      grouped[period].total++;
      if (p.payStatus == 1 || p.payStatus == 2) { grouped[period].paid++; grouped[period].amount += parseFloat(p.amount) || 0; }
      if (p.payStatus == 3) grouped[period].overdue++;
    });
    var periods = Object.keys(grouped).sort().reverse();
    var tb = document.getElementById("reportTbody");
    if (!periods.length) { tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px">暂无数据</td></tr>'; return; }
    var h = "";
    periods.forEach(function(period) {
      var g = grouped[period];
      var rate = g.total > 0 ? (g.paid / g.total * 100).toFixed(1) + "%" : "0%";
      h += "<tr><td><strong>" + period + "</strong></td><td>" + g.total + "</td><td>" + g.paid + "</td><td>" + g.overdue + "</td><td style='font-weight:700;'>" + fmtMoney(g.amount) + "</td><td><span class='tag " + (parseFloat(rate) >= 90 ? "tag-ok" : parseFloat(rate) >= 70 ? "tag-info" : "tag-overdue") + "'>" + rate + "</span></td></tr>";
    });
    tb.innerHTML = h;
  });
}

window.exportCSV = function() {
  var rows = document.querySelectorAll('#reportTbody tr');
  var csv = '周期,账单数,已缴,逾期,已确认金额,收缴率\n';
  rows.forEach(function(tr) {
    var cells = tr.querySelectorAll('td');
    var row = [];
    cells.forEach(function(td) { row.push(td.textContent.trim()); });
    csv += row.join(',') + '\n';
  });
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '收缴明细表_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('导出成功：' + a.download);
};

loadDashboardData();
loadReportTable();
initSidebar("report:payment");
</script>
</body>
</html>
