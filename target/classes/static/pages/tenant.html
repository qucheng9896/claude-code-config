<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>租户管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">租户管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">租户总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"></div><div class="stat-card-value" id="s-active">-</div><div class="stat-card-label">在租租户</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"></div><div class="stat-card-value" id="s-checkout">-</div><div class="stat-card-label">已退租</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-rose"></div><div class="stat-card-value" id="s-blacklist">-</div><div class="stat-card-label">黑名单</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" id="searchInput" placeholder="搜索租户姓名、手机号"><select class="filter-select" id="filterStatus"><option value="">全部状态</option><option value="1">在租</option><option value="0">已退租</option><option value="2">黑名单</option></select><button class="btn btn-ghost" id="btnSearch">搜索</button></div></div><button class="btn btn-primary" id="btnAdd">+ 新增租户</button></div>
      <div class="data-card"><table><thead><tr><th>ID</th><th>姓名</th><th>手机号</th><th>身份证</th><th>紧急联系人</th><th>紧急电话</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="tenantTbody"></tbody></table>
        <div class="table-footer"><span class="table-footer-info" id="tableInfo">加载中...</span><div class="pagination" id="pagination"></div></div>
      </div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="formModal"><div class="modal"><h3 id="modalTitle">新增租户</h3><input type="hidden" id="f-id">
  <div class="form-group"><label>姓名 *</label><input type="text" class="form-input" id="f-name" placeholder="请输入姓名"></div>
  <div class="form-group"><label>手机号 *</label><input type="text" class="form-input" id="f-phone" placeholder="请输入手机号"></div>
  <div class="form-group"><label>身份证</label><input type="text" class="form-input" id="f-idCard" placeholder="请输入身份证号"></div>
  <div class="form-group"><label>紧急联系人</label><input type="text" class="form-input" id="f-emergencyContact" placeholder="请输入紧急联系人"></div>
  <div class="form-group"><label>紧急联系电话</label><input type="text" class="form-input" id="f-emergencyPhone" placeholder="请输入紧急联系电话"></div>
  <div class="form-group"><label>状态</label><select class="form-input" id="f-status"><option value="1">在租</option><option value="0">已退租</option><option value="2">黑名单</option></select></div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;
function showToast(msg) { var el = document.getElementById("toast"); if (!el) return; el.textContent = msg; el.className = "toast show"; setTimeout(function() { el.className = "toast"; }, 3000); }
function loadList(page) {
  currentPage = page || 1;
  var q = document.getElementById("searchInput").value.trim();
  var status = document.getElementById("filterStatus").value;
  var params = { currentPage: currentPage, pageSize: pageSize, queryString: q };
  if (status) params.status = parseInt(status);
  axios.post("/tenant/findPage", params).then(function(res) {
    renderTable(res.data.rows);
    totalPages = Math.ceil(res.data.total / pageSize) || 1;
    document.getElementById("tableInfo").textContent = "显示第" + ((currentPage-1)*pageSize+1) + "-" + Math.min(currentPage*pageSize, res.data.total) + " 条，共 " + res.data.total + " 条";
    renderPagination();
  });
}
function renderTable(list) {
  var tb = document.getElementById("tenantTbody");
  if (!list || !list.length) { tb.innerHTML = "<tr><td colspan=\"9\" style=\"text-align:center;color:#94a3b8;padding:40px\">暂无数据</td></tr>"; return; }
  var h = "";
  list.forEach(function(t) {
    var statusMap = { "1": "<span class='tag tag-ok'>在租</span>", "0": "<span class='tag tag-off'>已退租</span>", "2": "<span class='tag tag-overdue'>黑名单</span>" };
    h += "<tr><td>" + t.id + "</td><td><strong>" + (t.name || "-") + "</strong></td><td>" + (t.phone || "-") + "</td><td>" + (t.idCard || "-") + "</td><td>" + (t.emergencyContact || "-") + "</td><td>" + (t.emergencyPhone || "-") + "</td><td>" + (statusMap[t.status] || "-") + "</td><td>" + (t.createTime ? t.createTime.substring(0,10) : "-") + "</td><td class='action-btns'><button class='btn-icon btn-edit' data-id='" + t.id + "'>编辑</button><button class='btn-icon btn-icon-danger btn-del' data-id='" + t.id + "'>删除</button></td></tr>";
  });
  tb.innerHTML = h;
  tb.querySelectorAll(".btn-edit").forEach(function(b) { b.addEventListener("click", function() { openEdit(this.dataset.id); }); });
  tb.querySelectorAll(".btn-del").forEach(function(b) { b.addEventListener("click", function() { doDelete(this.dataset.id); }); });
}
function renderPagination() {
  var p = document.getElementById("pagination");
  var h = "<button class='page-btn" + (currentPage<=1?" disabled":"") + "' data-page='" + (currentPage-1) + "'>‹</button>";
  for (var i=1;i<=totalPages;i++) h += "<button class='page-btn"+(i===currentPage?" active":"")+"' data-page='"+i+"'>"+i+"</button>";
  h += "<button class='page-btn"+(currentPage>=totalPages?" disabled":"")+"' data-page='"+(currentPage+1)+"'>›</button>";
  p.innerHTML = h;
  p.querySelectorAll(".page-btn").forEach(function(b) { b.addEventListener("click", function() { var pg=parseInt(this.dataset.page); if(pg>=1&&pg<=totalPages) loadList(pg); }); });
}
function loadStats() {
  axios.post("/tenant/findPage", { currentPage: 1, pageSize: 1 }).then(function(res) {
    var total = res.data.total || 0;
    document.getElementById("s-total").textContent = total;
  });
}
function openAdd() {
  document.getElementById("modalTitle").textContent = "新增租户";
  document.getElementById("f-id").value = "";
  ["f-name","f-phone","f-idCard","f-emergencyContact","f-emergencyPhone"].forEach(function(id){document.getElementById(id).value="";});
  document.getElementById("f-status").value = "1";
  document.getElementById("formModal").classList.add("show");
}
function openEdit(id) {
  axios.get("/tenant/findById/" + id).then(function(res) {
    var t = res.data;
    document.getElementById("modalTitle").textContent = "编辑租户";
    document.getElementById("f-id").value = t.id;
    document.getElementById("f-name").value = t.name || "";
    document.getElementById("f-phone").value = t.phone || "";
    document.getElementById("f-idCard").value = t.idCard || "";
    document.getElementById("f-emergencyContact").value = t.emergencyContact || "";
    document.getElementById("f-emergencyPhone").value = t.emergencyPhone || "";
    document.getElementById("f-status").value = t.status != null ? t.status : "1";
    document.getElementById("formModal").classList.add("show");
  });
}
function doSave() {
  var id = document.getElementById("f-id").value;
  var data = {
    name: document.getElementById("f-name").value.trim(),
    phone: document.getElementById("f-phone").value.trim(),
    idCard: document.getElementById("f-idCard").value.trim(),
    emergencyContact: document.getElementById("f-emergencyContact").value.trim(),
    emergencyPhone: document.getElementById("f-emergencyPhone").value.trim(),
    status: parseInt(document.getElementById("f-status").value)
  };
  if (!data.name) { showToast("请填写姓名"); return; }
  if (!data.phone) { showToast("请填写手机号"); return; }
  var p = id ? axios.put("/tenant/edit", Object.assign({ id: parseInt(id) }, data)) : axios.post("/tenant/add", data);
  p.then(function() { showToast(id ? "修改成功" : "新增成功"); closeModal("form"); loadList(currentPage); });
}
function doDelete(id) { if (!confirm("确认删除该租户吗？此操作不可恢复。")) return; axios.delete("/tenant/delete/" + id).then(function() { showToast("删除成功"); loadList(currentPage); }); }
function closeModal(n) { document.getElementById(n + "Modal").classList.remove("show"); }
document.getElementById("btnAdd").addEventListener("click", openAdd);
document.getElementById("btnSave").addEventListener("click", doSave);
document.getElementById("btnSearch").addEventListener("click", function() { loadList(1); });
document.getElementById("searchInput").addEventListener("keydown", function(e) { if (e.key === "Enter") loadList(1); });
document.getElementById("filterStatus").addEventListener("change", function() { loadList(1); });
document.getElementById("formModal").addEventListener("click", function(e) { if (e.target === this) this.classList.remove("show"); });
loadList(1); initSidebar("tenant:list");
</script>
</body>
</html>
