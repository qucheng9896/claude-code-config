<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>租户管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">租户管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats">
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-card-value">89</div><div class="stat-card-label">在租租户</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="stat-card-value">76</div><div class="stat-card-label">生效合同</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value">8</div><div class="stat-card-label">即将到期</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-rose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg></div><div class="stat-card-value">3</div><div class="stat-card-label">黑名单</div></div>
      </div>
      <div class="toolbar"><div class="toolbar-left"><div class="search-group"><input type="text" class="search-input" placeholder="搜索租户姓名、手机号"><select class="filter-select"><option value="">全部状态</option><option>在租</option><option>已退租</option><option>黑名单</option></select><button class="btn btn-ghost">搜索</button></div></div><button class="btn btn-primary">+ 新增租户</button></div>
      <div class="data-card"><table><thead><tr><th>ID</th><th>姓名</th><th>手机号</th><th>身份证</th><th>紧急联系人</th><th>合同状态</th><th>操作</th></tr></thead><tbody></tbody></table><div class="table-footer"><span class="table-footer-info">加载中...</span><div class="pagination"><button class="page-btn disabled">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div></div></div>
    </div>
  </main>
</div>
<script src="../js/sidebar.js"></script><script src="../js/page-common.js"></script><script>
initPage({
  name: '租户管理',
  api: {
    findPage: API.tenantFindPage,
    findById: API.tenantFindById,
    add: API.tenantAdd,
    edit: API.tenantEdit,
    delete: API.tenantDelete,
    checkout: API.tenantCheckout
  },
  renderRow: function(item, index) {
    var statusMap = {0: ['tag-off', '已退租'], 1: ['tag-ok', '在租'], 2: ['tag-overdue', '黑名单']};
    var s = statusMap[item.status] || statusMap[1];
    return '<td>' + item.id + '</td>' +
      '<td><strong>' + (item.name || item.tenantName || '-') + '</strong></td>' +
      '<td>' + (item.phone || '-') + '</td>' +
      '<td>' + (item.idCard || '-') + '</td>' +
      '<td>' + (item.emergencyContact || '-') + '</td>' +
      '<td><span class="tag ' + s[0] + '">' + s[1] + '</span></td>' +
      '<td class="action-btns"><button class="btn-icon">编辑</button><button class="btn-icon">退租</button><button class="btn-icon btn-icon-danger">拉黑</button></td>';
  },
  hashActions: { add: function(){ openAddModal(); } }
});
initSidebar('tenant:list');
</script>
<div class="modal-overlay" id="editModal"><div class="modal"><h3>编辑信息</h3><div class="form-group"><label>名称 *</label><input type="text" class="form-input" placeholder="请输入"></div><div class="form-group"><label>备注</label><textarea class="form-input" rows="3" placeholder="备注信息"></textarea></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('edit')">取消</button><button class="btn btn-primary">保存修改</button></div></div></div>
</body>
</html>
