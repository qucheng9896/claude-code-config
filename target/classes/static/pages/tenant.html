<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>租户管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">租户管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats" id="tenantStats">
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">租户总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></div><div class="stat-card-value" id="s-active">-</div><div class="stat-card-label">在租中</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value" id="s-checkout">-</div><div class="stat-card-label">已退租</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-rose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg></div><div class="stat-card-value" id="s-blacklist">-</div><div class="stat-card-label">黑名单</div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-group">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索租户姓名、手机号">
            <button class="btn btn-ghost" id="btnSearch">搜索</button>
          </div>
          <select class="form-input" id="filterStatus" style="width:auto;margin-left:8px;">
            <option value="">全部状态</option>
            <option value="1">在租</option>
            <option value="0">已退租</option>
            <option value="2">黑名单</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ 新增租户</button>
      </div>
      <div class="data-card">
        <table>
          <thead><tr><th>ID</th><th>姓名</th><th>手机号</th><th>身份证</th><th>紧急联系人</th><th>紧急联系电话</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="tenantTbody"></tbody>
        </table>
        <div class="table-footer">
          <span class="table-footer-info" id="tableInfo">加载中...</span>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h3 id="modalTitle">新增租户</h3>
    <input type="hidden" id="f-id">
    <div class="form-group"><label>姓名 *</label><input type="text" class="form-input" id="f-name" placeholder="请输入姓名"></div>
    <div class="form-group"><label>手机号 *</label><input type="text" class="form-input" id="f-phone" placeholder="请输入手机号"></div>
    <div class="form-group"><label>身份证</label><input type="text" class="form-input" id="f-idcard" placeholder="请输入身份证号"></div>
    <div class="form-group"><label>紧急联系人</label><input type="text" class="form-input" id="f-emergency" placeholder="请输入紧急联系人"></div>
    <div class="form-group"><label>紧急联系电话</label><input type="text" class="form-input" id="f-emergency-phone" placeholder="请输入紧急联系电话"></div>
    <div class="form-group"><label>状态</label>
      <select class="form-input" id="f-status"><option value="1">在租</option><option value="0">已退租</option><option value="2">黑名单</option></select>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;

function showToast(msg, type) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show toast-' + (type || 'success');
  clearTimeout(el._timer);
  el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000);
}

function loadList(page) {
  currentPage = page || 1;
  var queryString = document.getElementById('searchInput').value.trim();
  var status = document.getElementById('filterStatus').value;
  if (status) queryString = queryString ? queryString + ' ' + status : status;
  axios.post('/tenant/findPage', { currentPage: currentPage, pageSize: pageSize, queryString: queryString }).then(function(res) {
    renderTable(res.data.rows);
    totalPages = Math.ceil(res.data.total / pageSize) || 1;
    renderPagination(document.getElementById('tableInfo'), res.data.total);
    loadStats();
  }).catch(function() { showToast('加载失败', 'error'); });
}

function renderTable(list) {
  var tbody = document.getElementById('tenantTbody');
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>';
    return;
  }
  var html = '';
  list.forEach(function(t) {
    var statusTag = t.status == 1 ? '<span class="tag tag-ok">在租</span>' : (t.status == 2 ? '<span class="tag tag-overdue">黑名单</span>' : '<span class="tag tag-off">已退租</span>');
    html += '<tr>';
    html += '<td>' + t.id + '</td>';
    html += '<td><strong>' + escapeHtml(t.name) + '</strong></td>';
    html += '<td>' + escapeHtml(t.phone || '-') + '</td>';
    html += '<td>' + escapeHtml(t.idCard || '-') + '</td>';
    html += '<td>' + escapeHtml(t.emergencyContact || '-') + '</td>';
    html += '<td>' + escapeHtml(t.emergencyPhone || '-') + '</td>';
    html += '<td>' + statusTag + '</td>';
    html += '<td class="action-btns">';
    html += '<button class="btn-icon btn-edit" data-id="' + t.id + '">编辑</button>';
    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + t.id + '">删除</button>';
    html += '</td></tr>';
  });
  tbody.innerHTML = html;
  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });
  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });
}

function renderPagination(infoEl, total) {
  infoEl.textContent = '显示第 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条';
  var pag = document.getElementById('pagination');
  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">‹</button>';
  for (var p = 1; p <= totalPages; p++) html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">›</button>';
  pag.innerHTML = html;
  pag.querySelectorAll('.page-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); });
  });
}

function loadStats() {
  axios.post('/tenant/findPage', { currentPage: 1, pageSize: 9999, queryString: '' }).then(function(res) {
    var list = res.data.rows;
    document.getElementById('s-total').textContent = list.length;
    document.getElementById('s-active').textContent = list.filter(function(t) { return t.status == 1; }).length;
    document.getElementById('s-checkout').textContent = list.filter(function(t) { return t.status == 0; }).length;
    document.getElementById('s-blacklist').textContent = list.filter(function(t) { return t.status == 2; }).length;
  });
}

function openAdd() {
  document.getElementById('modalTitle').textContent = '新增租户';
  document.getElementById('f-id').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-phone').value = '';
  document.getElementById('f-idcard').value = '';
  document.getElementById('f-emergency').value = '';
  document.getElementById('f-emergency-phone').value = '';
  document.getElementById('f-status').value = '1';
  document.getElementById('formModal').classList.add('show');
}

function openEdit(id) {
  axios.get('/tenant/findById/' + id).then(function(res) {
    var t = res.data;
    document.getElementById('modalTitle').textContent = '编辑租户';
    document.getElementById('f-id').value = t.id;
    document.getElementById('f-name').value = t.name || '';
    document.getElementById('f-phone').value = t.phone || '';
    document.getElementById('f-idcard').value = t.idCard || '';
    document.getElementById('f-emergency').value = t.emergencyContact || '';
    document.getElementById('f-emergency-phone').value = t.emergencyPhone || '';
    document.getElementById('f-status').value = t.status != null ? t.status : '1';
    document.getElementById('formModal').classList.add('show');
  });
}

function doSave() {
  var id = document.getElementById('f-id').value;
  var data = {
    name: document.getElementById('f-name').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    idCard: document.getElementById('f-idcard').value.trim(),
    emergencyContact: document.getElementById('f-emergency').value.trim(),
    emergencyPhone: document.getElementById('f-emergency-phone').value.trim(),
    status: parseInt(document.getElementById('f-status').value)
  };
  if (!data.name) { showToast('请填写姓名', 'error'); return; }
  if (!data.phone) { showToast('请填写手机号', 'error'); return; }
  var promise = id ? axios.put('/tenant/edit', Object.assign({id: parseInt(id)}, data)) : axios.post('/tenant/add', data);
  promise.then(function() { showToast(id ? '修改成功' : '新增成功'); closeModal('form'); loadList(currentPage); }).catch(function() {});
}

function doDelete(id) {
  if (!confirm('确认删除该租户吗？此操作不可恢复。')) return;
  axios.delete('/tenant/delete/' + id).then(function() { showToast('删除成功'); loadList(currentPage); }).catch(function() {});
}

function closeModal(name) { document.getElementById(name + 'Modal').classList.remove('show'); }
function escapeHtml(s) { return s ? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '-'; }

document.getElementById('btnAdd').addEventListener('click', openAdd);
document.getElementById('btnSave').addEventListener('click', doSave);
document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); });
document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); });
document.getElementById('filterStatus').addEventListener('change', function() { loadList(1); });
document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });

loadList(1);
initSidebar('tenant:list');
</script>
</body>
</html>
