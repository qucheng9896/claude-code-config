<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访客管理 - 物业管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="admin-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div class="topbar-title">访客管理</div><div class="topbar-user"><span>欢迎，<strong>管理员</strong></span><div class="topbar-avatar">A</div></div></div>
    <div class="page-body">
      <div class="stats" id="visitorStats">
        <div class="stat-card"><div class="stat-card-icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg></div><div class="stat-card-value" id="s-total">-</div><div class="stat-card-label">访客总数</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/></svg></div><div class="stat-card-value" id="s-checked">-</div><div class="stat-card-label">已核验</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-card-value" id="s-pending">-</div><div class="stat-card-label">待核验</div></div>
        <div class="stat-card"><div class="stat-card-icon bg-purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/></svg></div><div class="stat-card-value" id="s-expired">-</div><div class="stat-card-label">已过期</div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-group">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索访客姓名、手机号">
            <button class="btn btn-ghost" id="btnSearch">搜索</button>
          </div>
          <select class="form-input" id="filterStatus" style="width:auto;margin-left:8px;">
            <option value="">全部状态</option>
            <option value="0">待核验</option>
            <option value="1">已核验</option>
            <option value="2">已过期</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnAdd">+ 新增访客</button>
      </div>
      <div class="data-card">
        <table>
          <thead><tr><th>ID</th><th>访客姓名</th><th>联系电话</th><th>被访业主</th><th>被访房屋</th><th>预约时间</th><th>通行方式</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="visitorTbody"></tbody>
        </table>
        <div class="table-footer">
          <span class="table-footer-info" id="tableInfo">加载中...</span>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h3 id="modalTitle">新增访客</h3>
    <input type="hidden" id="f-id">
    <div class="form-group"><label>访客姓名 *</label><input type="text" class="form-input" id="f-name" placeholder="请输入姓名"></div>
    <div class="form-group"><label>联系电话 *</label><input type="text" class="form-input" id="f-phone" placeholder="请输入手机号"></div>
    <div class="form-group"><label>被访业主</label>
      <select class="form-input" id="f-owner"><option value="">请选择业主</option></select>
    </div>
    <div class="form-group"><label>被访房屋</label>
      <select class="form-input" id="f-house"><option value="">请选择房屋</option></select>
    </div>
    <div class="form-group"><label>预约时间</label><input type="datetime-local" class="form-input" id="f-reserve"></div>
    <div class="form-group"><label>通行方式</label>
      <select class="form-input" id="f-access"><option value="临时密码">临时密码</option><option value="人脸授权">人脸授权</option><option value="刷卡">刷卡</option></select>
    </div>
    <div class="form-group"><label>状态</label>
      <select class="form-input" id="f-status"><option value="0">待核验</option><option value="1">已核验</option><option value="2">已过期</option></select>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('form')">取消</button><button class="btn btn-primary" id="btnSave">保存</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script src="../js/axios-config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
var currentPage = 1, pageSize = 10, totalPages = 1;

function showToast(msg, type) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show toast-' + (type || 'success');
  clearTimeout(el._timer);
  el._timer = setTimeout(function() { el.className = 'toast toast-' + (type || 'success'); }, 3000);
}

function loadOwners() {
  return axios.post('/owner/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {
    var opts = '<option value="">请选择业主</option>';
    res.data.rows.forEach(function(o) { opts += '<option value="' + o.id + '">' + escapeHtml(o.name) + '</option>'; });
    document.getElementById('f-owner').innerHTML = opts;
  });
}

function loadHouses() {
  return axios.post('/house/findPage', { currentPage: 1, pageSize: 999, queryString: '' }).then(function(res) {
    var opts = '<option value="">请选择房屋</option>';
    res.data.rows.forEach(function(h) { opts += '<option value="' + h.id + '">' + escapeHtml(h.buildingName + '-' + h.roomNo) + '</option>'; });
    document.getElementById('f-house').innerHTML = opts;
  });
}

function loadList(page) {
  currentPage = page || 1;
  var queryString = document.getElementById('searchInput').value.trim();
  var status = document.getElementById('filterStatus').value;
  if (status) queryString = queryString ? queryString + ' ' + status : status;
  axios.post('/visitor/findPage', { currentPage: currentPage, pageSize: pageSize, queryString: queryString }).then(function(res) {
    renderTable(res.data.rows);
    totalPages = Math.ceil(res.data.total / pageSize) || 1;
    renderPagination(document.getElementById('tableInfo'), res.data.total);
    loadStats();
  }).catch(function() { showToast('加载失败', 'error'); });
}

function renderTable(list) {
  var tbody = document.getElementById('visitorTbody');
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:40px">暂无数据</td></tr>';
    return;
  }
  var html = '';
  list.forEach(function(v) {
    var statusTag = v.status == 1 ? '<span class="tag tag-ok">已核验</span>' : (v.status == 2 ? '<span class="tag tag-off">已过期</span>' : '<span class="tag tag-info">待核验</span>');
    html += '<tr>';
    html += '<td>' + v.id + '</td>';
    html += '<td><strong>' + escapeHtml(v.name) + '</strong></td>';
    html += '<td>' + escapeHtml(v.phone || '-') + '</td>';
    html += '<td>' + escapeHtml(v.ownerName || '-') + '</td>';
    html += '<td>' + escapeHtml(v.houseAddress || '-') + '</td>';
    html += '<td>' + (v.reserveTime ? v.reserveTime.replace('T', ' ').substr(0, 16) : '-') + '</td>';
    html += '<td>' + escapeHtml(v.accessMethod || '-') + '</td>';
    html += '<td>' + statusTag + '</td>';
    html += '<td class="action-btns">';
    html += '<button class="btn-icon btn-edit" data-id="' + v.id + '">编辑</button>';
    html += '<button class="btn-icon btn-icon-danger btn-del" data-id="' + v.id + '">删除</button>';
    html += '</td></tr>';
  });
  tbody.innerHTML = html;
  tbody.querySelectorAll('.btn-edit').forEach(function(btn) { btn.addEventListener('click', function() { openEdit(this.dataset.id); }); });
  tbody.querySelectorAll('.btn-del').forEach(function(btn) { btn.addEventListener('click', function() { doDelete(this.dataset.id); }); });
}

function renderPagination(infoEl, total) {
  infoEl.textContent = '显示第 ' + ((currentPage - 1) * pageSize + 1) + '-' + Math.min(currentPage * pageSize, total) + ' 条，共 ' + total + ' 条';
  var pag = document.getElementById('pagination');
  var html = '<button class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">‹</button>';
  for (var p = 1; p <= totalPages; p++) html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
  html += '<button class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">›</button>';
  pag.innerHTML = html;
  pag.querySelectorAll('.page-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { var pg = parseInt(this.dataset.page); if (pg >= 1 && pg <= totalPages) loadList(pg); });
  });
}

function loadStats() {
  axios.post('/visitor/findPage', { currentPage: 1, pageSize: 9999, queryString: '' }).then(function(res) {
    var list = res.data.rows;
    document.getElementById('s-total').textContent = list.length;
    document.getElementById('s-checked').textContent = list.filter(function(v) { return v.status == 1; }).length;
    document.getElementById('s-pending').textContent = list.filter(function(v) { return v.status == 0; }).length;
    document.getElementById('s-expired').textContent = list.filter(function(v) { return v.status == 2; }).length;
  });
}

function openAdd() {
  document.getElementById('modalTitle').textContent = '新增访客';
  document.getElementById('f-id').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-phone').value = '';
  document.getElementById('f-owner').value = '';
  document.getElementById('f-house').value = '';
  document.getElementById('f-reserve').value = '';
  document.getElementById('f-access').value = '临时密码';
  document.getElementById('f-status').value = '0';
  document.getElementById('formModal').classList.add('show');
}

function openEdit(id) {
  axios.get('/visitor/findById/' + id).then(function(res) {
    var v = res.data;
    document.getElementById('modalTitle').textContent = '编辑访客';
    document.getElementById('f-id').value = v.id;
    document.getElementById('f-name').value = v.name || '';
    document.getElementById('f-phone').value = v.phone || '';
    document.getElementById('f-owner').value = v.ownerId || '';
    document.getElementById('f-house').value = v.houseId || '';
    document.getElementById('f-reserve').value = v.reserveTime ? v.reserveTime.substr(0, 16) : '';
    document.getElementById('f-access').value = v.accessMethod || '临时密码';
    document.getElementById('f-status').value = v.status != null ? v.status : '0';
    document.getElementById('formModal').classList.add('show');
  });
}

function doSave() {
  var id = document.getElementById('f-id').value;
  var data = {
    name: document.getElementById('f-name').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    ownerId: parseInt(document.getElementById('f-owner').value) || null,
    houseId: parseInt(document.getElementById('f-house').value) || null,
    reserveTime: document.getElementById('f-reserve').value || null,
    accessMethod: document.getElementById('f-access').value,
    status: parseInt(document.getElementById('f-status').value)
  };
  if (!data.name) { showToast('请填写访客姓名', 'error'); return; }
  if (!data.phone) { showToast('请填写联系电话', 'error'); return; }
  var promise = id ? axios.put('/visitor/edit', Object.assign({id: parseInt(id)}, data)) : axios.post('/visitor/add', data);
  promise.then(function() { showToast(id ? '修改成功' : '新增成功'); closeModal('form'); loadList(currentPage); }).catch(function() {});
}

function doDelete(id) {
  if (!confirm('确认删除该访客吗？此操作不可恢复。')) return;
  axios.delete('/visitor/delete/' + id).then(function() { showToast('删除成功'); loadList(currentPage); }).catch(function() {});
}

function closeModal(name) { document.getElementById(name + 'Modal').classList.remove('show'); }
function escapeHtml(s) { return s ? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '-'; }

document.getElementById('btnAdd').addEventListener('click', openAdd);
document.getElementById('btnSave').addEventListener('click', doSave);
document.getElementById('btnSearch').addEventListener('click', function() { loadList(1); });
document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadList(1); });
document.getElementById('filterStatus').addEventListener('change', function() { loadList(1); });
document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });

Promise.all([loadOwners(), loadHouses()]).then(function() { loadList(1); }).catch(function() {});
initSidebar('visitor:list');
</script>
</body>
</html>
